<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Cash Hub</title>

    <script src="https://telegram.org"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07080c;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        #wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            box-sizing: border-box;
            padding-bottom: 70px;
        }

        /* شريط الحساب العلوي المتطور */
        #top-profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20,24,35,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #user-avatar {
            width: 38px;
            height: 36px;
            border-radius: 50%;
            background: #1f2833;
            background-size: cover;
            border: 2px solid #0066ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bal-title {
            font-size: 11px;
            color: #6d7f9f;
        }

        .bal-amount {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #deposit-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* منطقة المحتوى القابلة للتغيير */
        #main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .page-view {
            display: none;
        }

        .page-view.active {
            display: block;
        }

        /* تصميم الواجهة الرئيسية الكبرى للألعاب */
        .hub-banner {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid rgba(102,252,241,0.1);
        }

        .hub-banner img {
            width: 100%;
            display: block;
        }

        .game-card-rocket {
            background: linear-gradient(135deg, #1c2638 0%, #0f141d 100%);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #0066ff;
            text-align: left;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .card-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ff4757;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-sub {
            font-size: 12px;
            color: #66fcf1;
        }

        /* ساحة لعبة الصاروخ الكلاسيكية */
        #game-container {
            position: relative;
            width: 100%;
            height: 32vh;
            background: radial-gradient(#151c24, #07080c);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mult {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            font-weight: 900;
            color: #66fcf1;
            font-family: monospace;
            z-index: 10;
        }

        #count-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            display: none;
            z-index: 15;
            animation: zPop 0.4s ease-out infinite alternate;
        }

        @keyframes zPop {
            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

        #history-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            overflow-x: auto;
            min-height: 35px;
            align-items: center;
        }

        .h-item {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #4e9f3d;
        }

        .c-red {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233,69,96,0.15);
        }

        .c-blue {
            border-color: #0066ff;
            color: #0066ff;
            background: rgba(0,102,255,0.15);
        }

        .c-green {
            border-color: #4e9f3d;
            color: #4e9f3d;
            background: rgba(78,159,61,0.15);
        }

        #main-action-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        #main-action-btn.betting {
            background: #e94560;
        }

        #p-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 30vh;
            overflow-y: auto;
        }

        .p-row {
            display: flex;
            justify-content: space-between;
            background: #131722;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
        }

        .row-win-low {
            background: rgba(78, 159, 61, 0.08)!important;
            border: 1px solid rgba(78, 159, 61, 0.4)!important;
        }

        .row-win-low b {
            color: #4e9f3d!important;
        }

        .row-lose {
            background: rgba(233, 69, 96, 0.06)!important;
            border: 1px solid rgba(233, 69, 96, 0.3)!important;
        }

        .row-lose b {
            color: #e94560!important;
        }

        /* تصميم الحقيبة والهدايا الـ NFT */
        .pack-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 10px;
        }

        .gift-box-card {
            background: #131722;
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
        }

        .gift-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .gift-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .gift-status {
            font-size: 11px;
            color: #0066ff;
        }

        /* شريط التنقل السفلي الثابت والمطابق تماماً */
        #bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: #0f121a;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #516381;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #0066ff;
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <!-- شريط علوي موحد للبروفايل مأخوذ من تليجرام الحقيقي -->
    <div id="top-profile-bar">
        <div class="user-meta">
            <div id="user-avatar">U</div>

            <div class="balance-info">
                <div id="user-name" class="bal-title">Your balance</div>

                <div class="bal-amount">
                    <span id="top-balance-text">10.00</span>
                    <span>💎</span>
                </div>
            </div>
        </div>

        <button id="deposit-btn">Deposit</button>
    </div>

    <div id="wrapper">

        <div id="main-content">

            <!-- صفحة الرائيسية (جميع الألعاب) -->
            <div id="page-home" class="page-view active">

                <div class="game-card-rocket" onclick="navigateToGame()">
                    <div class="card-tag">🔥 HOT!</div>
                    <div class="card-title">ROCKET</div>
                    <div class="card-sub">x6.46 | x1.94 | x3.09</div>
                </div>

                <div
                    class="game-card-rocket"
                    style="border-color:#ffa500; background:linear-gradient(135deg, #241c12, #14100c)"
                >
                    <div class="card-tag" style="background:#ffa500">🏆 LIVE</div>
                    <div class="card-title" style="color:#ffa500">PVP MODE</div>
                    <div class="card-sub" style="color:#ccc">
                        Compete with other players online
                    </div>
                </div>

            </div>

            <!-- صفحة لعبة الصاروخ الحركية الكلاسيكية -->
            <div id="page-game" class="page-view">

                <div id="game-container">
                    <div id="mult">1.00x</div>
                    <div id="count-box">5</div>
                    <canvas id="gameCanvas"></canvas>
                </div>

                <div id="control-panel">

                    <div id="history-bar"></div>

                    <button
                        id="main-action-btn"
                        onclick="handleAction()"
                    >
                        Place bet
                    </button>

                </div>

                <div id="p-list"></div>

            </div>

            <!-- صفحة الحقيبة والهدايا الـ NFT المتاحة لدى اللاعب -->
            <div id="page-backpack" class="page-view">

                <h3>My Backpack (NFT Gifts)</h3>

                <div class="pack-grid">

                    <div class="gift-box-card">
                        <div class="gift-icon">🎃</div>
                        <div class="gift-title">Halloween Gift</div>
                        <div class="gift-status">Available</div>
                    </div>

                    <div class="gift-box-card">
                        <div class="gift-icon">👑</div>
                        <div class="gift-title">Premium Crown</div>
                        <div class="gift-status">Equipped</div>
                    </div>

                </div>

            </div>

        </div>

        <!-- شريط التنقل السفلي الفاخر التلقائي والمطابق تماماً -->
        <div id="bottom-nav-bar">

            <button
                class="nav-item"
                onclick="switchPage('backpack', this)"
            >
                <div class="nav-icon">🎒</div>
                <div>Backpack</div>
            </button>

            <button
                class="nav-item active"
                onclick="switchPage('home', this)"
            >
                <div class="nav-icon">🏠</div>
                <div>Home</div>
            </button>

        </div>

    </div>

    <script>

        // كود تليجرام السحري للتعرف التلقائي على حساب وصورة واسم اللاعب الحقيقي
        let userName = "Player";

        if (window.Telegram && window.Telegram.WebApp) {

            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();

            const initData = window.Telegram.WebApp.initDataUnsafe;

            if (initData && initData.user) {

                userName =
                    initData.user.first_name +
                    (initData.user.last_name
                        ? " " + initData.user.last_name
                        : "");

                document.getElementById('user-name').innerText = userName;

                if (initData.user.photo_url) {

                    document.getElementById('user-avatar').style.backgroundImage =
                        `url('${initData.user.photo_url}')`;

                    document.getElementById('user-avatar').innerText = "";

                } else {

                    document.getElementById('user-avatar').innerText =
                        initData.user.first_name.charAt(0).toUpperCase();

                }
            }
        }


        // نظام التبديل الذكي بين الصفحات والأزرار السفلية
        function switchPage(pageId, btnEl) {

            document
                .querySelectorAll('.page-view')
                .forEach(p => p.classList.remove('active'));

            document
                .querySelectorAll('.nav-item')
                .forEach(b => b.classList.remove('active'));

            document
                .getElementById('page-' + pageId)
                .classList.add('active');

            if (btnEl) {
                btnEl.classList.add('active');
            }
        }


        function navigateToGame() {
            switchPage('game', null);
        }


        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const mult = document.getElementById('mult');
        const mainBtn = document.getElementById('main-action-btn');
        const hBar = document.getElementById('history-bar');
        const pList = document.getElementById('p-list');
        const cBox = document.getElementById('count-box');
        const topBalanceText = document.getElementById('top-balance-text');


        let state = 'COUNTDOWN';
        let value = 1.00;
        let crash = 1.00;
        let loop;
        let path = [];
        let rx = 40;
        let ry = canvas.height - 40;

        let timer = 5;
        let countAngle = 0;
        let listPlayers = [];
        let lastTickTime = Date.now();

        let hasBet = false;
        let hasCashedOut = false;
        let userBalance = 10.00;
        let userBetAmount = 1.00;

        let historyList = [
            '3.70x',
            '3.07x',
            '1.00x',
            '2.37x'
        ];

        let stars = [];
        let particles = [];


        const pool = [
            {
                n: 'BOB',
                b: 0.10,
                cashOutPoint: 3.36,
                status: 'active'
            },
            {
                n: 'honey',
                b: 0.10,
                cashOutPoint: 2.27,
                status: 'active'
            }
        ];


        for (let i = 0; i < 30; i++) {

            stars.push({
                x: Math.random() * 800,
                y: Math.random() * 600,
                s: Math.random() * 1.5,
                sp: Math.random() * 1.2 + 0.6
            });

        }


        function getHColor(val) {

            if (val <= 1.30) {
                return '#e94560';
            }

            if (val <= 2.00) {
                return '#0066ff';
            }

            return '#4e9f3d';
        }


        function getHClass(val) {

            if (val <= 1.30) {
                return 'c-red';
            }

            if (val <= 2.00) {
                return 'c-blue';
            }

            return 'c-green';
        }


        function updateHistoryUI() {

            hBar.innerHTML = '';

            historyList
                .slice(-6)
                .reverse()
                .forEach(v => {

                    const d = document.createElement('div');

                    d.className =
                        'h-item ' +
                        getHClass(parseFloat(v));

                    d.innerText = v;

                    hBar.appendChild(d);

                });
        }


        function renderPlayers() {

            pList.innerHTML = '';

            listPlayers.forEach(p => {

                let rowClass = 'p-row';

                let rightVal = `🔹 ${p.b.toFixed(2)}`;


                if (p.status === 'win-low') {

                    rowClass += ' row-win-low';

                    rightVal =
                        `🔹 ${(p.b * p.winMult).toFixed(2)}`;

                } else if (p.status === 'lose') {

                    rowClass += ' row-lose';

                    rightVal = '💥 0.00';
                }


                const r = document.createElement('div');

                r.className = rowClass;

                r.innerHTML =
                    `<div>
                        <b>${p.n}</b>
                        <br>
                        <span class="p-blue">
                            🔹 ${p.b} ×1.00
                        </span>
                    </div>
                    <div>
                        <b>${rightVal}</b>
                    </div>`;


                pList.appendChild(r);

            });
        }


        function startCount() {

            state = 'COUNTDOWN';
            timer = 5;
            countAngle = 0;

            cBox.style.display = 'block';
            mult.style.display = 'none';

            hasBet = false;
            hasCashedOut = false;

            mainBtn.innerText = 'Place bet';
            mainBtn.className = '';

            cBox.innerText = timer;

            listPlayers = [];

            renderPlayers();

            lastTickTime = Date.now();
        }


        function syncLogic() {

            if (!canvas.width) {

                canvas.width =
                    canvas.parentElement.clientWidth;

                canvas.height =
                    canvas.parentElement.clientHeight;

                rx = 40;
                ry = canvas.height - 40;
            }


            let now = Date.now();

            let delta =
                (now - lastTickTime) / 1000;

            lastTickTime = now;


            if (state == 'COUNTDOWN') {

                timer -= delta;

                cBox.innerText =
                    Math.ceil(timer);


                if (timer <= 0) {

                    cBox.style.display = 'none';
                    mult.style.display = 'block';

                    state = 'FLYING';
                    value = 1.00;

                    path = [];
                    particles = [];


                    if (hasBet) {

                        mainBtn.innerText = 'Cash Out';
                        mainBtn.className = 'betting';
                    }


                    crash =
                        Math.random() * 8 + 1.05;
                }

            } else if (state == 'FLYING') {

                value += delta * 0.45;

                mult.innerText =
                    value.toFixed(2) + 'x';


                if (value >= crash) {

                    state = 'CRASHED';

                    mult.innerText =
                        '💥 FLEW AWAY';

                    mult.style.color = '#e94560';


                    historyList.push(
                        value.toFixed(2) + 'x'
                    );


                    listPlayers.forEach(p => {

                        if (p.status === 'active') {
                            p.status = 'lose';
                        }

                    });


                    mainBtn.innerText = 'Place bet';
                    mainBtn.className = '';


                    renderPlayers();


                    if (navigator.vibrate) {
                        navigator.vibrate(300);
                    }


                    updateHistoryUI();


                    setTimeout(
                        startCount,
                        2500
                    );
                }
            }
        }


        function draw() {

            syncLogic();

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle = '#fff';


            stars.forEach(s => {

                ctx.beginPath();

                ctx.arc(
                    s.x,
                    s.y,
                    s.s,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                if (state === 'FLYING') {

                    s.x -= s.sp * 3.5;
                    s.y += s.sp * 3.5;

                }


                if (s.x < 0) {
                    s.x = canvas.width;
                }

                if (s.y > canvas.height) {
                    s.y = 0;
                }

            });


            let currentColor =
                getHColor(value);


            if (path.length > 1) {

                ctx.save();

                ctx.beginPath();

                ctx.moveTo(
                    path[0].x,
                    path[0].y
                );


                for (
                    let i = 1;
                    i < path.length;
                    i++
                ) {

                    ctx.lineTo(
                        path[i].x,
                        path[i].y
                    );
                }


                ctx.strokeStyle = currentColor;
                ctx.lineWidth = 4;

                ctx.stroke();

                ctx.restore();
            }


            if (state == 'FLYING') {

                let p =
                    (value <= 10.00)
                        ? (
                            ((value - 1.00) / 9.00) *
                            0.45
                        )
                        : (
                            0.45 +
                            (
                                (value - 10.00) /
                                (crash > 10
                                    ? crash - 10
                                    : 1)
                            ) *
                            0.37
                        );


                if (p > 0.82) {
                    p = 0.82;
                }


                if (value <= 2.00) {

                    rx =
                        40 +
                        (canvas.width - 80) *
                        p *
                        1.5;

                    ry =
                        canvas.height - 40;

                } else {

                    rx =
                        40 +
                        (canvas.width - 80) *
                        p;


                    let cProg =
                        (value - 2.00) /
                        (crash > 2
                            ? crash - 2
                            : 1);


                    ry =
                        (canvas.height - 40) -
                        Math.min(
                            canvas.height - 90,
                            (rx - 40) *
                            Math.sqrt(3) *
                            cProg *
                            0.7
                        );
                }


                path.push({
                    x: rx,
                    y: ry
                });


                ctx.save();

                ctx.translate(rx, ry);

                ctx.rotate(-Math.PI / 3);

                ctx.fillStyle = '#f0f2f5';

                ctx.beginPath();

                ctx.moveTo(0, -16);
                ctx.lineTo(7, 4);
                ctx.lineTo(-7, 4);

                ctx.closePath();

                ctx.fill();

                ctx.restore();
            }


            loop =
                requestAnimationFrame(draw);
        }


        function handleAction() {

            if (state === 'COUNTDOWN') {

                hasBet = true;

                mainBtn.innerText =
                    'Bet Placed';

                mainBtn.className =
                    'betting';

            } else if (
                state === 'FLYING' &&
                hasBet &&
                !hasCashedOut
            ) {

                hasCashedOut = true;

                mainBtn.innerText =
                    'Place bet';

                mainBtn.className = '';


                userBalance +=
                    userBetAmount * value;

                topBalanceText.innerText =
                    userBalance.toFixed(2);


                let userP = {
                    n: 'You',
                    b: userBetAmount,
                    winMult: value,
                    status: 'win-low'
                };


                listPlayers.unshift(userP);

                renderPlayers();
            }
        }


        updateHistoryUI();

        draw();

        startCount();

    </script>

</body>
</html>
