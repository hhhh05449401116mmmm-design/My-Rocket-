            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2c354a;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #0066ff;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        #submit-bet-btn {
            background: #2c354a;
            color: #8a9fc4;

            padding: 15px;

        .nav-item.active {
            color: #0066ff;
        }

        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>

    <script>

        // كود تليجرام الرسمي لسحب اسم وصورة اللاعب التلقائية الفورية وحفظها بالحقيبة

        let userName = "Player";


        if (window.Telegram && window.Telegram.WebApp) {

            window.Telegram.WebApp.ready();

            window.Telegram.WebApp.expand();


            const initData =
                window.Telegram.WebApp.initDataUnsafe;


            if (initData && initData.user) {

                userName =
                    initData.user.first_name +
                    (
                        initData.user.last_name
                            ? " " + initData.user.last_name
                            : ""
                    );


                document.getElementById(
                    'user-name'
                ).innerText = userName;


                if (initData.user.photo_url) {

                    document.getElementById(
                        'user-avatar'
                    ).style.backgroundImage =
                        `url('${initData.user.photo_url}')`;

                    document.getElementById(
                        'user-avatar'
                    ).innerText = "";

                } else {

                    document.getElementById(
                        'user-avatar'
                    ).innerText =
                        initData.user.first_name
                            .charAt(0)
                            .toUpperCase();

                }
            }
        }


        function switchPage(pageId, btnEl) {

            document
                .querySelectorAll('.page-view')
                .forEach(p =>
                    p.classList.remove('active')
                );


            document
                .querySelectorAll('.nav-item')
                .forEach(b =>
                    b.classList.remove('active')
                );


            document
                .getElementById('page-' + pageId)
                .classList.add('active');


            if (btnEl) {

                btnEl.classList.add('active');

            } else {

                document
                    .getElementById('nav-btn-home')
                    .classList.add('active');
            }


            closeBetPanel();
        }


        function navigateToGame() {

            switchPage('game', null);

        }


        const canvas =
            document.getElementById('gameCanvas');

        const ctx =
            canvas.getContext('2d');


        const mult =
            document.getElementById('mult');

        const mainBtn =
            document.getElementById('main-action-btn');

        const hBar =
            document.getElementById('history-bar');

        const pList =
            document.getElementById('p-list');

        const cBox =
            document.getElementById('count-box');


        const betPanel =
            document.getElementById('bet-panel');

        const betInput =
            document.getElementById('bet-input');

        const submitBetBtn =
            document.getElementById('submit-bet-btn');

        const balanceDisplay =
            document.getElementById('balance-display');

        const currencyUnit =
            document.getElementById('currency-unit');

        const inputTag =
            document.getElementById('input-tag');

        const topBalanceText =
            document.getElementById('top-balance-text');


        const autoToggle =
            document.getElementById('auto-cash-toggle');

        const autoCashBox =
            document.getElementById('auto-cash-box');

        const autoCashInput =
            document.getElementById('auto-cash-input');


        let state = 'COUNTDOWN';

        let value = 1.00;

        let crash = 1.00;

        let loop;

        let path = [];

        let rx = 40;

        let ry = canvas.height - 40;


        let timer = 5;

        let countAngle = 0;

        let listPlayers = [];

        let lastTickTime = Date.now();


        let hasBet = false;

        let hasCashedOut = false;

        let currentTab = 'ton';

        let userBalance = 10.00;

        let userBetAmount = 0;


        let historyList = [
            '3.70x',
            '3.07x',
            '1.00x',
            '2.37x'
        ];

        let stars = [];

        let particles = [];


        const pool = [

            {
                n: 'BOB',
                b: 0.10,
                cashOutPoint: 3.36,
                status: 'active'
            },

            {
                n: 'honey',
                b: 0.10,
                cashOutPoint: 2.27,
                status: 'active'
            }

        ];


        for (let i = 0; i < 30; i++) {

            stars.push({

                x: Math.random() * 800,

                y: Math.random() * 600,

                s: Math.random() * 1.5,

                sp: Math.random() * 1.2 + 0.6

            });

        }


        function getHColor(val) {

            if (val <= 1.30) {
                return '#e94560';
            }

            if (val <= 2.00) {
                return '#0066ff';
            }

            return '#4e9f3d';
        }


        function getHClass(val) {

            if (val <= 1.30) {
                return 'c-red';
            }

            if (val <= 2.00) {
                return 'c-blue';
            }

            return 'c-green';
        }


        function updateHistoryUI() {

            hBar.innerHTML = '';


            historyList
                .slice(-6)
                .reverse()
                .forEach(v => {

                    const d =
                        document.createElement('div');


                    d.className =
                        'h-item ' +
                        getHClass(parseFloat(v));


                    d.innerText = v;


                    hBar.appendChild(d);

                });
        }


        function openBetPanel() {

            if (
                state === 'COUNTDOWN' &&
                !hasBet
            ) {

                betPanel.style.display = 'block';

            } else if (
                state === 'FLYING' &&
                hasBet &&
                !hasCashedOut
            ) {

                cashOutUser();

            }
        }


        function closeBetPanel() {

            betPanel.style.display = 'none';

        }


        function switchTab(tab) {

            currentTab = tab;


            document
                .getElementById('tab-gifts')
                .classList
                .toggle(
                    'active',
                    tab === 'gifts'
                );


            document
                .getElementById('tab-ton')
                .classList
                .toggle(
                    'active',
                    tab === 'ton'
                );


            currencyUnit.innerText =
                tab === 'ton'
                    ? '💎'
                    : '🎁';


            if (inputTag) {

                inputTag.innerText =
                    tab === 'ton'
                        ? '💎'
                        : '🎁';
            }


            betInput.placeholder =
                tab === 'ton'
                    ? 'TON amount'
                    : 'NFT Gift ID';


            submitBetBtn.innerText =
                tab === 'ton'
                    ? 'Place TON Bet 🚀'
                    : 'Place Gift Bet 🎁';


            validateBetInput();
        }


        function toggleAutoCashFields() {

            autoCashBox.style.display =
                autoToggle.checked
                    ? 'block'
                    : 'none';
        }


        function validateBetInput() {

            let val =
                parseFloat(betInput.value);


            if (
                currentTab === 'ton' &&
                val >= 0.1 &&
                val <= userBalance
            ) {

                submitBetBtn.className = 'active';

                submitBetBtn.disabled = false;

            } else if (
                currentTab === 'gifts' &&
                betInput.value.length > 0
            ) {

                submitBetBtn.className = 'active';

                submitBetBtn.disabled = false;

            } else {

                submitBetBtn.className = '';

                submitBetBtn.disabled = true;
            }
        }


        function submitBet() {

            hasBet = true;


            userBetAmount =
                currentTab === 'ton'
                    ? parseFloat(betInput.value)
                    : 2.50;


            if (currentTab === 'ton') {

                userBalance -=
                    userBetAmount;

            } else {

                userBalance +=
                    userBetAmount;
            }


            balanceDisplay.innerText =
                userBalance.toFixed(2);


            topBalanceText.innerText =
                userBalance.toFixed(2);


            mainBtn.innerText =
                'Bet Placed';

            mainBtn.className =
                'betting';


            closeBetPanel();
        }


        function startCount() {

            state = 'COUNTDOWN';

            timer = 5;

            countAngle = 0;


            cBox.style.display = 'block';

            mult.style.display = 'none';


            hasBet = false;

            hasCashedOut = false;


            mainBtn.innerText =
                'Place bet';

            mainBtn.className = '';


            cBox.innerText = timer;


            listPlayers = [];

            renderPlayers();


            lastTickTime = Date.now();
        }


        function cashOutUser() {

            hasCashedOut = true;


            mainBtn.innerText =
                'Place bet';

            mainBtn.className = '';


            userBalance +=
                userBetAmount * value;


            balanceDisplay.innerText =
                userBalance.toFixed(2);


            topBalanceText.innerText =
                userBalance.toFixed(2);


            let userP = {

                n: 'You',

                b: userBetAmount,

                winMult: value,

                status: 'win-low'

            };


            listPlayers.unshift(userP);


            renderPlayers();
        }


        function syncLogic() {

            if (
                !canvas.width ||
                canvas.width !==
                canvas.parentElement.clientWidth
            ) {

                canvas.width =
                    canvas.parentElement.clientWidth;

                canvas.height =
                    canvas.parentElement.clientHeight;

                rx = 40;

                ry =
                    canvas.height - 40;
            }


            let now = Date.now();


            let delta =
                (now - lastTickTime) / 1000;


            lastTickTime = now;


            if (state == 'COUNTDOWN') {

                timer -= delta;


                cBox.innerText =
                    Math.ceil(timer);


                if (timer <= 0) {

                    cBox.style.display = 'none';

                    mult.style.display = 'block';

                    state = 'FLYING';

                    value = 1.00;

                    path = [];

                    particles = [];


                    if (hasBet) {

                        mainBtn.innerText =
                            'Cash Out';

                        mainBtn.className =
                            'betting';
                    }


                    crash =
                        Math.random() * 8 + 1.05;
                }

            } else if (state == 'FLYING') {

                value += delta * 0.45;


                mult.innerText =
                    value.toFixed(2) + 'x';


                if (
                    hasBet &&
                    !hasCashedOut &&
                    autoToggle.checked &&
                    value >=
                    parseFloat(autoCashInput.value)
                ) {

                    cashOutUser();
                }


                if (value >= crash) {

                    state = 'CRASHED';


                    mult.innerText =
                        '💥 FLEW AWAY';


                    mult.style.color =
                        '#e94560';


                    historyList.push(
                        value.toFixed(2) + 'x'
                    );


                    mainBtn.innerText =
                        'Place bet';

                    mainBtn.className = '';


                    if (navigator.vibrate) {

                        navigator.vibrate(300);
                    }


                    updateHistoryUI();


                    setTimeout(
                        startCount,
                        2500
                    );
                }
            }
        }


        function draw() {

            syncLogic();


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle = '#fff';


            stars.forEach(s => {

                ctx.beginPath();


                ctx.arc(
                    s.x,
                    s.y,
                    s.s,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                if (state === 'FLYING') {

                    s.x -= s.sp * 3.5;

                    s.y += s.sp * 3.5;
                }


                if (s.x < 0) {

                    s.x = canvas.width;
                }


                if (s.y > canvas.height) {

                    s.y = 0;
                }

            });


            let currentColor =
                getHColor(value);


            if (path.length > 1) {

                ctx.save();

                ctx.beginPath();


                ctx.moveTo(
                    path[0].x,
                    path[0].y
                );


                for (
                    let i = 1;
                    i < path.length;
                    i++
                ) {

                    ctx.lineTo(
                        path[i].x,
                        path[i].y
                    );
                }


                ctx.strokeStyle =
                    currentColor;

                ctx.lineWidth = 4;

                ctx.stroke();

                ctx.restore();
            }


            if (state == 'FLYING') {

                let p =
                    (value <= 10.00)
                        ? (
                            ((value - 1.00) / 9.00) *
                            0.45
                        )
                        : (
                            0.45 +
                            (
                                (value - 10.00) /
                                (
                                    crash > 10
                                        ? crash - 10
                                        : 1
                                )
                            ) *
                            0.37
                        );


                if (p > 0.82) {

                    p = 0.82;
                }


                if (value <= 2.00) {

                    rx =
                        40 +
                        (canvas.width - 80) *
                        p *
                        1.5;


                    ry =
                        canvas.height - 40;

                } else {

                    rx =
                        40 +
                        (canvas.width - 80) *
                        p;


                    let cProg =
                        (value - 2.00) /
                        (
                            crash > 2
                                ? crash - 2
                                : 1
                        );


                    ry =
                        (canvas.height - 40) -
                        Math.min(
                            canvas.height - 90,
                            (rx - 40) *
                            Math.sqrt(3) *
                            cProg *
                            0.7
                        );
                }


                path.push({
                    x: rx,
                    y: ry
                });


                ctx.save();


                ctx.translate(
                    rx,
                    ry
                );


                ctx.rotate(
                    -Math.PI / 3
                );


                ctx.fillStyle =
                    '#f0f2f5';


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -16
                );

                ctx.lineTo(
                    7,
                    4
                );

                ctx.lineTo(
                    -7,
                    4
                );


                ctx.closePath();

                ctx.fill();

                ctx.restore();
            }


            loop =
                requestAnimationFrame(draw);
        }


        function renderPlayers() {

            pList.innerHTML = '';

        }


        updateHistoryUI();

        draw();

        startCount();

    </script>

</body>
</html>
