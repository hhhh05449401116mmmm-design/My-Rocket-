<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Epic Gift Rocket Multiplayer Pro</title>

    <!-- Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- TON Connect -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            order: 1;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
            order: 2;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
            cursor: pointer;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .game-container {
            padding: 10px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(280px) translateX(-280px);
                opacity: 0;
            }
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .curve-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray 0.06s linear, stroke 0.1s;
        }

        .rocket-container-wrapper {
            position: absolute;
            bottom: 52px;
            left: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transform: translate(0, 0);
            transition: transform 0.06s linear;
        }

        .rocket-zone {
            font-size: 52px;
            display: inline-block;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8));
            text-shadow: 0 0 10px #00ffcc;
            font-style: normal;
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--p-color, #ffaa00);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(0.5px);
            animation: emitParticle 0.3s linear infinite;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.1);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 55px;
            font-weight: bold;
            color: #fff;
            z-index: 4;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .history-badge.blue {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
            border: 1px solid #0066ff44;
        }

        .history-badge.purple {
            background: rgba(160, 32, 240, 0.15);
            color: #a020f0;
            border: 1px solid #a020f044;
        }

        .history-badge.gold {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid #ffaa0044;
        }

        .history-badge.fire {
            background: rgba(255, 68, 0, 0.18);
            color: #ff4400;
            border: 1px solid #ff440055;
            font-weight: 800;
            box-shadow: 0 0 6px rgba(255,68,0,0.2);
        }

        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .switch-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .auto-cashout-control-row.locked {
            opacity: 0.3 !important;
            pointer-events: none;
            cursor: not-allowed;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }

        .main-btn.queued {
            background: #ffaa00;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,170,0,0.3);
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
        }

        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
            transition: all 0.1s ease;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.08);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.03);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            background: #2b3047;
        }

        .p-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-status-box {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .p-status-box.active {
            background: rgba(0,102,255,0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0,255,204,0.2);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255,51,102,0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

<div class="header">

    <div class="profile-zone">

        <div id="avatar-box" class="avatar-container">
            ⚙️
        </div>

        <div style="display:flex; flex-direction:column; align-items:flex-start;">

            <span id="username" style="font-weight:bold; font-size:13px;">
                جاري الاتصال...
            </span>

            <span id="role-tag" class="player-badge">
                لاعب
            </span>

        </div>

    </div>

    <div class="balances-wrapper">

        <div
            id="ton-wallet-box"
            class="balance-box ton"
            onclick="openTonWallet()"
            title="Connect TON Wallet">

            <span id="ton-balance">126.04</span> TON

        </div>

        <div class="balance-box">

            🚀

            <span id="header-multiplier">
                1.00x
            </span>

        </div>

    </div>

</div>


<div class="game-container">

    <div id="space-bg" class="space-bg"></div>

    <svg
        class="svg-canvas"
        viewBox="0 0 320 250"
        preserveAspectRatio="none">

        <path
            id="neon-curve"
            class="curve-line"
            d="M 45 220"
            stroke="#ff3366">
        </path>

    </svg>

    <div
        id="rocket-container"
        class="rocket-container-wrapper">

        <div
            id="rocket"
            class="rocket-zone">
            🚀
        </div>

    </div>

    <div
        id="multiplier"
        class="multiplier"
        style="display:none;">
        1.00x
    </div>

    <div
        id="countdown-wrapper"
        class="countdown-container">

        <svg
            class="countdown-svg"
            viewBox="0 0 80 80">

            <circle
                class="bg-circle"
                cx="40"
                cy="40"
                r="37">
            </circle>

            <circle
                id="progress-bar"
                class="bar-circle"
                cx="40"
                cy="40"
                r="37">
            </circle>

        </svg>

        <div
            id="countdown-num"
            class="countdown-number">
            5
        </div>

    </div>

</div>


<div
    id="history-bar"
    class="history-row">
</div>


<div class="bet-panel">

    <div class="info-row">
        <span>Available Balance</span>

        <span id="balance-label">
            126.04 TON
        </span>
    </div>

    <div class="info-row">
        <span>Bet Amount</span>
    </div>

    <div class="input-box-wrapper">

        <input
            id="bet-input"
            class="amount-input"
            type="number"
            min="0.01"
            step="0.01"
            value="1.00"
            inputmode="decimal">

        <span>TON</span>

    </div>

    <div class="switch-row">

        <span>Auto cashout</span>

        <div
            id="auto-switch"
            class="switch-btn"
            onclick="toggleAutoCashout()">

            <div class="switch-circle"></div>

        </div>

    </div>

    <div
        id="auto-control-box"
        class="auto-cashout-control-row">

        <button
            class="step-btn"
            type="button"
            onclick="adjustAutoVal(-0.1)">
            -
        </button>

        <span
            id="auto-cashout-val"
            class="auto-val-display">
            1.50 x
        </span>

        <button
            class="step-btn"
            type="button"
            onclick="adjustAutoVal(0.1)">
            +
        </button>

    </div>

    <button
        id="action-btn"
        class="main-btn"
        onclick="handleAction()">
        Place TON Bet 🚀
    </button>

</div>


<div
    id="players-feed"
    class="players-list">
</div>


<script>
"use strict";

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.expand();
    tg.ready();
}

const telegramUser =
    tg?.initDataUnsafe?.user || {};

const telegramId =
    String(
        telegramUser.id ||
        "guest-" +
        Math.random().toString(36).slice(2)
    );

const firstName =
    telegramUser.first_name ||
    "اللاعب";

const userPhoto =
    telegramUser.photo_url ||
    "";


/* =========================================
   PROFILE
========================================= */

document.getElementById("username").innerText =
    firstName;

const avatarBox =
    document.getElementById("avatar-box");

if (userPhoto) {

    avatarBox.innerHTML =
        `<img src="${escapeHtml(userPhoto)}" alt="profile">`;

} else {

    avatarBox.innerText =
        firstName.charAt(0).toUpperCase();

}


/*
    نفس ID الإداري الموجود في التصميم القديم.
*/

if (telegramId === "7385640899") {

    const role =
        document.getElementById("role-tag");

    role.innerText =
        "المالك";

    role.className =
        "admin-badge";

}


/* =========================================
   RAILWAY
========================================= */

const BACKEND_URL =
    "https://my-rocket-production.up.railway.app";


/* =========================================
   TON CONNECT
========================================= */

let tonConnectUI = null;

let tonWalletAddress = null;

let tonWalletConnected = false;


/*
    تهيئة TON Connect.

    لا يوجد هنا:
    - إيداع
    - سحب
    - تحويل TON
    - تعديل الرصيد

    هذه المرحلة للاتصال بالمحفظة فقط.
*/

function initTonConnect() {

    if (
        typeof TON_CONNECT_UI === "undefined"
    ) {

        console.error(
            "TON Connect UI library failed to load."
        );

        return;

    }


    try {

        tonConnectUI =
            new TON_CONNECT_UI.TonConnectUI({
                manifestUrl:
                    "https://my-rocket.vercel.app/tonconnect-manifest.json",

                restoreConnection:
                    true,

                language:
                    "en"
            });


        tonConnectUI.onStatusChange(
            function(wallet) {

                if (wallet) {

                    tonWalletConnected =
                        true;

                    tonWalletAddress =
                        wallet.account?.address ||
                        null;

                    console.log(
                        "💎 TON Wallet connected:",
                        tonWalletAddress
                    );

                    updateTonWalletUI();

                } else {

                    tonWalletConnected =
                        false;

                    tonWalletAddress =
                        null;

                    console.log(
                        "💎 TON Wallet disconnected"
                    );

                    resetTonWalletUI();

                }

            }
        );


        /*
            محاولة قراءة الحالة الحالية
            إذا كانت الجلسة مستعادة.
        */

        if (
            tonConnectUI.wallet
        ) {

            tonWalletConnected =
                true;

            tonWalletAddress =
                tonConnectUI.wallet.account?.address ||
                null;

            updateTonWalletUI();

        }

    } catch (error) {

        console.error(
            "TON Connect initialization error:",
            error
        );

    }

}


/* =========================================
   OPEN TON WALLET
========================================= */

function openTonWallet() {

    if (!tonConnectUI) {

        console.error(
            "TON Connect is not initialized."
        );

        return;

    }


    tonConnectUI
        .openModal()
        .catch(function(error) {

            console.error(
                "Unable to open TON wallet modal:",
                error
            );

        });

}


/* =========================================
   TON WALLET UI
========================================= */

function updateTonWalletUI() {

    const box =
        document.getElementById(
            "ton-wallet-box"
        );


    if (!box) {
        return;
    }


    if (
        tonWalletConnected &&
        tonWalletAddress
    ) {

        box.title =
            "TON Wallet: " +
            tonWalletAddress;


        box.innerHTML = `
            <span id="ton-balance">
                ${Number(tonBalance).toFixed(2)}
            </span>
            TON
        `;

        return;

    }


    box.title =
        "Connect TON Wallet";


    box.innerHTML = `
        <span id="ton-balance">
            ${Number(tonBalance).toFixed(2)}
        </span>
        TON
    `;

}


/* =========================================
   RESET TON WALLET UI
========================================= */

function resetTonWalletUI() {

    const box =
        document.getElementById(
            "ton-wallet-box"
        );


    if (!box) {
        return;
    }


    box.title =
        "Connect TON Wallet";


    box.innerHTML = `
        <span id="ton-balance">
            ${Number(tonBalance).toFixed(2)}
        </span>
        TON
    `;

}


/* =========================================
   LOCAL UI STATE
========================================= */

let tonBalance = 126.04;

let isGameRunning = false;

let hasBet = false;

let isQueuedForNextRound = false;

let currentMultiplier = 1.00;

let autoCashoutEnabled = false;

let autoCashoutTarget = 1.50;

let userBetAmount = 0;

let currentRoundId = null;

let serverConnected = false;

let eventSource = null;

let reconnectTimer = null;

let actionInProgress = false;

let globalHistory = [
    1.24,
    2.15,
    6.40,
    11.86,
    27.50
];

let livePlayers = [];


/* =========================================
   SERVER CONNECTION
========================================= */

function connectToGlobalServer() {

    if (eventSource) {

        try {
            eventSource.close();
        } catch (e) {}

        eventSource = null;
    }

    try {

        eventSource =
            new EventSource(
                `${BACKEND_URL}/api/game-stream?telegramId=${encodeURIComponent(telegramId)}`
            );

        eventSource.onopen = function() {

            serverConnected = true;

            actionInProgress = false;

            clearTimeout(reconnectTimer);

            console.log(
                "🚀 Connected to global Rocket Server"
            );

        };


        eventSource.onmessage =
            function(event) {

                try {

                    const data =
                        JSON.parse(event.data);

                    handleServerMessage(data);

                } catch (error) {

                    console.error(
                        "Invalid server data:",
                        error
                    );

                }

            };


        eventSource.onerror =
            function() {

                serverConnected = false;

                actionInProgress = false;

                showServerOffline();

                try {
                    eventSource.close();
                } catch (e) {}

                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer =
                    setTimeout(
                        connectToGlobalServer,
                        3000
                    );

            };

    } catch (error) {

        console.error(
            "Connection error:",
            error
        );

        serverConnected = false;

        showServerOffline();

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                connectToGlobalServer,
                3000
            );
    }
}


/* =========================================
   SERVER MESSAGE
========================================= */

function handleServerMessage(data) {

    if (!data) {
        return;
    }


    if (
        data.roundId !== undefined &&
        data.roundId !== null
    ) {

        currentRoundId =
            data.roundId;

    }


    if (
        Number.isFinite(
            Number(data.balance)
        )
    ) {

        tonBalance =
            Number(data.balance);

        updateBalanceUI();

        updateTonWalletUI();

    }


    if (
        Array.isArray(data.history)
    ) {

        globalHistory =
            data.history;

        renderHistoryUI();

    }


    if (
        Array.isArray(data.players)
    ) {

        livePlayers =
            data.players;

    }


    if (data.self) {

        syncSelfState(
            data.self
        );

    }


    switch (data.type) {

        case "SYNC":

            handleSync(data);

            break;


        case "COUNTDOWN":

            updateCountdownUI(
                Number(data.seconds)
            );

            updatePlayersUI();

            break;


        case "FLIGHT":

            updateFlightUI(
                Number(data.multiplier)
            );

            updatePlayersUI();

            break;


        case "CRASH":

            updateCrashUI(
                Number(data.finalMultiplier),
                data.history,
                data.players
            );

            break;


        case "PLAYERS":

            updatePlayersUI();

            break;


        case "BALANCE":

            updateBalanceUI();

            break;

    }

}


/* =========================================
   SYNC
========================================= */

function handleSync(data) {

    if (
        data.phase === "COUNTDOWN"
    ) {

        updateCountdownUI(
            Number(data.seconds)
        );

        return;

    }


    if (
        data.phase === "FLIGHT"
    ) {

        updateFlightUI(
            Number(data.multiplier)
        );

        return;

    }


    if (
        data.phase === "CRASH"
    ) {

        updateCrashUI(
            Number(data.finalMultiplier),
            data.history,
            data.players
        );

    }

}


/* =========================================
   SELF STATE
========================================= */

function syncSelfState(self) {

    if (!self) {
        return;
    }


    const state =
        String(self.state || "none");


    if (state === "active") {

        hasBet = true;

        isQueuedForNextRound = false;

        if (
            Number(self.bet) > 0
        ) {

            userBetAmount =
                Number(self.bet);

        }

        return;
    }


    if (state === "pending") {

        hasBet = false;

        isQueuedForNextRound = true;

        if (
            Number(self.bet) > 0
        ) {

            userBetAmount =
                Number(self.bet);

        }

        return;
    }


    if (state === "win") {

        hasBet = false;

        isQueuedForNextRound = false;

        return;
    }


    if (
        state === "lose" ||
        state === "none"
    ) {

        if (
            state === "none"
        ) {

            hasBet = false;

            isQueuedForNextRound =
                false;

        }

    }

}

/* =========================================
   COUNTDOWN
========================================= */

function updateCountdownUI(seconds) {

    seconds =
        Math.max(
            0,
            Math.min(
                5,
                Number(seconds)
            )
        );


    isGameRunning = false;


    const wrapper =
        document.getElementById(
            "countdown-wrapper"
        );

    const numText =
        document.getElementById(
            "countdown-num"
        );

    const bar =
        document.getElementById(
            "progress-bar"
        );

    const multText =
        document.getElementById(
            "multiplier"
        );

    const btn =
        document.getElementById(
            "action-btn"
        );


    wrapper.style.display =
        "flex";

    multText.style.display =
        "none";


    numText.innerText =
        seconds;


    const offset =
        236 -
        (
            236 *
            (seconds / 5)
        );


    bar.style.strokeDashoffset =
        offset;


    document.getElementById(
        "header-multiplier"
    ).innerText =
        "1.00x";


    document.getElementById(
        "auto-switch"
    ).classList.remove(
        "disabled"
    );


    document.getElementById(
        "auto-control-box"
    ).classList.remove(
        "locked"
    );


    if (hasBet) {

        btn.disabled = true;

        btn.className =
            "main-btn";

        btn.innerText =
            "Waiting for Takeoff...";

        return;
    }


    if (isQueuedForNextRound) {

        btn.disabled = true;

        btn.className =
            "main-btn queued";

        btn.innerText =
            "Queued for Next Round ⏳";

        return;
    }


    btn.disabled =
        !serverConnected;

    btn.className =
        "main-btn";

    btn.innerText =
        "Place TON Bet 🚀";

}


/* =========================================
   FLIGHT
========================================= */

function updateFlightUI(mult) {

    if (!Number.isFinite(mult)) {
        return;
    }


    isGameRunning = true;

    currentMultiplier =
        mult;


    const rCont =
        document.getElementById(
            "rocket-container"
        );

    const path =
        document.getElementById(
            "neon-curve"
        );

    const multText =
        document.getElementById(
            "multiplier"
        );

    const btn =
        document.getElementById(
            "action-btn"
        );


    document.getElementById(
        "countdown-wrapper"
    ).style.display =
        "none";


    multText.style.display =
        "block";


    multText.innerText =
        mult.toFixed(2) + "x";


    document.getElementById(
        "header-multiplier"
    ).innerText =
        mult.toFixed(2) + "x";


    const currentColors =
        getColorByMultiplier(
            mult
        );


    path.setAttribute(
        "stroke",
        currentColors.hex
    );


    path.style.filter =
        `drop-shadow(0 0 6px ${currentColors.hex})`;


    const xMove =
        Math.min(
            210,
            Math.max(
                0,
                (mult - 1) * 35
            )
        );


    const yMove =
        Math.min(
            150,
            Math.max(
                0,
                (mult - 1) * 45
            )
        );


    rCont.style.transform =
        `translate(${xMove}px, -${yMove}px) rotate(-15deg)`;


    document.getElementById(
        "auto-switch"
    ).classList.add(
        "disabled"
    );


    document.getElementById(
        "auto-control-box"
    ).classList.add(
        "locked"
    );


    if (hasBet) {

        btn.disabled = false;

        btn.className =
            "main-btn cashout";

        btn.innerText =
            `Cashout ${(userBetAmount * mult).toFixed(2)} TON 💎`;

    } else if (isQueuedForNextRound) {

        btn.disabled = true;

        btn.className =
            "main-btn queued";

        btn.innerText =
            "Queued for Next Round ⏳";

    } else {

        btn.disabled = true;

        btn.className =
            "main-btn";

        btn.innerText =
            "Bet for Next Round ⏳";

    }


    if (Math.random() < 0.3) {

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "particle-glow";

        p.style.setProperty(
            "--p-color",
            currentColors.hex
        );

        p.style.left =
            "22px";

        p.style.top =
            "22px";

        rCont.appendChild(p);

        setTimeout(
            () => p.remove(),
            400
        );

    }

}

/* =========================================
   AUTO CASHOUT
========================================= */

function toggleAutoCashout() {

    if (isGameRunning) {
        return;
    }


    if (hasBet || isQueuedForNextRound) {
        return;
    }


    autoCashoutEnabled =
        !autoCashoutEnabled;


    document.getElementById(
        "auto-switch"
    ).className =
        "switch-btn" +
        (
            autoCashoutEnabled
                ? " active"
                : ""
        );


    document.getElementById(
        "auto-control-box"
    ).className =
        "auto-cashout-control-row" +
        (
            autoCashoutEnabled
                ? " active"
                : ""
        );

}


function adjustAutoVal(val) {

    if (
        !autoCashoutEnabled ||
        isGameRunning
    ) {

        return;
    }


    autoCashoutTarget =
        parseFloat(
            (
                autoCashoutTarget +
                val
            ).toFixed(2)
        );


    if (
        autoCashoutTarget < 1.10
    ) {

        autoCashoutTarget =
            1.10;

    }


    if (
        autoCashoutTarget > 1000
    ) {

        autoCashoutTarget =
            1000;

    }


    document.getElementById(
        "auto-cashout-val"
    ).innerText =
        autoCashoutTarget.toFixed(2) +
        " x";

}


/* =========================================
   HISTORY
========================================= */

function renderHistoryUI() {

    const bar =
        document.getElementById(
            "history-bar"
        );


    if (!bar) {
        return;
    }


    bar.innerHTML =
        "";


    globalHistory.forEach(
        function(val) {

            const number =
                Number(val);


            if (
                !Number.isFinite(number)
            ) {
                return;
            }


            const badgeColors =
                getColorByMultiplier(
                    number
                );


            const badge =
                document.createElement(
                    "div"
                );


            badge.className =
                `history-badge ${badgeColors.name}`;


            badge.innerText =
                number.toFixed(2) +
                "x";


            bar.appendChild(
                badge
            );

        }
    );

}


/* =========================================
   PLAYERS
========================================= */

function updatePlayersUI() {

    const feed =
        document.getElementById(
            "players-feed"
        );


    if (!feed) {
        return;
    }


    feed.innerHTML =
        "";


    if (
        !Array.isArray(livePlayers)
    ) {

        return;

    }


    livePlayers.forEach(
        function(p) {

            if (!p) {
                return;
            }


            const bet =
                Number(p.bet) || 0;


            const finalMult =
                Number(p.finalMult) || 1;


            const runningMult =
                p.state === "active"
                    ? currentMultiplier
                    : finalMult;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `player-card ${p.state || "active"}`;


            const stateClass =
                p.state === "win"
                    ? "win"
                    : (
                        p.state === "lose"
                            ? "lose"
                            : "active"
                    );


            let imgTag;


            if (
                p.avatar &&
                /^https:\/\//i.test(
                    p.avatar
                )
            ) {

                imgTag =
                    `<img src="${escapeHtml(p.avatar)}" alt="profile">`;

            } else {

                imgTag =
                    `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${p.color || "#2b3047"}">${escapeHtml((p.name || "?").charAt(0))}</div>`;

            }


            let statusAmount =
                bet * runningMult;


            if (
                p.state === "lose"
            ) {

                statusAmount =
                    0;

            }


            card.innerHTML = `
                <div class="p-info">

                    <div class="p-avatar">
                        ${imgTag}
                    </div>

                    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">

                        <span style="font-weight:bold; font-size:13px;">
                            ${escapeHtml(p.name || "Player")}
                        </span>

                        <span style="font-size:11px; color:#8a92b2; direction:ltr;">
                            💎 ${bet.toFixed(2)} ×${runningMult.toFixed(2)}
                        </span>

                    </div>

                </div>

                <div class="p-status-box ${stateClass}">
                    ${
                        p.state === "win"
                            ? "💎 " + statusAmount.toFixed(2)
                            : (
                                p.state === "lose"
                                    ? "💥 Lost"
                                    : "💎 " + statusAmount.toFixed(2)
                            )
                    }
                </div>
            `;


            feed.appendChild(
                card
            );

        }
    );

}


/* =========================================
   COLORS
========================================= */

function getColorByMultiplier(val) {

    if (val < 1.30) {

        return {
            name: "red",
            hex: "#ff3366"
        };

    }


    if (
        val >= 1.30 &&
        val < 2.00
    ) {

        return {
            name: "green",
            hex: "#00ffcc"
        };

    }


    if (
        val >= 2.00 &&
        val < 5.00
    ) {

        return {
            name: "blue",
            hex: "#0066ff"
        };

    }


    if (
        val >= 5.00 &&
        val < 9.00
    ) {

        return {
            name: "purple",
            hex: "#a020f0"
        };

    }


    if (
        val >= 9.00 &&
        val < 25.00
    ) {

        return {
            name: "gold",
            hex: "#ffaa00"
        };

    }


    if (val >= 25.00) {

        return {
            name: "fire",
            hex: "#ff4400"
        };

    }


    return {
        name: "green",
        hex: "#00ffcc"
    };

}

   BALANCE
========================================= */

function updateBalanceUI() {

    if (
        !Number.isFinite(
            Number(tonBalance)
        )
    ) {

        return;

    }


    document.getElementById(
        "ton-balance"
    ).innerText =

/* =========================================
   BET AMOUNT
========================================= */

function getBetAmount() {

    const input =
        document.getElementById(
            "bet-input"
        );


    const amount =
        parseFloat(
            input.value
        );


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        return 0;

    }


    return Number(
        amount.toFixed(2)
    );

}


/* =========================================
   MAIN ACTION
========================================= */

function handleAction() {

    if (!serverConnected) {
        return;
    }


    if (actionInProgress) {
        return;
    }


    if (
        isGameRunning &&
        hasBet
    ) {

        triggerCashoutSuccess();

        return;
    }


    if (
        isGameRunning &&
        !hasBet
    ) {

        if (
            isQueuedForNextRound
        ) {

            return;

        }


        placeBet();

        return;
    }


    if (
        !isGameRunning &&
        !hasBet &&
        !isQueuedForNextRound
    ) {

        placeBet();

    }

}


/* =========================================
   PLACE BET
========================================= */

function placeBet() {

    if (!serverConnected) {
        return;
    }


    if (actionInProgress) {
        return;
    }


    const amount =
        getBetAmount();


    if (
        amount <= 0
    ) {

        alert(
            "أدخل قيمة رهان صحيحة."
        );

        return;
    }


    if (
        amount > tonBalance
    ) {

        alert(
            "الرصيد غير كافٍ."
        );

        return;
    }


    actionInProgress = true;


    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.disabled =
        true;


    btn.innerText =
        "جاري تسجيل الرهان...";


    sendServerAction(
        {
            type: "BET",

            telegramId:
                telegramId,

            name:
                firstName,

            avatar:
                userPhoto,

            amount:
                amount,

            roundId:
                currentRoundId,

            autoCashout:
                autoCashoutEnabled,

            autoTarget:
                autoCashoutTarget
        },

        function(data) {

            actionInProgress =
                false;


            if (
                data &&
                data.ok
            ) {

                userBetAmount =
                    amount;


                if (
                    Number.isFinite(
                        Number(data.balance)
                    )
                ) {

                    tonBalance =
                        Number(
                            data.balance
                        );

                    updateBalanceUI();

                    updateTonWalletUI();

                }


                if (
                    isGameRunning
                ) {

                    hasBet =
                        false;

                    isQueuedForNextRound =
                        true;

                } else {

                    hasBet =
                        true;

                    isQueuedForNextRound =
                        false;

                }


                updateButtonFromLocalState();

            } else {

                resetActionButton();

            }

        },

        function(error) {

            actionInProgress =
                false;

            console.error(
                error
            );

            resetActionButton();

        }
    );

}


/* =========================================
   CASHOUT
========================================= */

function triggerCashoutSuccess() {

    if (!hasBet) {
        return;
    }


    if (!serverConnected) {
        return;
    }


    if (actionInProgress) {
        return;
    }


    actionInProgress =
        true;


    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.disabled =
        true;


    btn.className =
        "main-btn";


    btn.innerText =
        "Cashing out... 💎";


    sendServerAction(
        {
            type: "CASHOUT",

            telegramId:
                telegramId,

            roundId:
                currentRoundId
        },

        function(data) {

            actionInProgress =
                false;


            if (
                data &&
                data.ok
            ) {

                hasBet =
                    false;

                isQueuedForNextRound =
                    false;

                userBetAmount =
                    0;


                if (
                    Number.isFinite(
                        Number(data.balance)
                    )
                ) {

                    tonBalance =
                        Number(
                            data.balance
                        );

                    updateBalanceUI();

                    updateTonWalletUI();

                }


                btn.className =
                    "main-btn";

                btn.disabled =
                    true;

                btn.innerText =
                    "Bet for Next Round ⏳";

            } else {

                btn.disabled =
                    false;

                btn.className =
                    "main-btn cashout";

                btn.innerText =
                    `Cashout ${(userBetAmount * currentMultiplier).toFixed(2)} TON 💎`;

            }

        },

        function(error) {

            actionInProgress =
                false;

            console.error(
                "Cashout error:",
                error
            );


            btn.disabled =
                false;

            btn.className =
                "main-btn cashout";

            btn.innerText =
                `Cashout ${(userBetAmount * currentMultiplier).toFixed(2)} TON 💎`;

        }
    );

}


/* =========================================
   SERVER ACTION
========================================= */

function sendServerAction(
    payload,
    onSuccess,
    onError
) {

    const url =
        `${BACKEND_URL}/api/game-action`;


    fetch(
        url,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(
                    payload
                )

        }
    )
    .then(
        async function(response) {

            let data = {};

            try {

                data =
                    await response.json();

            } catch (e) {}


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Server action failed"
                );

            }


            return data;

        }
    )
    .then(
        function(data) {

            if (
                typeof onSuccess ===
                "function"
            ) {

                onSuccess(data);

            }

        }
    )
    .catch(
        function(error) {

            if (
                typeof onError ===
                "function"
            ) {

                onError(error);

            }

        }
    );

}


/* =========================================
   LOCAL BUTTON STATE
========================================= */

    const btn =
        document.getElementById(

        );


    if (

    ) {

        btn.disabled =
            true;

        btn.className =
            "main-btn queued";

        btn.disabled =
            true;

        btn.className =
            "main-btn";

        btn.innerText =
            "Waiting for Takeoff...";

        return;

    }


    btn.disabled =
        !serverConnected;

    btn.className =
        "main-btn";

    btn.innerText =
        "Place TON Bet 🚀";

}

   RESET BUTTON
========================================= */

function resetActionButton() {

    actionInProgress =
        false;

    hasBet =
        false;

    isQueuedForNextRound =
        false;

    userBetAmount =
        0;


    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.disabled =
        !serverConnected;

    btn.className =
        "main-btn";

    btn.innerText =
        "Place TON Bet 🚀";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
