<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Epic Gift Rocket Multiplayer Pro</title>

    <!-- Telegram WebApp الرسمي -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            order: 1;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
            order: 2;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .game-container {
            padding: 10px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(280px) translateX(-280px);
                opacity: 0;
            }
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .curve-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray 0.06s linear, stroke 0.1s;
        }

        .rocket-container-wrapper {
            position: absolute;
            bottom: 52px;
            left: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transform: translate(0, 0);
            transition: transform 0.06s linear;
        }

        .rocket-zone {
            font-size: 52px;
            display: inline-block;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8));
            text-shadow: 0 0 10px #00ffcc;
            font-style: normal;
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--p-color, #ffaa00);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(0.5px);
            animation: emitParticle 0.3s linear infinite;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.1);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 55px;
            font-weight: bold;
            color: #fff;
            z-index: 4;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .history-badge.blue {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
            border: 1px solid #0066ff44;
        }

        .history-badge.purple {
            background: rgba(160, 32, 240, 0.15);
            color: #a020f0;
            border: 1px solid #a020f044;
        }

        .history-badge.gold {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid #ffaa0044;
        }

        .history-badge.fire {
            background: rgba(255, 68, 0, 0.18);
            color: #ff4400;
            border: 1px solid #ff440055;
            font-weight: 800;
            box-shadow: 0 0 6px rgba(255, 68, 0, 0.2);
        }

        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .switch-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .auto-cashout-control-row.locked {
            opacity: 0.3 !important;
            pointer-events: none;
            cursor: not-allowed;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        .main-btn.queued {
            background: #ffaa00;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
        }

        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
            transition: all 0.1s ease;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.08);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.03);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            background: #2b3047;
        }

        .p-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-status-box {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .p-status-box.active {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="profile-zone">
            <div id="avatar-box" class="avatar-container">⚙️</div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <span id="username" style="font-weight:bold; font-size:13px;">
                    جاري التحميل...
                </span>

                <span id="role-tag" class="player-badge">
                    لاعب
                </span>
            </div>
        </div>

        <div class="balances-wrapper">

            <div class="balance-box ton">
                <span id="ton-balance">126.04</span> TON
            </div>

            <div class="balance-box">
                🚀
                <span id="header-multiplier">1.00x</span>
            </div>

        </div>
    </div>


    <div class="game-container">

        <div id="space-bg" class="space-bg"></div>

        <svg class="svg-canvas" viewBox="0 0 320 250" preserveAspectRatio="none">
            <path
                id="neon-curve"
                class="curve-line"
                d="M 45 220"
                stroke="#ff3366">
            </path>
        </svg>

        <div id="rocket-container" class="rocket-container-wrapper">
            <div id="rocket" class="rocket-zone">🚀</div>
        </div>

        <div
            id="multiplier"
            class="multiplier"
            style="display:none;">
            1.00x
        </div>

        <div
            id="countdown-wrapper"
            class="countdown-container">

            <svg class="countdown-svg" viewBox="0 0 80 80">

                <circle
                    class="bg-circle"
                    cx="40"
                    cy="40"
                    r="37">
                </circle>

                <circle
                    id="progress-bar"
                    class="bar-circle"
                    cx="40"
                    cy="40"
                    r="37">
                </circle>

            </svg>

            <div
                id="countdown-num"
                class="countdown-number">
                5
            </div>

        </div>

    </div>


    <div
        id="history-bar"
        class="history-row">
    </div>


    <div class="bet-panel">

        <div class="info-row">
            <span>Available Balance</span>
            <span id="balance-label">126.04 TON</span>
        </div>

        <div class="info-row">
            <span>Bet Amount</span>
        </div>

        <div class="input-box-wrapper">

            <input
                id="bet-input"
                class="amount-input"
                type="number"
                min="0.01"
                step="0.01"
                value="1.00"
                inputmode="decimal">

            <span>TON</span>

        </div>


        <div class="switch-row">

            <span>Auto cashout</span>

            <div
                id="auto-switch"
                class="switch-btn"
                onclick="toggleAutoCashout()">

                <div class="switch-circle"></div>

            </div>

        </div>


        <div
            id="auto-control-box"
            class="auto-cashout-control-row">

            <button
                class="step-btn"
                type="button"
                onclick="adjustAutoVal(-0.1)">
                -
            </button>

            <span
                id="auto-cashout-val"
                class="auto-val-display">
                1.50 x
            </span>

            <button
                class="step-btn"
                type="button"
                onclick="adjustAutoVal(0.1)">
                +
            </button>

        </div>


        <button
            id="action-btn"
            class="main-btn"
            onclick="handleAction()">
            Place TON Bet 🚀
        </button>

    </div>


    <div
        id="players-feed"
        class="players-list">
    </div>


    <script>
        "use strict";

        /* =========================
           Telegram
        ========================== */

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.expand();
        }

        const telegramId = String(
            tg?.initDataUnsafe?.user?.id || "7385640899"
        );

        const firstName =
            tg?.initDataUnsafe?.user?.first_name || "اللاعب";

        const userPhoto =
            tg?.initDataUnsafe?.user?.photo_url || "";


        document.getElementById("username").innerText = firstName;


        const avatarBox =
            document.getElementById("avatar-box");


        if (userPhoto) {

            avatarBox.innerHTML =
                `<img src="${userPhoto}" alt="profile">`;

        } else {

            avatarBox.innerText =
                firstName.charAt(0).toUpperCase();

        }


        if (telegramId === "7385640899") {

            const role =
                document.getElementById("role-tag");

            role.innerText = "المالك";
            role.className = "admin-badge";

        }


        /* =========================
           Game Variables
        ========================== */

        let tonBalance = 126.04;

        let isGameRunning = false;

        let hasBet = false;

        let isQueuedForNextRound = false;

        let currentMultiplier = 1.00;

        let loopInterval = null;

        let autoCashoutEnabled = false;

        let autoCashoutTarget = 1.50;

        let userBetAmount = 0;

        let serverConnected = false;

        let fallbackStarted = false;


        let basePlayers = [

            {
                name: "LA",
                bet: 1.00,
                color: "#e066ff",
                avatar: "unsplash.com",
                state: "active",
                finalMult: 1.00
            },

            {
                name: "755",
                bet: 0.10,
                color: "#ffaa00",
                avatar: "unsplash.com",
                state: "active",
                finalMult: 1.00
            }

        ];


        let livePlayers = [];

        let globalHistory = [
            1.24,
            2.15,
            6.40,
            11.86,
            27.50
        ];


        /* =========================
           Railway Backend
        ========================== */

        const BACKEND_URL = "https://railway.app";


        function listenToGlobalServer() {

            try {

                if (
                    !BACKEND_URL ||
                    !/^https?:\/\//i.test(BACKEND_URL)
                ) {
                    startLocalLoop();
                    return;
                }


                const eventSource =
                    new EventSource(
                        `${BACKEND_URL}/api/game-stream`
                    );


                eventSource.onopen = function () {

                    serverConnected = true;

                    console.log(
                        "تم الاتصال بقناة البث المشتركة أونلاين."
                    );

                };


                eventSource.onmessage = function (event) {

                    try {

                        const data =
                            JSON.parse(event.data);


                        if (data.type === "COUNTDOWN") {

                            updateCountdownUI(
                                Number(data.seconds)
                            );

                        }

                        else if (data.type === "FLIGHT") {

                            updateFlightUI(
                                Number(data.multiplier)
                            );

                        }

                        else if (data.type === "CRASH") {

                            updateCrashUI(
                                Number(data.finalMultiplier),
                                data.history
                            );

                        }

                    } catch (error) {

                        console.error(
                            "خطأ في بيانات السيرفر:",
                            error
                        );

                    }

                };


                eventSource.onerror = function () {

                    if (!serverConnected) {

                        console.log(
                            "جاري الاتصال بقنوات البث المشتركة أونلاين..."
                        );

                        setTimeout(function () {

                            if (!serverConnected) {
                                startLocalLoop();
                            }

                        }, 1500);

                    }

                };

            } catch (err) {

                console.log(
                    "جاري الاتصال بقنوات البث المشتركة أونلاين..."
                );

                startLocalLoop();

            }

        }


        /* =========================
           Countdown UI
        ========================== */

        function updateCountdownUI(seconds) {

            if (isGameRunning) return;


            const wrapper =
                document.getElementById(
                    "countdown-wrapper"
                );

            const numText =
                document.getElementById(
                    "countdown-num"
                );

            const bar =
                document.getElementById(
                    "progress-bar"
                );

            const multText =
                document.getElementById(
                    "multiplier"
                );


            seconds =
                Math.max(
                    0,
                    Math.min(5, Number(seconds))
                );


            multText.style.display = "none";

            wrapper.style.display = "flex";

            numText.innerText = seconds;

            const offset =
                236 -
                (236 * (seconds / 5));


            bar.style.strokeDashoffset =
                offset;


            document
                .getElementById("auto-switch")
                .classList.remove("disabled");


            document
                .getElementById("auto-control-box")
                .classList.remove("locked");


            document
                .getElementById("header-multiplier")
                .innerText = "1.00x";

        }


        /* =========================
           Flight UI
        ========================== */

        function updateFlightUI(mult) {

            if (!Number.isFinite(mult)) return;


            isGameRunning = true;

            currentMultiplier = mult;


            const rCont =
                document.getElementById(
                    "rocket-container"
                );

            const path =
                document.getElementById(
                    "neon-curve"
                );

            const multText =
                document.getElementById(
                    "multiplier"
                );


            document
                .getElementById("countdown-wrapper")
                .style.display = "none";


            multText.style.display = "block";

            multText.innerText =
                mult.toFixed(2) + "x";


            document
                .getElementById("header-multiplier")
                .innerText =
                mult.toFixed(2) + "x";


            const currentColors =
                getColorByMultiplier(mult);


            path.setAttribute(
                "stroke",
                currentColors.hex
            );


            const xMove =
                Math.min(
                    210,
                    Math.max(0, (mult - 1) * 45)
                );


            const yMove =
                Math.min(
                    150,
                    Math.max(0, (mult - 1) * 65)
                );


            const finalY = yMove;


            rCont.style.transform =
                `translate(${xMove}px, -${finalY}px) rotate(-15deg)`;


            document
                .getElementById("auto-switch")
                .classList.add("disabled");


            document
                .getElementById("auto-control-box")
                .classList.add("locked");


            updatePlayersUI();


            if (
                hasBet &&
                autoCashoutEnabled &&
                mult >= autoCashoutTarget
            ) {

                triggerCashoutSuccess();

            }

        }


        /* =========================
           Crash UI
        ========================== */

        function updateCrashUI(
            finalMult,
            newHistory
        ) {

            isGameRunning = false;


            if (Number.isFinite(finalMult)) {

                currentMultiplier =
                    finalMult;

            }


            if (Array.isArray(newHistory)) {

                globalHistory =
                    newHistory;

            }


            clearInterval(loopInterval);

            loopInterval = null;


            const rocket =
                document.getElementById(
                    "rocket"
                );


            rocket.innerText = "💥";

            rocket.style.transform =
                "scale(1.4)";


            livePlayers.forEach(function (p) {

                if (p.state === "active") {

                    p.state = "lose";

                    p.finalMult =
                        currentMultiplier;

                }

            });


            updatePlayersUI();

            renderHistoryUI();


            hasBet = false;


            const btn =
                document.getElementById(
                    "action-btn"
                );


            if (isQueuedForNextRound) {

                btn.innerText =
                    "Waiting for Takeoff...";

                btn.className =
                    "main-btn";

                btn.disabled = true;

            }


            setTimeout(function () {

                rocket.innerText = "🚀";

                rocket.style.transform = "none";

                document
                    .getElementById(
                        "rocket-container"
                    )
                    .style.transform = "none";


                if (!serverConnected) {

                    startLocalLoop();

                }

            }, 3000);

        }


        /* =========================
           Stars
        ========================== */

        const bg =
            document.getElementById(
                "space-bg"
            );


        const starColors = [
            "#fff",
            "#00ffcc",
            "#0066ff",
            "#ffaa00",
            "#ff3366"
        ];


        for (let i = 0; i < 35; i++) {

            const star =
                document.createElement("div");


            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.background =
                starColors[
                    Math.floor(
                        Math.random() *
                        starColors.length
                    )
                ];

            star.style.animationDuration =
                (Math.random() * 1.5 + 0.8) +
                "s";


            bg.appendChild(star);

        }


        /* =========================
           Auto Cashout
        ========================== */

        function toggleAutoCashout() {

            if (isGameRunning) return;


            autoCashoutEnabled =
                !autoCashoutEnabled;


            document
                .getElementById("auto-switch")
                .className =
                "switch-btn" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );


            document
                .getElementById("auto-control-box")
                .className =
                "auto-cashout-control-row" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );

        }


        function adjustAutoVal(val) {

            if (
                !autoCashoutEnabled ||
                isGameRunning
            ) {
                return;
            }


            autoCashoutTarget =
                parseFloat(
                    (
                        autoCashoutTarget +
                        val
                    ).toFixed(2)
                );


            if (autoCashoutTarget < 1.1) {
                autoCashoutTarget = 1.1;
            }


            if (autoCashoutTarget > 1000.0) {
                autoCashoutTarget = 1000.0;
            }


            document
                .getElementById(
                    "auto-cashout-val"
                )
                .innerText =
                autoCashoutTarget.toFixed(2) +
                " x";

        }


        /* =========================
           History
        ========================== */

        function renderHistoryUI() {

            const bar =
                document.getElementById(
                    "history-bar"
                );


            if (!bar) return;


            bar.innerHTML = "";


            globalHistory.forEach(function (val) {

                const badgeColors =
                    getColorByMultiplier(
                        Number(val)
                    );


                const badge =
                    document.createElement(
                        "div"
                    );


                badge.className =
                    `history-badge ${badgeColors.name}`;


                badge.innerText =
                    Number(val).toFixed(2) +
                    "x";


                bar.appendChild(badge);

            });

        }


        /* =========================
           Players
        ========================== */

        function updatePlayersUI() {

            const feed =
                document.getElementById(
                    "players-feed"
                );


            if (!feed) return;


            feed.innerHTML = "";


            livePlayers.forEach(function (p) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    `player-card ${p.state}`;


                const stateClass =
                    p.state === "active"
                        ? "active"
                        : (
                            p.state === "win"
                                ? "win"
                                : "lose"
                        );


                const runningMult =
                    p.state === "active"
                        ? currentMultiplier
                        : p.finalMult;


                let imgTag;


                if (p.avatar) {

                    imgTag =
                        `<img src="${p.avatar}" alt="${p.name}">`;

                } else {

                    imgTag =
                        `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${p.color}">${p.name.charAt(0)}</div>`;

                }


                card.innerHTML = `
                    <div class="p-info">

                        <div class="p-avatar">
                            ${imgTag}
                        </div>

                        <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">

                            <span style="font-weight:bold; font-size:13px;">
                                ${p.name}
                            </span>

                            <span style="font-size:11px; color:#8a92b2; direction:ltr;">
                                💎 ${Number(p.bet).toFixed(2)} ×${Number(runningMult).toFixed(2)}
                            </span>

                        </div>

                    </div>

                    <div class="p-status-box ${stateClass}">
                        💎 ${(Number(p.bet) * Number(runningMult)).toFixed(2)}
                    </div>
                `;


                feed.appendChild(card);

            });

        }


        /* =========================
           Multiplier Colors
        ========================== */

        function getColorByMultiplier(val) {

            if (val < 1.30) {
                return {
                    name: "red",
                    hex: "#ff3366"
                };
            }

            if (val >= 1.30 && val < 2.00) {
                return {
                    name: "green",
                    hex: "#00ffcc"
                };
            }

            if (val >= 2.00 && val < 5.00) {
                return {
                    name: "blue",
                    hex: "#0066ff"
                };
            }

            if (val >= 5.00 && val < 9.00) {
                return {
                    name: "purple",
                    hex: "#a020f0"
                };
            }

            if (val >= 9.00 && val < 25.00) {
                return {
                    name: "gold",
                    hex: "#ffaa00"
                };
            }

            if (val >= 25.00) {
                return {
                    name: "fire",
                    hex: "#ff4400"
                };
            }

            return {
                name: "green",
                hex: "#00ffcc"
            };

        }


        /* =========================
           Balance UI
        ========================== */

        function updateBalanceUI() {

            document
                .getElementById("ton-balance")
                .innerText =
                tonBalance.toFixed(2);


            document
                .getElementById("balance-label")
                .innerText =
                tonBalance.toFixed(2) +
                " TON";

        }


        /* =========================
           Bet Validation
        ========================== */

        function getBetAmount() {

            const input =
                document.getElementById(
                    "bet-input"
                );


            const amount =
                parseFloat(input.value);


            if (
                !Number.isFinite(amount) ||
                amount <= 0
            ) {

                return 0;

            }


            return amount;

        }


        /* =========================
           Find User Player
        ========================== */

        function getUserPlayer() {

            return livePlayers.find(
                function (p) {
                    return p.isUser === true;
                }
            );

        }


        /* =========================
           Local Game Loop
        ========================== */

        function startLocalLoop() {

            if (
                serverConnected ||
                fallbackStarted
            ) {
                return;
            }


            fallbackStarted = true;


            clearInterval(loopInterval);


            isGameRunning = false;

            isQueuedForNextRound = false;

            currentMultiplier = 1.00;


            let count = 5;


            updateCountdownUI(count);


            loopInterval =
                setInterval(function () {

                    if (serverConnected) {

                        clearInterval(
                            loopInterval
                        );

                        loopInterval = null;

                        fallbackStarted = false;

                        return;

                    }


                    if (count > 0) {

                        updateCountdownUI(count);

                        count--;

                        return;

                    }


                    clearInterval(
                        loopInterval
                    );


                    loopInterval = null;


                    startLocalFlight();

                }, 1000);

        }


        function startLocalFlight() {

            if (serverConnected) {
                fallbackStarted = false;
                return;
            }


            isGameRunning = true;

            fallbackStarted = true;

            currentMultiplier = 1.00;


            document
                .getElementById(
                    "countdown-wrapper"
                )
                .style.display = "none";


            document
                .getElementById(
                    "multiplier"
                )
                .style.display = "block";


            /* تفعيل الرهان المؤجل */
            if (isQueuedForNextRound) {

                hasBet = true;

                isQueuedForNextRound = false;

                const userPlayer =
                    getUserPlayer();


                if (userPlayer) {

                    userPlayer.state =
                        "active";

                    userPlayer.finalMult =
                        1.00;

                }

            }


            let crashPoint = 1.01;

            const diceRoll =
                Math.random();


            if (diceRoll < 0.70) {

                crashPoint =
                    1.01 +
                    (Math.random() * 0.78);

            }

            else if (diceRoll < 0.99) {

                crashPoint =
                    1.80 +
                    (Math.random() * 8.20);

            }

            else {

                crashPoint =
                    10.00 +
                    (Math.random() * 25.00);

            }


            loopInterval =
                setInterval(function () {

                    if (
                        !isGameRunning ||
                        serverConnected
                    ) {

                        clearInterval(
                            loopInterval
                        );

                        loopInterval = null;

                        return;

                    }


                    currentMultiplier +=
                        0.0111;


                    updateFlightUI(
                        currentMultiplier
                    );


                    if (
                        currentMultiplier >=
                        crashPoint
                    ) {

                        clearInterval(
                            loopInterval
                        );

                        loopInterval = null;

                        updateCrashUI(
                            currentMultiplier
                        );

                    }

                }, 30);

        }


        /* =========================
           Action Button
        ========================== */

        function handleAction() {

            const btn =
                document.getElementById(
                    "action-btn"
                );


            /* Cashout */
            if (
                isGameRunning &&
                hasBet
            ) {

                triggerCashoutSuccess();

                return;

            }


            /* Queue for next round */
            if (
                isGameRunning &&
                !hasBet
            ) {

                if (
                    !isQueuedForNextRound
                ) {

                    const amt =
                        getBetAmount();


                    if (
                        amt <= 0 ||
                        amt > tonBalance
                    ) {

                        return;

                    }


                    isQueuedForNextRound =
                        true;


                    userBetAmount =
                        amt;


                    tonBalance -= amt;


                    updateBalanceUI();


                    const existing =
                        getUserPlayer();


                    if (existing) {

                        existing.bet = amt;

                        existing.state =
                            "active";

                        existing.finalMult =
                            1.00;

                    } else {

                        livePlayers.unshift({

                            name: firstName,

                            bet: amt,

                            color: "#ff3366",

                            avatar: userPhoto,

                            state: "active",

                            finalMult: 1.00,

                            isUser: true

                        });

                    }


                    updatePlayersUI();


                    btn.className =
                        "main-btn queued";


                    btn.innerText =
                        "Queued for Next Round ⏳";


                    btn.disabled = true;

                }


                return;

            }


            /* Bet during countdown */
            if (
                !isGameRunning &&
                !hasBet
            ) {

                const amt =
                    getBetAmount();


                if (
                    amt <= 0 ||
                    amt > tonBalance
                ) {

                    return;

                }


                hasBet = true;

                userBetAmount =
                    amt;


                tonBalance -= amt;


                updateBalanceUI();


                const existing =
                    getUserPlayer();


                if (existing) {

                    existing.bet =
                        amt;

                    existing.state =
                        "active";

                    existing.finalMult =
                        1.00;

                } else {

                    livePlayers.unshift({

                        name: firstName,

                        bet: amt,

                        color: "#ff3366",

                        avatar: userPhoto,

                        state: "active",

                        finalMult: 1.00,

                        isUser: true

                    });

                }


                updatePlayersUI();


                btn.innerText =
                    "Waiting for Takeoff...";


                btn.disabled = true;

            }

        }


        /* =========================
           Cashout
        ========================== */

        function triggerCashoutSuccess() {

            if (!hasBet) return;


            hasBet = false;


            const amt =
                userBetAmount > 0
                    ? userBetAmount
                    : getBetAmount();


            const winAmt =
                amt * currentMultiplier;


            tonBalance +=
                winAmt;


            updateBalanceUI();


            livePlayers.forEach(
                function (p) {

                    if (p.isUser === true) {

                        p.state = "win";

                        p.finalMult =
                            currentMultiplier;

                    }

                }
            );


            updatePlayersUI();


            const btn =
                document.getElementById(
                    "action-btn"
                );


            btn.innerText =
                "Bet for Next Round ⏳";


            btn.className =
                "main-btn";


            btn.disabled = true;


            userBetAmount = 0;

        }


        /* =========================
           Initial Players
        ========================== */

        livePlayers =
            basePlayers.map(function (p) {

                return {
                    ...p
                };

            });


        renderHistoryUI();

        updatePlayersUI();

        updateBalanceUI();


        /* =========================
           Start
        ========================== */

        listenToGlobalServer();

    </script>

</body>
</html>
