<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Cash</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background-color: #0b0c10; color: #fff; text-align: center; margin: 0; overflow: hidden; }
        #wrapper { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        #history-bar { display: flex; gap: 8px; background: rgba(22,22,37,0.6); padding: 10px; border-radius: 12px; min-height: 25px; }
        .h-item { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; background: rgba(78,159,61,0.2); color: #4e9f3d; }
        #container { position: relative; width: 100%; height: 60vh; background: radial-gradient(#1f2833, #0b0c10); border-radius: 20px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #mult { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: 900; color: #66fcf1; }
        #msg { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 16px; color: #c5c6c7; }
        #btn { background: #1f4068; color: #66fcf1; border: 2px solid #66fcf1; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 15px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="history-bar"><div class="h-item">1.70x</div><div class="h-item">13.8x</div><div class="h-item">1.43x</div></div>
        <div id="container">
            <div id="msg">READY TO LAUNCH</div>
            <div id="mult">1.00x</div>
            <canvas id="gameCanvas"></canvas>
        </div>
        <button id="btn" onclick="action()">Place Bet</button>
    </div>
    <script>
        if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}
        const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
        const mult=document.getElementById('mult'), msg=document.getElementById('msg'), btn=document.getElementById('btn');
        canvas.width=canvas.parentElement.clientWidth; canvas.height=canvas.parentElement.clientHeight;
        let state='IDLE', value=1.00, crash=1.00, loop, path=[], rx=40, ry=canvas.height-40;
        let stars=[]; for(let i=0;i<30;i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff';
            stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill(); if(state==='FLYING'){s.x-=1;s.y+=1;} if(s.x<0)s.x=canvas.width; if(s.y>canvas.height)s.y=0;});
            if(path.length>1){ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.strokeStyle='#66fcf1';ctx.lineWidth=4;ctx.stroke();}
            if(state==='FLYING'){
                value+=0.01; mult.innerText=value.toFixed(2)+'x'; let p=(value-1)/4; if(p>0.85)p=0.85;
                rx=40+(canvas.width-80)*p; ry=(canvas.height-40)-(canvas.height-100)*Math.sin(p*Math.PI/2); path.push({x:rx,y:ry});
                ctx.save();ctx.translate(rx,ry);ctx.rotate(-Math.PI/4);ctx.font='35px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚀',0,0);ctx.restore();
                if(value>=crash) end(false);
            }else if(state==='CRASHED'){ctx.font='40px Arial';ctx.fillText('💥',rx,ry);}
            else{ctx.save();ctx.translate(40,canvas.height-40);ctx.rotate(-Math.PI/4);ctx.font='35px Arial';ctx.fillText('🚀',0,0);ctx.restore();}
            loop=requestAnimationFrame(draw);
        }
        draw();
        function action(){
            if(state==='IDLE'||state==='CRASHED'){ state='FLYING'; value=1.00; path=[]; msg.innerText='FLIGHT IN PROGRESS...'; btn.innerText='Cash Out'; crash=(Math.random()*4+1.05).toFixed(2); }
            else if(state==='FLYING') end(true);
        }
        function end(w){
            cancelAnimationFrame(loop);
            if(w){ state='IDLE'; msg.innerText='🎉 CASH OUT SUCCESS: '+value.toFixed(2)+'x'; btn.innerText='Place Bet'; }
            else{ state='CRASHED'; mult.innerText='💥 CRASH'; msg.innerText='CRASHED AT '+crash+'x'; btn.innerText='Try Again'; }
            loop=requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
