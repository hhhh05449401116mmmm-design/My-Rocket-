<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Epic Gift Rocket Multiplayer Pro</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            order: 1;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
            order: 2;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .game-container {
            padding: 10px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(280px) translateX(-280px);
                opacity: 0;
            }
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .curve-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray 0.06s linear, stroke 0.1s;
        }

        .rocket-container-wrapper {
            position: absolute;
            bottom: 52px;
            left: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transform: translate(0, 0);
            transition: transform 0.06s linear;
        }

        .rocket-zone {
            font-size: 52px;
            display: inline-block;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8));
            text-shadow: 0 0 10px #00ffcc;
            font-style: normal;
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--p-color, #ffaa00);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(0.5px);
            animation: emitParticle 0.3s linear infinite;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.1);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 55px;
            font-weight: bold;
            color: #fff;
            z-index: 4;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .history-badge.blue {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
            border: 1px solid #0066ff44;
        }

        .history-badge.purple {
            background: rgba(160, 32, 240, 0.15);
            color: #a020f0;
            border: 1px solid #a020f044;
        }

        .history-badge.gold {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid #ffaa0044;
        }

        .history-badge.fire {
            background: rgba(255, 68, 0, 0.18);
            color: #ff4400;
            border: 1px solid #ff440055;
            font-weight: 800;
            box-shadow: 0 0 6px rgba(255,68,0,0.2);
        }

        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .switch-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .auto-cashout-control-row.locked {
            opacity: 0.3 !important;
            pointer-events: none;
            cursor: not-allowed;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }

        .main-btn.queued {
            background: #ffaa00;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,170,0,0.3);
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
        }

        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
            transition: all 0.1s ease;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.08);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.03);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            background: #2b3047;
        }

        .p-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-status-box {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .p-status-box.active {
            background: rgba(0,102,255,0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0,255,204,0.2);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255,51,102,0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="profile-zone">

            <div id="avatar-box" class="avatar-container">⚙️</div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <span id="username" style="font-weight:bold; font-size:13px;">
                    جاري التحميل...
                </span>

                <span id="role-tag" class="player-badge">
                    لاعب
                </span>
            </div>

        </div>

        <div class="balances-wrapper">

            <div class="balance-box ton">
                <span id="ton-balance">126.04</span>
                <span>TON</span>
            </div>

        </div>

    </div>

    <div class="game-container">

        <div id="space-bg" class="space-bg"></div>

        <svg class="svg-canvas" viewBox="0 0 320 250" preserveAspectRatio="none">
            <path
                id="neon-curve"
                class="curve-line"
                d="M 55 220"
                stroke="#00ffcc">
            </path>
        </svg>

        <div id="rocket-container" class="rocket-container-wrapper">
            <div id="rocket" class="rocket-zone">🚀</div>
        </div>

        <div
            id="multiplier"
            class="multiplier"
            style="display:none;">
            1.00x
        </div>

        <div
            id="countdown-wrapper"
            class="countdown-container">

            <svg class="countdown-svg" viewBox="0 0 80 80">

                <circle
                    class="bg-circle"
                    cx="40"
                    cy="40"
                    r="37.5">
                </circle>

                <circle
                    id="progress-bar"
                    class="bar-circle"
                    cx="40"
                    cy="40"
                    r="37.5">
                </circle>

            </svg>

            <div
                id="countdown-num"
                class="countdown-number">
                5
            </div>

        </div>

    </div>

    <div id="history-bar" class="history-row"></div>

    <div class="bet-panel">

        <div class="info-row">

            <span id="balance-label">
                126.04 TON
            </span>

            <span>
                Available Balance
            </span>

        </div>

        <div class="input-box-wrapper">

            <input
                id="bet-input"
                class="amount-input"
                type="number"
                value="1.00"
                min="0.01"
                step="0.01"
                inputmode="decimal">

            <span>
                Bet Amount
            </span>

        </div>

        <div class="switch-row">

            <span>
                Auto cashout
            </span>

            <div
                id="auto-switch"
                class="switch-btn"
                onclick="toggleAutoCashout()">

                <div class="switch-circle"></div>

            </div>

        </div>

        <div
            id="auto-control-box"
            class="auto-cashout-control-row">

            <button
                class="step-btn"
                onclick="adjustAutoVal(-0.10)">
                -
            </button>

            <span
                id="auto-cashout-val"
                class="auto-val-display">
                1.50 x
            </span>

            <button
                class="step-btn"
                onclick="adjustAutoVal(0.10)">
                +
            </button>

        </div>

        <button
            id="action-btn"
            class="main-btn"
            onclick="handleAction()">

            Place TON Bet 🚀

        </button>

    </div>

    <div
        id="players-feed"
        class="players-list">
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.expand();
        }

        const telegramId = String(
            tg?.initDataUnsafe?.user?.id || "7385640899"
        );

        const firstName =
            tg?.initDataUnsafe?.user?.first_name || "اللاعب";

        const userPhoto =
            tg?.initDataUnsafe?.user?.photo_url || "";

        document.getElementById("username").innerText =
            firstName;

        const avatarBox =
            document.getElementById("avatar-box");

        if (userPhoto) {

            const img =
                document.createElement("img");

            img.src = userPhoto;
            img.alt = "profile";

            avatarBox.innerHTML = "";
            avatarBox.appendChild(img);

        } else {

            avatarBox.innerText =
                firstName.charAt(0).toUpperCase();
        }

        if (telegramId === "7385640899") {

            const role =
                document.getElementById("role-tag");

            role.innerText = "المالك";
            role.className = "admin-badge";
        }

        let tonBalance = 126.04;
        let isGameRunning = false;
        let hasBet = false;
        let isQueuedForNextRound = false;
        let currentMultiplier = 1.00;

        let autoCashoutEnabled = false;
        let autoCashoutTarget = 1.50;

        const basePlayers = [
            {
                name: "LA",
                bet: 1.00,
                color: "#e066ff",
                avatar: "https://unsplash.com",
                state: "active",
                finalMult: 1.00
            },
            {
                name: "755",
                bet: 0.10,
                color: "#ffaa00",
                avatar: "https://unsplash.com",
                state: "active",
                finalMult: 1.00
            }
        ];

        let livePlayers = [];

        let globalHistory = [
            1.24,
            2.15,
            6.40,
            11.86,
            27.50
        ];

        /*
         * الربط الجماعي:
         * ضع عنوان السيرفر الحقيقي هنا، مثال:
         * https://your-server.example.com
         *
         * لا يمكن استخدام "railway.app" وحدها كرابط EventSource.
         */
        const BACKEND_URL = "";

        let globalEventSource = null;

        function listenToGlobalServer() {

            if (!BACKEND_URL) {
                console.log(
                    "السيرفر يشتغل بنظام المحاكاة الاحتياطية"
                );
                return;
            }

            try {

                globalEventSource =
                    new EventSource(
                        `${BACKEND_URL}/api/game-stream`
                    );

                globalEventSource.onmessage =
                    (event) => {

                        try {

                            const data =
                                JSON.parse(event.data);

                            if (data.type === "COUNTDOWN") {

                                updateCountdownUI(
                                    data.seconds
                                );

                            } else if (data.type === "FLIGHT") {

                                updateFlightUI(
                                    Number(data.multiplier)
                                );

                            } else if (data.type === "CRASH") {

                                updateCrashUI(
                                    Number(data.finalMultiplier),
                                    data.history
                                );
                            }

                        } catch (error) {

                            console.error(
                                "خطأ في بيانات البث:",
                                error
                            );
                        }
                    };

                globalEventSource.onerror =
                    () => {

                        console.log(
                            "تعذر الاتصال بالسيرفر، يعمل النظام الاحتياطي."
                        );

                    };

            } catch (error) {

                console.log(
                    "السيرفر يشتغل بنظام الربط الجماعي السحابي"
                );
            }
        }

        function updateCountdownUI(seconds) {

            isGameRunning = false;

            const wrapper =
                document.getElementById(
                    "countdown-wrapper"
                );

            const numText =
                document.getElementById(
                    "countdown-num"
                );

            const bar =
                document.getElementById(
                    "progress-bar"
                );

            const multText =
                document.getElementById(
                    "multiplier"
                );

            multText.style.display = "none";
            wrapper.style.display = "flex";

            numText.innerText = seconds;

            const safeSeconds =
                Math.max(
                    0,
                    Math.min(5, Number(seconds))
                );

            const offset =
                236 -
                (236 * (safeSeconds / 5));

            bar.style.strokeDashoffset =
                offset;

            document
                .getElementById("auto-switch")
                .classList.remove("disabled");

            document
                .getElementById("auto-control-box")
                .classList.remove("locked");
        }

        function updateFlightUI(mult) {

            if (!Number.isFinite(mult)) return;

            isGameRunning = true;
            currentMultiplier = mult;

            const rCont =
                document.getElementById(
                    "rocket-container"
                );

            const path =
                document.getElementById(
                    "neon-curve"
                );

            const multText =
                document.getElementById(
                    "multiplier"
                );

            document
                .getElementById("countdown-wrapper")
                .style.display = "none";

            multText.style.display = "block";

            multText.innerText =
                mult.toFixed(2) + "x";

            const currentColors =
                getColorByMultiplier(mult);

            path.setAttribute(
                "stroke",
                currentColors.hex
            );

            path.style.filter =
                `drop-shadow(0 0 6px ${currentColors.hex})`;

            const startX = 55;
            const startY = 220;

            let xMove;
            let yMove;

            if (mult <= 1.30) {

                xMove =
                    Math.max(
                        0,
                        (mult - 1) * 230
                    );

                yMove = 0;

            } else {

                xMove =
                    69 +
                    (mult - 1.30) * 45;

                yMove =
                    (mult - 1.30) * 65;
            }

            xMove =
                Math.min(210, xMove);

            yMove =
                Math.min(150, yMove);

            rCont.style.transform =
                `translate(${xMove}px, -${yMove}px) rotate(-15deg)`;

            const currentX =
                startX + xMove;

            const currentY =
                startY - yMove;

            if (mult <= 1.30) {

                path.setAttribute(
                    "d",
                    `M ${startX} ${startY} L ${currentX} ${currentY}`
                );

            } else {

                const controlX =
                    startX + 69;

                const controlY =
                    startY;

                path.setAttribute(
                    "d",
                    `M ${startX} ${startY} Q ${controlX} ${controlY} ${currentX} ${currentY}`
                );
            }

            document
                .getElementById("auto-switch")
                .classList.add("disabled");

            document
                .getElementById("auto-control-box")
                .classList.add("locked");

            updatePlayersUI();

            if (
                hasBet &&
                autoCashoutEnabled &&
                mult >= autoCashoutTarget
            ) {
                triggerCashoutSuccess();
            }
        }

        function updateCrashUI(finalMult, newHistory) {

            isGameRunning = false;

            if (
                Array.isArray(newHistory)
            ) {
                globalHistory =
                    newHistory;
            } else {

                globalHistory.unshift(
                    finalMult
                );

                if (
                    globalHistory.length > 5
                ) {
                    globalHistory.pop();
                }
            }

            const rocket =
                document.getElementById(
                    "rocket"
                );

            rocket.innerText = "💥";
            rocket.style.transform =
                "scale(1.4)";

            livePlayers.forEach((p) => {

                if (p.state === "active") {

                    p.state = "lose";
                    p.finalMult =
                        finalMult;
                }
            });

            updatePlayersUI();
            renderHistoryUI();

            hasBet = false;

            const btn =
                document.getElementById(
                    "action-btn"
                );

            btn.innerText =
                "Place TON Bet 🚀";

            btn.className =
                "main-btn";

            btn.disabled = false;

            setTimeout(() => {

                rocket.innerText = "🚀";

                rocket.style.transform =
                    "none";

                document
                    .getElementById(
                        "rocket-container"
                    )
                    .style.transform =
                    "none";

            }, 3000);
        }

        const bg =
            document.getElementById(
                "space-bg"
            );

        const starColors = [
            "#fff",
            "#00ffcc",
            "#0066ff",
            "#ffaa00",
            "#ff3366"
        ];

        for (let i = 0; i < 35; i++) {

            const star =
                document.createElement(
                    "div"
                );

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.background =
                starColors[
                    Math.floor(
                        Math.random() *
                        starColors.length
                    )
                ];

            star.style.animationDuration =
                (Math.random() * 1.5 + 0.8) +
                "s";

            bg.appendChild(star);
        }

        function toggleAutoCashout() {

            if (isGameRunning) return;

            autoCashoutEnabled =
                !autoCashoutEnabled;

            document
                .getElementById("auto-switch")
                .className =
                "switch-btn" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );

            document
                .getElementById("auto-control-box")
                .className =
                "auto-cashout-control-row" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );
        }

        function adjustAutoVal(val) {

            if (
                !autoCashoutEnabled ||
                isGameRunning
            ) {
                return;
            }

            autoCashoutTarget =
                parseFloat(
                    (
                        autoCashoutTarget +
                        val
                    ).toFixed(2)
                );

            if (
                autoCashoutTarget < 1.1
            ) {
                autoCashoutTarget =
                    1.1;
            }

            if (
                autoCashoutTarget > 1000.0
            ) {
                autoCashoutTarget =
                    1000.0;
            }

            document
                .getElementById(
                    "auto-cashout-val"
                )
                .innerText =
                autoCashoutTarget.toFixed(2) +
                " x";
        }

        function renderHistoryUI() {

            const bar =
                document.getElementById(
                    "history-bar"
                );

            bar.innerHTML = "";

            globalHistory.forEach(
                (val) => {

                    const badgeColors =
                        getColorByMultiplier(
                            Number(val)
                        );

                    const badge =
                        document.createElement(
                            "div"
                        );

                    badge.className =
                        `history-badge ${badgeColors.name}`;

                    badge.innerText =
                        Number(val).toFixed(2) +
                        "x";

                    bar.appendChild(
                        badge
                    );
                }
            );
        }

        function updatePlayersUI() {

            const feed =
                document.getElementById(
                    "players-feed"
                );

            feed.innerHTML = "";

            livePlayers.forEach(
                (p) => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        `player-card ${p.state}`;

                    const stateClass =
                        p.state === "active"
                            ? "active"
                            : p.state === "win"
                                ? "win"
                                : "lose";

                    const runningMult =
                        p.state === "active"
                            ? currentMultiplier
                            : p.finalMult;

                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "p-info";

                    const avatar =
                        document.createElement(
                            "div"
                        );

                    avatar.className =
                        "p-avatar";

                    if (p.avatar) {

                        const img =
                            document.createElement(
                                "img"
                            );

                        img.src =
                            p.avatar;

                        img.alt =
                            p.name;

                        avatar.appendChild(
                            img
                        );

                    } else {

                        avatar.innerText =
                            p.name.charAt(0);
                    }

                    const details =
                        document.createElement(
                            "div"
                        );

                    details.style.display =
                        "flex";

                    details.style.flexDirection =
                        "column";

                    details.style.alignItems =
                        "flex-start";

                    details.style.gap =
                        "2px";

                    const name =
                        document.createElement(
                            "span"
                        );

                    name.style.fontWeight =
                        "bold";

                    name.style.fontSize =
                        "13px";

                    name.innerText =
                        p.name;

                    const betInfo =
                        document.createElement(
                            "span"
                        );

                    betInfo.style.fontSize =
                        "11px";

                    betInfo.style.color =
                        "#8a92b2";

                    betInfo.style.direction =
                        "ltr";

                    betInfo.innerText =
                        `💎 ${Number(p.bet).toFixed(2)} ×${Number(runningMult).toFixed(2)}`;

                    details.appendChild(
                        name
                    );

                    details.appendChild(
                        betInfo
                    );

                    info.appendChild(
                        avatar
                    );

                    info.appendChild(
                        details
                    );

                    const status =
                        document.createElement(
                            "div"
                        );

                    status.className =
                        `p-status-box ${stateClass}`;

                    status.innerText =
                        `💎 ${(Number(p.bet) * Number(runningMult)).toFixed(2)}`;

                    card.appendChild(
                        info
                    );

                    card.appendChild(
                        status
                    );

                    feed.appendChild(
                        card
                    );
                }
            );
        }

        function getColorByMultiplier(val) {

            if (val < 1.30) {
                return {
                    name: "red",
                    hex: "#ff3366"
                };
            }

            if (
                val >= 1.30 &&
                val < 2.00
            ) {
                return {
                    name: "green",
                    hex: "#00ffcc"
                };
            }

            if (
                val >= 2.00 &&
                val < 5.00
            ) {
                return {
                    name: "blue",
                    hex: "#0066ff"
                };
            }

            if (
                val >= 5.00 &&
                val < 9.00
            ) {
                return {
                    name: "purple",
                    hex: "#a020f0"
                };
            }

            if (
                val >= 9.00 &&
                val < 25.00
            ) {
                return {
                    name: "gold",
                    hex: "#ffaa00"
                };
            }

            if (val >= 25.00) {
                return {
                    name: "fire",
                    hex: "#ff4400"
                };
            }

            return {
                name: "green",
                hex: "#00ffcc"
            };
        }

        function getBetAmount() {

            const amount =
                parseFloat(
                    document.getElementById(
                        "bet-input"
                    ).value
                );

            if (
                !Number.isFinite(amount) ||
                amount <= 0
            ) {
                return null;
            }

            return amount;
        }

        function handleAction() {

            const btn =
                document.getElementById(
                    "action-btn"
                );

            const amount =
                getBetAmount();

            if (amount === null) {
                return;
            }

            if (
                amount > tonBalance
            ) {
                return;
            }

            if (
                isGameRunning &&
                hasBet
            ) {

                triggerCashoutSuccess();
                return;
            }

            if (
                isGameRunning &&
                !hasBet
            ) {

                if (
                    !isQueuedForNextRound
                ) {

                    isQueuedForNextRound =
                        true;

                    tonBalance -=
                        amount;

                    document
                        .getElementById(
                            "ton-balance"
                        )
                        .innerText =
                        tonBalance.toFixed(2);

                    document
                        .getElementById(
                            "balance-label"
                        )
                        .innerText =
                        tonBalance.toFixed(2) +
                        " TON";

                    btn.className =
                        "main-btn queued";

                    btn.innerText =
                        "Queued for Next Round ⏳";

                    btn.disabled = true;
                }

                return;
            }

            if (
                !isGameRunning &&
                !hasBet
            ) {

                hasBet = true;

                tonBalance -=
                    amount;

                document
                    .getElementById(
                        "ton-balance"
                    )
                    .innerText =
                    tonBalance.toFixed(2);

                document
                    .getElementById(
                        "balance-label"
                    )
                    .innerText =
                    tonBalance.toFixed(2) +
                    " TON";

                livePlayers.unshift({
                    name: firstName,
                    bet: amount,
                    color: "#ff3366",
                    avatar: userPhoto,
                    state: "active",
                    finalMult: 1.00
                });

                updatePlayersUI();

                btn.innerText =
                    "Waiting for Takeoff...";

                btn.disabled = true;
            }
        }

        function triggerCashoutSuccess() {

            if (!hasBet) return;

            const amount =
                getBetAmount();

            if (amount === null) {
                return;
            }

            hasBet = false;

            const winAmt =
                amount *
                currentMultiplier;

            tonBalance +=
                winAmt;

            document
                .getElementById(
                    "ton-balance"
                )
                .innerText =
                tonBalance.toFixed(2);

            document
                .getElementById(
                    "balance-label"
                )
                .innerText =
                tonBalance.toFixed(2) +
                " TON";

            livePlayers.forEach(
                (p) => {

                    if (
                        p.name ===
                        firstName
                    ) {

                        p.state =
                            "win";

                        p.finalMult =
                            currentMultiplier;
                    }
                }
            );

            updatePlayersUI();

            const btn =
                document.getElementById(
                    "action-btn"
                );

            btn.innerText =
                "Bet for Next Round ⏳";

            btn.className =
                "main-btn";

            btn.disabled = true;
        }

        let fallbackTimer = null;
        let fallbackFlightInterval = null;

        function startFallbackRound() {

            if (
                isGameRunning ||
                globalEventSource
            ) {
                return;
            }

            let seconds = 5;

            updateCountdownUI(
                seconds
            );

            if (fallbackTimer) {
                clearInterval(
                    fallbackTimer
                );
            }

            fallbackTimer =
                setInterval(() => {

                    if (
                        globalEventSource
                    ) {
                        clearInterval(
                            fallbackTimer
                        );

                        return;
                    }

                    seconds--;

                    if (seconds > 0) {

                        updateCountdownUI(
                            seconds
                        );

                    } else {

                        clearInterval(
                            fallbackTimer
                        );

                        startFallbackFlight();
                    }

                }, 1000);
        }

        function startFallbackFlight() {

            if (
                globalEventSource
            ) {
                return;
            }

            isGameRunning =
                true;

            currentMultiplier =
                1.00;

            let crashPoint =
                1.01 +
                (
                    Math.random() *
                    4
                );

            if (
                fallbackFlightInterval
            ) {
                clearInterval(
                    fallbackFlightInterval
                );
            }

            fallbackFlightInterval =
                setInterval(() => {

                    if (
                        globalEventSource
                    ) {
                        clearInterval(
                            fallbackFlightInterval
                        );

                        return;
                    }

                    currentMultiplier +=
                        0.0111;

                    updateFlightUI(
                        currentMultiplier
                    );

                    if (
                        currentMultiplier >=
                        crashPoint
                    ) {

                        clearInterval(
                            fallbackFlightInterval
                        );

                        updateCrashUI(
                            currentMultiplier
                        );

                        setTimeout(() => {

                            startFallbackRound();

                        }, 3500);
                    }

                }, 30);
        }

        listenToGlobalServer();

        if (!BACKEND_URL) {
            startFallbackRound();
        }

        renderHistoryUI();
        updatePlayersUI();
    </script>

</body>
</html>
