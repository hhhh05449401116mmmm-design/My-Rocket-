<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Rocket Cash</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            font-family: sans-serif;
            background: #07080c;
            color: #fff;
            margin: 0;
            padding: 12px;
            overflow: hidden;
            user-select: none;
        }

        #wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            box-sizing: border-box;
        }

        #container {
            position: relative;
            width: 100%;
            height: 38vh;
            background: radial-gradient(#151c24, #07080c);
            border-radius: 24px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mult {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            font-weight: 900;
            color: #66fcf1;
            font-family: monospace;
            z-index: 10;
        }

        #count-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            display: none;
            z-index: 15;
            animation: zPop 0.4s ease-out infinite alternate;
        }

        @keyframes zPop {

            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

        }

        #history-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            overflow-x: auto;
            min-height: 35px;
            align-items: center;
        }

        .h-item {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #4e9f3d;
            white-space: nowrap;
        }

        .c-red {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233, 69, 96, 0.15);
        }

        .c-blue {
            border-color: #0066ff;
            color: #0066ff;
            background: rgba(0, 102, 255, 0.15);
        }

        .c-green {
            border-color: #4e9f3d;
            color: #4e9f3d;
            background: rgba(78, 159, 61, 0.15);
        }

        .c-orange {
            border-color: #ffa500;
            color: #ffa500;
            background: rgba(255, 165, 0, 0.15);
        }

        .c-yellow {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }

        #btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        #btn.betting {
            background: #e94560;
        }

        #p-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 32vh;
            overflow-y: auto;
            flex-grow: 1;
        }

        .p-row {
            display: flex;
            justify-content: space-between;
            background: #131722;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .p-blue {
            color: #8a9fc4;
            font-size: 11px;
            font-weight: bold;
        }

        .row-win-low {
            background: rgba(78, 159, 61, 0.08) !important;
            border: 1px solid rgba(78, 159, 61, 0.4) !important;
        }

        .row-win-low b {
            color: #4e9f3d !important;
        }

        .row-win-low .p-blue {
            color: #72c361 !important;
        }

        .row-win-high {
            background: rgba(255, 215, 0, 0.08) !important;
            border: 1px solid rgba(255, 215, 0, 0.4) !important;
        }

        .row-win-high b {
            color: #ffd700 !important;
        }

        .row-win-high .p-blue {
            color: #ffeb7a !important;
        }

        .row-lose {
            background: rgba(233, 69, 96, 0.06) !important;
            border: 1px solid rgba(233, 69, 96, 0.3) !important;
        }

        .row-lose b {
            color: #e94560 !important;
        }

        .row-lose .p-blue {
            color: #ff758c !important;
        }

    </style>
</head>


<body>

    <div id="wrapper">

        <!-- GAME AREA -->

        <div id="container">

            <div id="mult">
                1.00x
            </div>

            <div id="count-box">
                5
            </div>

            <canvas id="gameCanvas"></canvas>

        </div>


        <!-- CONTROL PANEL -->

        <div id="control-panel">

            <div id="history-bar"></div>

            <button id="btn" onclick="handleAction()">
                Place bet
            </button>

        </div>


        <!-- PLAYERS LIST -->

        <div id="p-list"></div>

    </div>


    <script>

        /* =========================================
           TELEGRAM WEB APP
        ========================================= */

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            window.Telegram.WebApp.ready();

            window.Telegram.WebApp.expand();

        }


        /* =========================================
           ELEMENTS
        ========================================= */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");

        const mult =
            document.getElementById("mult");

        const btn =
            document.getElementById("btn");

        const hBar =
            document.getElementById("history-bar");

        const pList =
            document.getElementById("p-list");

        const cBox =
            document.getElementById("count-box");


        /* =========================================
           CANVAS SIZE
        ========================================= */

        function resizeCanvas() {

            canvas.width =
                canvas.parentElement.clientWidth;

            canvas.height =
                canvas.parentElement.clientHeight;

        }

        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =========================================
           GAME VARIABLES
        ========================================= */

        let state = "COUNTDOWN";

        let value = 1.00;

        let crash = 1.00;

        let loop;

        let path = [];

        let rx = 40;

        let ry =
            canvas.height - 40;

        let timer = 5;

        let countAngle = 0;

        let listPlayers = [];

        let lastTickTime =
            Date.now();

        let hasBet = false;

        let hasCashedOut = false;


        let historyList = [
            "3.70x",
            "3.07x",
            "11.26x",
            "5.64x",
            "1.00x"
        ];


        let stars = [];

        let particles = [];


        /* =========================================
           PLAYERS
        ========================================= */

        const pool = [

            {
                n: "BOB",
                b: 0.10,
                cashOutPoint: 3.36,
                status: "active"
            },

            {
                n: "honey",
                b: 0.10,
                cashOutPoint: 2.27,
                status: "active"
            },

            {
                n: "Aho",
                b: 0.15,
                cashOutPoint: 2.23,
                status: "active"
            },

            {
                n: "kee",
                b: 0.25,
                cashOutPoint: 2.20,
                status: "active"
            },

            {
                n: "Vitaly AUTH",
                b: 0.50,
                cashOutPoint: 15.00,
                status: "active"
            }

        ];


        /* =========================================
           STARS
        ========================================= */

        for (let i = 0; i < 30; i++) {

            stars.push({

                x:
                    Math.random() *
                    canvas.width,

                y:
                    Math.random() *
                    canvas.height,

                s:
                    Math.random() * 1.5,

                sp:
                    Math.random() * 1.2 + 0.6

            });

        }


        /* =========================================
           HISTORY COLORS
        ========================================= */

        function getHColor(val) {

            if (val <= 1.30) {

                return "#e94560";

            }

            if (val <= 2.00) {

                return "#0066ff";

            }

            if (val <= 5.00) {

                return "#4e9f3d";

            }

            if (val <= 10.00) {

                return "#ffa500";

            }

            return "#ffd700";

        }


        function getHClass(val) {

            if (val <= 1.30) {

                return "c-red";

            }

            if (val <= 2.00) {

                return "c-blue";

            }

            if (val <= 5.00) {

                return "c-green";

            }

            if (val <= 10.00) {

                return "c-orange";

            }

            return "c-yellow";

        }


        /* =========================================
           HISTORY UI
        ========================================= */

        function updateHistoryUI() {

            hBar.innerHTML = "";


            historyList
                .slice(-6)
                .reverse()
                .forEach(v => {

                    const d =
                        document.createElement("div");

                    d.className =
                        "h-item " +
                        getHClass(
                            parseFloat(v)
                        );

                    d.innerText = v;

                    hBar.appendChild(d);

                });

        }


        /* =========================================
           LIVE BETS
        ========================================= */

        function triggerLiveBets() {

            let delay = 0;


            const shuffled =
                [...pool].sort(
                    () => 0.5 - Math.random()
                );


            shuffled.forEach(p => {

                p.status = "active";

                p.winMult = 1.00;


                delay +=
                    Math.random() * 400 + 100;


                setTimeout(() => {

                    if (
                        state === "COUNTDOWN"
                    ) {

                        listPlayers.unshift(p);

                        renderPlayers();

                    }

                }, delay);

            });

        }


        /* =========================================
           RENDER PLAYERS
        ========================================= */

        function renderPlayers() {

            pList.innerHTML = "";


            listPlayers.forEach(p => {

                let rowClass = "p-row";

                let rightVal =
                    `🔹 ${p.b.toFixed(2)}`;


                /* WIN LOW */

                if (
                    p.status === "win-low"
                ) {

                    rowClass +=
                        " row-win-low";


                    rightVal =
                        `🔹 ${(p.b * p.winMult).toFixed(2)}`;

                }


                /* WIN HIGH */

                else if (
                    p.status === "win-high"
                ) {

                    rowClass +=
                        " row-win-high";


                    rightVal =
                        `🔹 ${(p.b * p.winMult).toFixed(2)}`;

                }


                /* LOSE */

                else if (
                    p.status === "lose"
                ) {

                    rowClass +=
                        " row-lose";


                    rightVal =
                        "💥 0.00";

                }


                const r =
                    document.createElement("div");


                r.className =
                    rowClass;


                let statText;


                if (
                    p.status.startsWith("win")
                ) {

                    statText =
                        `🔹 ${p.b} ×${p.winMult.toFixed(2)}`;

                }

                else {

                    statText =
                        `🔹 ${p.b} ×1.00`;

                }


                r.innerHTML = `

                    <div>

                        <b>
                            ${p.n}
                        </b>

                        <br>

                        <span class="p-blue">
                            ${statText}
                        </span>

                    </div>


                    <div>

                        <b>
                            ${rightVal}
                        </b>

                    </div>

                `;


                pList.appendChild(r);

            });

        }


        /* =========================================
           START COUNTDOWN
        ========================================= */

        function startCount() {

            state = "COUNTDOWN";

            timer = 5;

            countAngle = 0;


            cBox.style.display =
                "block";


            mult.style.display =
                "none";


            hasBet = false;

            hasCashedOut = false;


            btn.innerText =
                "Place bet";


            btn.className =
                "";


            cBox.innerText =
                timer;


            cBox.style.color =
                "#4e9f3d";


            mult.style.color =
                "#66fcf1";


            listPlayers = [];

            renderPlayers();

            triggerLiveBets();


            lastTickTime =
                Date.now();

        }


        /* =========================================
           GAME LOGIC
        ========================================= */

        function syncLogic() {

            const now =
                Date.now();


            const delta =
                (now - lastTickTime) /
                1000;


            lastTickTime =
                now;


            /* =====================================
               COUNTDOWN
            ===================================== */

            if (
                state === "COUNTDOWN"
            ) {

                timer -= delta;


                cBox.innerText =
                    Math.ceil(timer);


                if (
                    timer <= 0
                ) {

                    cBox.style.display =
                        "none";


                    mult.style.display =
                        "block";


                    state =
                        "FLYING";


                    value =
                        1.00;


                    path = [];

                    particles = [];


                    if (hasBet) {

                        btn.innerText =
                            "Cash Out";

                        btn.className =
                            "betting";

                    }

                    else {

                        btn.innerText =
                            "Place bet";

                        btn.className =
                            "";

                    }


                    /* CRASH POINT */

                    const r =
                        Math.random();


                    if (r < 0.1) {

                        crash =
                            1.00;

                    }

                    else if (r < 0.65) {

                        crash =
                            Math.random() *
                            3 +
                            1.01;

                    }

                    else if (r < 0.9) {

                        crash =
                            Math.random() *
                            15 +
                            3;

                    }

                    else {

                        crash =
                            Math.random() *
                            132 +
                            18;

                    }


                    if (crash > 150) {

                        crash = 150;

                    }

                }

            }


            /* =====================================
               FLYING
            ===================================== */

            else if (
                state === "FLYING"
            ) {

                value +=
                    delta * 0.45;


                mult.innerText =
                    value.toFixed(2) +
                    "x";


                /* PLAYER CASHOUT */

                listPlayers.forEach(p => {

                    if (
                        p.status === "active" &&
                        value >= p.cashOutPoint &&
                        p.cashOutPoint < crash
                    ) {

                        p.winMult =
                            p.cashOutPoint;


                        if (
                            p.cashOutPoint >= 10.00
                        ) {

                            p.status =
                                "win-high";

                        }

                        else {

                            p.status =
                                "win-low";

                        }


                        renderPlayers();

                    }

                });


                /* CRASH */

                if (
                    value >= crash
                ) {

                    state =
                        "CRASHED";


                    mult.innerText =
                        "💥 FLEW AWAY";


                    mult.style.color =
                        "#e94560";


                    historyList.push(
                        value.toFixed(2) +
                        "x"
                    );


                    listPlayers.forEach(p => {

                        if (
                            p.status === "active"
                        ) {

                            p.status =
                                "lose";

                        }

                    });


                    if (
                        hasBet &&
                        !hasCashedOut
                    ) {

                        btn.innerText =
                            "Place bet";

                        btn.className =
                            "";

                    }


                    renderPlayers();


                    if (
                        navigator.vibrate
                    ) {

                        navigator.vibrate(300);

                    }


                    updateHistoryUI();


                    setTimeout(
                        startCount,
                        2500
                    );

                }

            }

        }


        /* =========================================
           DRAW
        ========================================= */

        function draw() {

            syncLogic();


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* =====================================
               STARS
            ===================================== */

            ctx.fillStyle =
                "#fff";


            stars.forEach(s => {

                ctx.beginPath();


                ctx.arc(
                    s.x,
                    s.y,
                    s.s,
                    0,
                    Math.PI * 2
                );


                ctx.fill();


                if (
                    state === "FLYING"
                ) {

                    s.x -=
                        s.sp * 3.5;

                    s.y +=
                        s.sp * 3.5;

                }

                else {

                    s.x -=
                        s.sp * 0.2;

                    s.y +=
                        s.sp * 0.2;

                }


                if (
                    s.x < 0
                ) {

                    s.x =
                        canvas.width;

                }


                if (
                    s.y > canvas.height
                ) {

                    s.y = 0;

                }

            });


            /* =====================================
               COUNTDOWN CIRCLE
            ===================================== */

            if (
                state === "COUNTDOWN"
            ) {

                countAngle +=
                    (Math.PI * 2) /
                    (5 * 60);


                ctx.beginPath();


                ctx.arc(

                    canvas.width / 2,

                    canvas.height / 2,

                    55,

                    -Math.PI / 2,

                    (
                        Math.PI * 2 -
                        countAngle
                    ) -
                    Math.PI / 2,

                    false

                );


                ctx.strokeStyle =
                    "#ff7a00";


                ctx.lineWidth =
                    5;


                ctx.stroke();

            }


            /* =====================================
               COLOR
            ===================================== */

            const currentColor =
                getHColor(value);


            /* =====================================
               ROCKET PATH
            ===================================== */

            if (
                path.length > 1
            ) {

                ctx.save();


                ctx.beginPath();


                /*
                    FIX:
                    path.x
                    أصبحت
                    path[0].x
                */

                ctx.moveTo(
                    path[0].x,
                    path[0].y
                );


                for (
                    let i = 1;
                    i < path.length;
                    i++
                ) {

                    ctx.lineTo(
                        path[i].x,
                        path[i].y
                    );

                }


                ctx.strokeStyle =
                    currentColor;


                ctx.lineWidth =
                    4;


                ctx.shadowBlur =
                    10;


                ctx.shadowColor =
                    currentColor;


                ctx.stroke();


                ctx.restore();

            }


            /* =====================================
               PARTICLES
            ===================================== */

            if (
                state === "FLYING"
            ) {

                if (
                    Math.random() < 0.7
                ) {

                    particles.push({

                        x: rx,

                        y: ry,

                        vx:
                            (
                                Math.random() -
                                0.7
                            ) * 2,

                        vy:
                            (
                                Math.random() +
                                0.3
                            ) * 2.5,

                        size:
                            Math.random() *
                            1.8 +
                            0.5,

                        alpha: 1

                    });

                }

            }


            particles.forEach(
                (p, index) => {

                    ctx.save();


                    ctx.globalAlpha =
                        p.alpha;


                    ctx.fillStyle =
                        currentColor;


                    ctx.beginPath();


                    ctx.arc(
                        p.x,
                        p.y,
                        p.size,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();


                    ctx.restore();


                    p.x +=
                        p.vx;


                    p.y +=
                        p.vy;


                    p.alpha -=
                        0.03;


                    if (
                        p.alpha <= 0
                    ) {

                        particles.splice(
                            index,
                            1
                        );

                    }

                }
            );


            /* =====================================
               ROCKET
            ===================================== */

            if (
                state === "FLYING"
            ) {

                mult.style.color =
                    currentColor;


                /* MOVEMENT PROGRESS */

                let p;


                if (
                    value <= 10.00
                ) {

                    p =
                        (
                            (value - 1.00) /
                            9.00
                        ) *
                        0.45;

                }

                else {

                    p =
                        0.45 +
                        (
                            (value - 10.00) /
                            (
                                crash > 10
                                    ? crash - 10
                                    : 1
                            )
                        ) *
                        0.37;

                }


                if (
                    p > 0.82
                ) {

                    p = 0.82;

                }


                /* =================================
                   FIRST PART:
                   HORIZONTAL
                ================================= */

                if (
                    value <= 2.00
                ) {

                    rx =
                        40 +
                        (
                            canvas.width - 80
                        ) *
                        p *
                        1.5;


                    ry =
                        canvas.height - 40;

                }


                /* =================================
                   SECOND PART:
                   DIAGONAL UP
                ================================= */

                else {

                    rx =
                        40 +
                        (
                            canvas.width - 80
                        ) *
                        p;


                    let cProg =
                        (
                            value - 2.00
                        ) /
                        (
                            crash > 2
                                ? crash - 2
                                : 1
                        );


                    cProg =
                        Math.min(
                            Math.max(
                                cProg,
                                0
                            ),
                            1
                        );


                    /*
                        60% CLIMB
                    */

                    const climbAmount =
                        (
                            canvas.height - 90
                        ) *
                        0.60;


                    /*
                        DIAGONAL CURVE
                    */

                    ry =
                        (
                            canvas.height - 40
                        ) -
                        climbAmount *
                        Math.pow(
                            cProg,
                            0.85
                        );

                }


                /* =================================
                   ROCKET SHAKE
                ================================= */

                if (
                    p >= 0.82
                ) {

                    rx +=
                        (
                            Math.random() -
                            0.5
                        ) * 3;


                    ry +=
                        (
                            Math.random() -
                            0.5
                        ) * 3;

                }


                /* SAVE PATH */

                path.push({

                    x: rx,

                    y: ry

                });


                /* =================================
                   DRAW ROCKET
                ================================= */

                ctx.save();


                ctx.translate(
                    rx,
                    ry
                );


                ctx.rotate(
                    -Math.PI / 3
                );


                ctx.fillStyle =
                    "#f0f2f5";


                ctx.beginPath();


                ctx.moveTo(
                    0,
                    -16
                );


                ctx.lineTo(
                    7,
                    4
                );


                ctx.lineTo(
                    -7,
                    4
                );


                ctx.closePath();


                ctx.fill();


                ctx.restore();

            }


            /* =====================================
               CRASH
            ===================================== */

            else if (
                state === "CRASHED"
            ) {

                ctx.font =
                    "40px Arial";


                ctx.fillText(
                    "💥",
                    rx,
                    ry
                );

            }


            /* NEXT FRAME */

            loop =
                requestAnimationFrame(
                    draw
                );

        }


        /* =========================================
           BUTTON ACTION
        ========================================= */

        function handleAction() {


            /* PLACE BET */

            if (
                state === "COUNTDOWN"
            ) {

                hasBet =
                    true;


                btn.innerText =
                    "Bet Placed";


                btn.className =
                    "betting";

            }


            /* CASH OUT */

            else if (
                state === "FLYING" &&
                hasBet &&
                !hasCashedOut
            ) {

                hasCashedOut =
                    true;


                btn.innerText =
                    "Place bet";


                btn.className =
                    "";


                const userP = {

                    n: "You",

                    b: 1.00,

                    winMult: value,

                    status:
                        value >= 10.00
                            ? "win-high"
                            : "win-low"

                };


                listPlayers.unshift(
                    userP
                );


                renderPlayers();

            }

        }


        /* =========================================
           INITIALIZE
        ========================================= */

        updateHistoryUI();

        startCount();

        draw();

    </script>

</body>

</html>
