<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Epic Gift Rocket Multiplayer Pro</title>

    <!-- Telegram WebApp SDK الرسمي -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            order: 1;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
            order: 2;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .game-container {
            padding: 10px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(280px) translateX(-280px);
                opacity: 0;
            }
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .curve-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray 0.06s linear, stroke 0.1s;
        }

        .rocket-container-wrapper {
            position: absolute;
            bottom: 52px;
            left: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transform: translate(0, 0);
            transition: transform 0.06s linear;
        }

        .rocket-zone {
            font-size: 52px;
            display: inline-block;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.8));
            text-shadow: 0 0 10px #00ffcc;
            font-style: normal;
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--p-color, #ffaa00);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(0.5px);
            animation: emitParticle 0.3s linear infinite;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.1);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 55px;
            font-weight: bold;
            color: #fff;
            z-index: 4;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .history-badge.blue {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
            border: 1px solid #0066ff44;
        }

        .history-badge.purple {
            background: rgba(160, 32, 240, 0.15);
            color: #a020f0;
            border: 1px solid #a020f044;
        }

        .history-badge.gold {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid #ffaa0044;
        }

        .history-badge.fire {
            background: rgba(255, 68, 0, 0.18);
            color: #ff4400;
            border: 1px solid #ff440055;
            font-weight: 800;
            box-shadow: 0 0 6px rgba(255,68,0,0.2);
        }

        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .switch-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .auto-cashout-control-row.locked {
            opacity: 0.3 !important;
            pointer-events: none;
            cursor: not-allowed;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }

        .main-btn.queued {
            background: #ffaa00;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,170,0,0.3);
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
        }

        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
            transition: all 0.1s ease;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.08);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.03);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            background: #2b3047;
        }

        .p-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-status-box {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .p-status-box.active {
            background: rgba(0,102,255,0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0,255,204,0.2);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255,51,102,0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

<div class="header">

    <div class="profile-zone">

        <div id="avatar-box" class="avatar-container">
            ⚙️
        </div>

        <div style="display:flex; flex-direction:column; align-items:flex-start;">

            <span id="username" style="font-weight:bold; font-size:13px;">
                جاري الاتصال...
            </span>

            <span id="role-tag" class="player-badge">
                لاعب
            </span>

        </div>

    </div>


    <div class="balances-wrapper">

        <div class="balance-box ton">
            <span id="ton-balance">126.04</span> TON
        </div>

        <div class="balance-box">
            🚀
            <span id="header-multiplier">1.00x</span>
        </div>

    </div>

</div>


<div class="game-container">

    <div id="space-bg" class="space-bg"></div>

    <svg
        class="svg-canvas"
        viewBox="0 0 320 250"
        preserveAspectRatio="none">

        <path
            id="neon-curve"
            class="curve-line"
            d="M 45 220"
            stroke="#ff3366">
        </path>

    </svg>


    <div
        id="rocket-container"
        class="rocket-container-wrapper">

        <div
            id="rocket"
            class="rocket-zone">
            🚀
        </div>

    </div>


    <div
        id="multiplier"
        class="multiplier"
        style="display:none;">
        1.00x
    </div>


    <div
        id="countdown-wrapper"
        class="countdown-container">

        <svg
            class="countdown-svg"
            viewBox="0 0 80 80">

            <circle
                class="bg-circle"
                cx="40"
                cy="40"
                r="37">
            </circle>

            <circle
                id="progress-bar"
                class="bar-circle"
                cx="40"
                cy="40"
                r="37">
            </circle>

        </svg>

        <div
            id="countdown-num"
            class="countdown-number">
            5
        </div>

    </div>

</div>


<div
    id="history-bar"
    class="history-row">
</div>


<div class="bet-panel">

    <div class="info-row">
        <span>Available Balance</span>

        <span id="balance-label">
            126.04 TON
        </span>
    </div>


    <div class="info-row">
        <span>Bet Amount</span>
    </div>


    <div class="input-box-wrapper">

        <input
            id="bet-input"
            class="amount-input"
            type="number"
            min="0.01"
            step="0.01"
            value="1.00"
            inputmode="decimal">

        <span>TON</span>

    </div>


    <div class="switch-row">

        <span>Auto cashout</span>

        <div
            id="auto-switch"
            class="switch-btn"
            onclick="toggleAutoCashout()">

            <div class="switch-circle"></div>

        </div>

    </div>


    <div
        id="auto-control-box"
        class="auto-cashout-control-row">

        <button
            class="step-btn"
            type="button"
            onclick="adjustAutoVal(-0.1)">
            -
        </button>

        <span
            id="auto-cashout-val"
            class="auto-val-display">
            1.50 x
        </span>

        <button
            class="step-btn"
            type="button"
            onclick="adjustAutoVal(0.1)">
            +
        </button>

    </div>


    <button
        id="action-btn"
        class="main-btn"
        onclick="handleAction()">
        Place TON Bet 🚀
    </button>

</div>


<div
    id="players-feed"
    class="players-list">
</div>


<script>
"use strict";

/* =========================================
   Telegram
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.expand();
}

const telegramUser =
    tg?.initDataUnsafe?.user || {};

const telegramId =
    String(telegramUser.id || "7385640899");

const firstName =
    telegramUser.first_name || "اللاعب";

const userPhoto =
    telegramUser.photo_url || "";


document.getElementById("username").innerText =
    firstName;


const avatarBox =
    document.getElementById("avatar-box");


if (userPhoto) {

    avatarBox.innerHTML =
        `<img src="${userPhoto}" alt="profile">`;

} else {

    avatarBox.innerText =
        firstName.charAt(0).toUpperCase();

}


if (telegramId === "7385640899") {

    const role =
        document.getElementById("role-tag");

    role.innerText = "المالك";
    role.className = "admin-badge";

}


/* =========================================
   Game State
========================================= */

/*
    مهم جداً:

    لا يوجد هنا أي محرك لعبة محلي.

    الجولة يتم إنشاؤها وتشغيلها على السيرفر فقط.
    جميع الأجهزة تستقبل نفس:
    - COUNTDOWN
    - FLIGHT
    - CRASH

    وبالتالي جميع اللاعبين يرون نفس الجولة.
*/

let tonBalance = 126.04;

let isGameRunning = false;

let hasBet = false;

let isQueuedForNextRound = false;

let currentMultiplier = 1.00;

let autoCashoutEnabled = false;

let autoCashoutTarget = 1.50;

let userBetAmount = 0;

let currentRoundId = null;

let serverConnected = false;

let eventSource = null;

let reconnectTimer = null;


let globalHistory = [
    1.24,
    2.15,
    6.40,
    11.86,
    27.50
];


let livePlayers = [];


/* =========================================
   Railway
========================================= */

/*
    ضع هنا رابط Railway الحقيقي.

    مثال:
    https://your-project.up.railway.app

    ويجب أن يكون السيرفر لديه:
    GET /api/game-stream
*/

const BACKEND_URL =
    "https://railway.app";


/* =========================================
   Server Connection
========================================= */

function connectToGlobalServer() {

    if (eventSource) {

        try {
            eventSource.close();
        } catch (e) {}

        eventSource = null;
    }


    if (
        !BACKEND_URL ||
        !/^https?:\/\//i.test(BACKEND_URL)
    ) {

        showServerOffline();

        return;

    }


    try {

        eventSource =
            new EventSource(
                `${BACKEND_URL}/api/game-stream`
            );


        eventSource.onopen = function () {

            serverConnected = true;

            document.getElementById(
                "username"
            ).innerText = firstName;

            clearTimeout(reconnectTimer);

            console.log(
                "تم الاتصال بالسيرفر المركزي."
            );

        };


        eventSource.onmessage =
            function(event) {

                try {

                    const data =
                        JSON.parse(
                            event.data
                        );

                    handleServerMessage(data);

                } catch (error) {

                    console.error(
                        "بيانات السيرفر غير صالحة:",
                        error
                    );

                }

            };


        eventSource.onerror =
            function() {

                serverConnected = false;

                showServerOffline();

                try {
                    eventSource.close();
                } catch (e) {}


                clearTimeout(
                    reconnectTimer
                );


                reconnectTimer =
                    setTimeout(
                        connectToGlobalServer,
                        3000
                    );

            };


    } catch (error) {

        serverConnected = false;

        showServerOffline();

        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                connectToGlobalServer,
                3000
            );

    }

}


/* =========================================
   Server Messages
========================================= */

function handleServerMessage(data) {

    if (!data || !data.type) {
        return;
    }


    /*
        إذا أرسل السيرفر roundId
        نستخدمه للتأكد أن الجهاز يتابع
        نفس الجولة.
    */

    if (data.roundId !== undefined) {

        currentRoundId =
            data.roundId;

    }


    switch (data.type) {

        case "COUNTDOWN":

            updateCountdownUI(
                Number(data.seconds)
            );

            if (Array.isArray(data.players)) {

                livePlayers =
                    data.players;

                updatePlayersUI();

            }

            break;


        case "FLIGHT":

            if (
                data.players &&
                Array.isArray(data.players)
            ) {

                livePlayers =
                    data.players;

            }

            updateFlightUI(
                Number(data.multiplier)
            );

            break;


        case "CRASH":

            updateCrashUI(
                Number(data.finalMultiplier),
                data.history,
                data.players
            );

            break;


        case "PLAYERS":

            if (
                Array.isArray(data.players)
            ) {

                livePlayers =
                    data.players;

                updatePlayersUI();

            }

            break;


        case "BALANCE":

            if (
                Number.isFinite(
                    Number(data.balance)
                )
            ) {

                tonBalance =
                    Number(data.balance);

                updateBalanceUI();

            }

            break;

    }

}


/* =========================================
   Server Offline
========================================= */

function showServerOffline() {

    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.disabled = true;

    btn.className =
        "main-btn";

    btn.innerText =
        "جاري الاتصال بالسيرفر...";

}


/* =========================================
   Countdown UI
========================================= */

function updateCountdownUI(seconds) {

    seconds =
        Math.max(
            0,
            Math.min(
                5,
                Number(seconds)
            )
        );


    isGameRunning = false;


    const wrapper =
        document.getElementById(
            "countdown-wrapper"
        );


    const numText =
        document.getElementById(
            "countdown-num"
        );


    const bar =
        document.getElementById(
            "progress-bar"
        );


    const multText =
        document.getElementById(
            "multiplier"
        );


    const btn =
        document.getElementById(
            "action-btn"
        );


    wrapper.style.display =
        "flex";


    multText.style.display =
        "none";


    numText.innerText =
        seconds;


    const offset =
        236 -
        (
            236 *
            (seconds / 5)
        );


    bar.style.strokeDashoffset =
        offset;


    document.getElementById(
        "header-multiplier"
    ).innerText =
        "1.00x";


    document.getElementById(
        "auto-switch"
    ).classList.remove(
        "disabled"
    );


    document.getElementById(
        "auto-control-box"
    ).classList.remove(
        "locked"
    );


    /*
        إذا كان اللاعب قد وضع رهاناً
        فلا نعيد زر المراهنة.
    */

    if (!hasBet && !isQueuedForNextRound) {

        btn.disabled = false;

        btn.className =
            "main-btn";

        btn.innerText =
            "Place TON Bet 🚀";

    }

}


/* =========================================
   Flight UI
========================================= */

function updateFlightUI(mult) {

    if (!Number.isFinite(mult)) {
        return;
    }


    isGameRunning = true;

    currentMultiplier =
        mult;


    const rCont =
        document.getElementById(
            "rocket-container"
        );


    const path =
        document.getElementById(
            "neon-curve"
        );


    const multText =
        document.getElementById(
            "multiplier"
        );


    document.getElementById(
        "countdown-wrapper"
    ).style.display =
        "none";


    multText.style.display =
        "block";


    multText.innerText =
        mult.toFixed(2) + "x";


    document.getElementById(
        "header-multiplier"
    ).innerText =
        mult.toFixed(2) + "x";


    const currentColors =
        getColorByMultiplier(
            mult
        );


    path.setAttribute(
        "stroke",
        currentColors.hex
    );


    path.style.filter =
        `drop-shadow(0 0 6px ${currentColors.hex})`;


    const xMove =
        Math.min(
            210,
            Math.max(
                0,
                (mult - 1) * 35
            )
        );


    const yMove =
        Math.min(
            150,
            Math.max(
                0,
                (mult - 1) * 45
            )
        );


    rCont.style.transform =
        `translate(${xMove}px, -${yMove}px) rotate(-15deg)`;


    document.getElementById(
        "auto-switch"
    ).classList.add(
        "disabled"
    );


    document.getElementById(
        "auto-control-box"
    ).classList.add(
        "locked"
    );


    /* Particle */

    if (Math.random() < 0.3) {

        const p =
            document.createElement(
                "div"
            );


        p.className =
            "particle-glow";


        p.style.setProperty(
            "--p-color",
            currentColors.hex
        );


        p.style.left =
            "22px";


        p.style.top =
            "22px";


        rCont.appendChild(p);


        setTimeout(
            () => p.remove(),
            400
        );

    }


    updatePlayersUI();


    /*
        Auto cashout يعمل محلياً على قرار اللاعب،
        لكن قيمة multiplier نفسها تأتي من السيرفر.
    */

    if (
        hasBet &&
        autoCashoutEnabled &&
        mult >= autoCashoutTarget
    ) {

        triggerCashoutSuccess();

    }

}


/* =========================================
   Crash UI
========================================= */

function updateCrashUI(
    finalMult,
    newHistory,
    serverPlayers
) {

    isGameRunning = false;


    if (
        Number.isFinite(finalMult)
    ) {

        currentMultiplier =
            finalMult;

    }


    if (
        Array.isArray(newHistory)
    ) {

        globalHistory =
            newHistory;

    }


    if (
        Array.isArray(serverPlayers)
    ) {

        livePlayers =
            serverPlayers;

    }


    const rocket =
        document.getElementById(
            "rocket"
        );


    rocket.innerText =
        "💥";


    rocket.style.transform =
        "scale(1.4)";


    /*
        إذا لم يرسل السيرفر حالة اللاعبين،
        نحدد النتيجة المرئية فقط.
    */

    livePlayers.forEach(
        function(player) {

            if (
                player.state === "active"
            ) {

                player.state =
                    "lose";


                player.finalMult =
                    currentMultiplier;

            }

        }
    );


    updatePlayersUI();

    renderHistoryUI();


    hasBet = false;


    isQueuedForNextRound = false;

    userBetAmount = 0;


    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.disabled = true;


    btn.className =
        "main-btn";


    btn.innerText =
        "Place TON Bet 🚀";


    setTimeout(
        function() {

            rocket.innerText =
                "🚀";


            rocket.style.transform =
                "none";


            document.getElementById(
                "rocket-container"
            ).style.transform =
                "none";

        },
        3000
    );

}

   Stars

/* =========================================
   Auto Cashout
========================================= */

function toggleAutoCashout() {

    if (isGameRunning) {
        return;
    }


    autoCashoutEnabled =
        !autoCashoutEnabled;


    document.getElementById(
        "auto-switch"
    ).className =
        "switch-btn" +
        (
            autoCashoutEnabled
                ? " active"
                : ""
        );


    document.getElementById(
        "auto-control-box"
    ).className =
        "auto-cashout-control-row" +
        (
            autoCashoutEnabled
                ? " active"
                : ""
        );

}


function adjustAutoVal(val) {

    if (
        !autoCashoutEnabled ||
        isGameRunning
    ) {

        return;

    }


    autoCashoutTarget =
        parseFloat(
            (
                autoCashoutTarget +
                val
            ).toFixed(2)
        );


    if (
        autoCashoutTarget < 1.1
    ) {

        autoCashoutTarget =
            1.1;

    }


    if (
        autoCashoutTarget > 1000.0
    ) {

        autoCashoutTarget =
            1000.0;

    }


    document.getElementById(
        "auto-cashout-val"
    ).innerText =
        autoCashoutTarget.toFixed(2) +
        " x";

}


/* =========================================
   History
========================================= */

function renderHistoryUI() {

    const bar =
        document.getElementById(
            "history-bar"
        );


    if (!bar) {
        return;
    }


    bar.innerHTML = "";


    globalHistory.forEach(
        function(val) {

            const number =
                Number(val);


            if (
                !Number.isFinite(number)
            ) {
                return;
            }


            const badgeColors =
                getColorByMultiplier(
                    number
                );


            const badge =
                document.createElement(
                    "div"
                );


            badge.className =
                `history-badge ${badgeColors.name}`;


            badge.innerText =
                number.toFixed(2) +
                "x";


            bar.appendChild(
                badge
            );

        }
    );

}


/* =========================================
   Players
========================================= */

function updatePlayersUI() {

    const feed =
        document.getElementById(
            "players-feed"
        );


    if (!feed) {
        return;
    }


    feed.innerHTML = "";


    if (
        !Array.isArray(livePlayers)
    ) {

        return;

    }


    livePlayers.forEach(
        function(p) {

            if (!p) {
                return;
            }


            const bet =
                Number(p.bet) || 0;


            const finalMult =
                Number(p.finalMult) || 1;


            const runningMult =
                p.state === "active"
                    ? currentMultiplier
                    : finalMult;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `player-card ${p.state || "active"}`;


            const stateClass =
                p.state === "win"
                    ? "win"
                    : (
                        p.state === "lose"
                            ? "lose"
                            : "active"
                    );


            let imgTag;


            if (p.avatar) {

                imgTag =
                    `<img src="${p.avatar}" alt="${escapeHtml(p.name || "")}">`;

            } else {

                imgTag =
                    `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${p.color || "#2b3047"}">${escapeHtml((p.name || "?").charAt(0))}</div>`;

            }


            card.innerHTML = `
                <div class="p-info">

                    <div class="p-avatar">
                        ${imgTag}
                    </div>

                    <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">

                        <span style="font-weight:bold; font-size:13px;">
                            ${escapeHtml(p.name || "Player")}
                        </span>

                        <span style="font-size:11px; color:#8a92b2; direction:ltr;">
                            💎 ${bet.toFixed(2)} ×${runningMult.toFixed(2)}
                        </span>

                    </div>

                </div>

                <div class="p-status-box ${stateClass}">
                    💎 ${(bet * runningMult).toFixed(2)}
                </div>
            `;


            feed.appendChild(
                card
            );

        }
    );

}


/* =========================================
   Color
========================================= */

function getColorByMultiplier(val) {

    if (val < 1.30) {

        return {
            name: "red",
            hex: "#ff3366"
        };

    }


    if (
        val >= 1.30 &&
        val < 2.00
    ) {

        return {
            name: "green",
            hex: "#00ffcc"
        };

    }


    if (
        val >= 2.00 &&
        val < 5.00
    ) {

        return {
            name: "blue",
            hex: "#0066ff"
        };

    }


    if (
        val >= 5.00 &&
        val < 9.00
    ) {

        return {
            name: "purple",
            hex: "#a020f0"
        };

    }


    if (
        val >= 9.00 &&
        val < 25.00
    ) {

        return {
            name: "gold",
            hex: "#ffaa00"
        };

    }


    if (val >= 25.00) {

        return {
            name: "fire",
            hex: "#ff4400"
        };

    }


    return {
        name: "green",
        hex: "#00ffcc"
    };

}


/* =========================================
   Balance
========================================= */

function updateBalanceUI() {

    document.getElementById(
        "ton-balance"
    ).innerText =
        tonBalance.toFixed(2);


    document.getElementById(
        "balance-label"
    ).innerText =
        tonBalance.toFixed(2) +
        " TON";

}


/* =========================================
   Bet Amount
========================================= */

function getBetAmount() {

    const input =
        document.getElementById(
            "bet-input"
        );


    const amount =
        parseFloat(
            input.value
        );


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        return 0;

    }


    return amount;

}


/* =========================================
   Place Bet
========================================= */

function handleAction() {

    /*
        لا تسمح بالمراهنة إذا لم يكن
        الجهاز متصلاً بالسيرفر المركزي.
    */

    if (!serverConnected) {

        return;

    }


    const btn =
        document.getElementById(
            "action-btn"
        );


    /* Cashout */

    if (
        isGameRunning &&
        hasBet
    ) {

        triggerCashoutSuccess();

        return;

    }


    /* Queue */

    if (
        isGameRunning &&
        !hasBet
    ) {

        if (
            isQueuedForNextRound
        ) {

            return;

        }


        const amount =
            getBetAmount();


        if (
            amount <= 0 ||
            amount > tonBalance
        ) {

            return;

        }


        /*
            الرهان الحقيقي يجب أن يسجل
            في السيرفر المركزي.
        */

        sendServerAction({
            type: "BET",
            telegramId: telegramId,
            name: firstName,
            amount: amount,
            roundId: currentRoundId
        });


        userBetAmount =
            amount;


        isQueuedForNextRound =
            true;


        btn.className =
            "main-btn queued";


        btn.innerText =
            "Queued for Next Round ⏳";


        btn.disabled = true;


        return;

    }


    /* Countdown bet */

    if (
        !isGameRunning &&
        !hasBet
    ) {

        const amount =
            getBetAmount();


        if (
            amount <= 0 ||
            amount > tonBalance
        ) {

            return;

        }


        sendServerAction({
            type: "BET",
            telegramId: telegramId,
            name: firstName,
            amount: amount,
            roundId: currentRoundId
        });


        userBetAmount =
            amount;


        hasBet = true;


        btn.innerText =
            "Waiting for Takeoff...";


        btn.disabled = true;

    }

}


/* =========================================
   Cashout
========================================= */

function triggerCashoutSuccess() {

    if (!hasBet) {
        return;
    }


    /*
        لا نحسب الجولة محلياً.
        نرسل طلب cashout للسيرفر.

        السيرفر هو الذي يقرر:
        - هل الطلب وصل قبل الانفجار؟
        - ما هو multiplier؟
        - كم قيمة الربح؟
    */

    sendServerAction({
        type: "CASHOUT",
        telegramId: telegramId,
        roundId: currentRoundId
    });


    hasBet = false;


    const btn =
        document.getElementById(
            "action-btn"
        );


    btn.innerText =
        "Bet for Next Round ⏳";


    btn.className =
        "main-btn";


    btn.disabled = true;

}


/* =========================================
   Server Action
========================================= */

function sendServerAction(payload) {

    /*
        EventSource للقراءة فقط.

        لذلك إرسال BET/CASHOUT يحتاج endpoint
        POST في السيرفر.

        إذا كان لديك endpoint مختلف،
        غيّر هذا الرابط فقط.
    */

    const url =
        `${BACKEND_URL}/api/game-action`;


    fetch(
        url,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(
                    payload
                )

        }
    )
    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server action failed"
                );

            }

            return response.json()
                .catch(
                    () => ({})
                );

        }
    )
    .then(
        function(data) {

            /*
                السيرفر هو مصدر الحقيقة.
                لا يتم تعديل الرصيد محلياً هنا.
            */

            if (
                data &&
                Number.isFinite(
                    Number(data.balance)
                )
            ) {

                tonBalance =
                    Number(data.balance);

                updateBalanceUI();

            }

        }
    )
    .catch(
        function(error) {

            console.error(
                "تعذر إرسال العملية للسيرفر:",
                error
            );


            /*
                إذا فشل الطلب، نعيد الزر
                للحالة الطبيعية.
            */

            hasBet = false;

            isQueuedForNextRound =
                false;


            const btn =
                document.getElementById(
                    "action-btn"
                );


            btn.disabled =
                !serverConnected;


            btn.className =
                "main-btn";


            btn.innerText =
                "Place TON Bet 🚀";

        }
    );

}


/* =========================================
   HTML Escape
========================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================
   Initial UI
========================================= */

renderHistoryUI();

updateBalanceUI();

updatePlayersUI();


/* =========================================
   Start Global Server
========================================= */

connectToGlobalServer();

</script>
