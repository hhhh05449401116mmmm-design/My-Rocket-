<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Epic Gift Rocket Pro Ultra</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
        }

        .game-container {
            padding: 10px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(270px) translateX(-270px);
                opacity: 0;
            }
        }

        .rocket-wrapper {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;

            transform:
                translate(var(--rx, 0px), var(--ry, 0px))
                rotate(-15deg);

            transition: transform 0.08s linear;
        }

        .rocket-zone {
            font-size: 55px;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.6));
            position: relative;
        }

        .jet-trail {
            width: 6px;
            height: 0;
            background: linear-gradient(
                to bottom,
                #00ffcc,
                #0066ff,
                transparent
            );
            opacity: 0;
            margin-top: -5px;
            box-shadow: 0 0 10px #00ffcc;
            transform: rotate(15deg);
            transform-origin: top center;
            transition: opacity 0.1s;
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00ffcc;
            border-radius: 50%;
            opacity: 0.7;
            filter: blur(1px);
            animation: emitParticle 0.4s linear infinite;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.2);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 52px;
            font-weight: bold;
            color: #fff;
            z-index: 3;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .tab-row {
            display: flex;
            background: #0c0d14;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            background: #a020f0;
            color: #fff;
            text-align: center;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
        }

        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.04);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.02);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .p-status-box {
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .p-status-box.active {
            background: rgba(0,102,255,0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0,255,204,0.15);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255,51,102,0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="profile-zone">

            <div id="avatar-box" class="avatar-container">
                ⚙️
            </div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">

                <span id="username"
                      style="font-weight:bold; font-size:13px;">
                    جاري التحميل...
                </span>

                <span id="role-tag"
                      class="admin-badge"
                      style="background:#0066ff;">
                    لاعب
                </span>

            </div>

        </div>

        <div class="balances-wrapper">

            <div class="balance-box ton">

                <i class="fas fa-wallet"
                   style="margin-right:4px;"></i>

                <span id="ton-balance">
                    126.14
                </span>

                TON

            </div>

        </div>

    </div>


    <div class="game-container">

        <div id="space-bg"
             class="space-bg">
        </div>


        <div id="rocket-container"
             class="rocket-wrapper">

            <div id="rocket"
                 class="rocket-zone">
                🚀
            </div>

            <div id="trail"
                 class="jet-trail">
            </div>

        </div>


        <div id="multiplier"
             class="multiplier"
             style="display:none;">
            1.00x
        </div>


        <!-- العداد الدائري -->

        <div id="countdown-wrapper"
             class="countdown-container">

            <svg class="countdown-svg"
                 viewBox="0 0 80 80">

                <circle
                    class="bg-circle"
                    cx="40"
                    cy="40"
                    r="37.5">
                </circle>

                <circle
                    id="progress-bar"
                    class="bar-circle"
                    cx="40"
                    cy="40"
                    r="37.5">
                </circle>

            </svg>

            <div id="countdown-num"
                 class="countdown-number">
                5
            </div>

        </div>

    </div>


    <!-- التاريخ -->

    <div id="history-bar"
         class="history-row">

        <div class="history-badge green">
            52.80x
        </div>

        <div class="history-badge green">
            1.78x
        </div>

        <div class="history-badge red">
            1.13x
        </div>

        <div class="history-badge green">
            1.43x
        </div>

        <div class="history-badge green">
            13.8x
        </div>

    </div>


    <!-- لوحة الرهان -->

    <div class="bet-panel">

        <div class="tab-row">

            <button class="tab-btn">
                TON
            </button>

        </div>


        <div class="info-row">

            <span id="balance-label">
                126.14 TON
            </span>

            <span>
                Available Balance
            </span>

        </div>


        <div class="info-row"
             style="margin-top:-6px;">

            <span style="color:#8a92b2;">
                Bet Amount
            </span>

        </div>


        <div class="input-box-wrapper">

            <i class="fas fa-wallet"
               style="color:#0088cc;">
            </i>

            <input
                id="bet-input"
                type="number"
                class="amount-input"
                value="0.10"
                step="0.05"
                min="0.10"
            >

        </div>


        <!-- Auto Cashout -->

        <div class="switch-row">

            <span>
                Auto cashout
            </span>

            <div id="auto-switch"
                 class="switch-btn"
                 onclick="toggleAutoCashout()">

                <div class="switch-circle"></div>

            </div>

        </div>


        <!-- قيمة السحب التلقائي -->

        <div id="auto-control-box"
             class="auto-cashout-control-row">

            <button class="step-btn"
                    onclick="adjustAutoVal(-0.10)">
                −
            </button>

            <div id="auto-cashout-val"
                 class="auto-val-display">
                1.50x
            </div>

            <button class="step-btn"
                    onclick="adjustAutoVal(0.10)">
                +
            </button>

        </div>


        <!-- زر اللعب -->

        <button id="action-btn"
                class="main-btn"
                onclick="handleAction()">
            Place TON Bet 🚀
        </button>

    </div>


    <!-- اللاعبين -->

    <div id="players-feed"
         class="players-list">
    </div>


    <script>

        /* ==============================
           TELEGRAM
        ============================== */

        const tg = window.Telegram?.WebApp || null;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        const telegramId = String(
            tg?.initDataUnsafe?.user?.id || "7385640899"
        );


        const firstName =
            tg?.initDataUnsafe?.user?.first_name || "المطور";


        const userPhoto =
            tg?.initDataUnsafe?.user?.photo_url;


        document.getElementById("username").innerText =
            firstName;


        const avatarBox =
            document.getElementById("avatar-box");


        if (userPhoto) {

            const img =
                document.createElement("img");

            img.src = userPhoto;
            img.alt = firstName;

            avatarBox.innerHTML = "";

            avatarBox.appendChild(img);

        } else {

            avatarBox.innerText =
                firstName.charAt(0).toUpperCase();

        }


        /* ==============================
           OWNER
        ============================== */

        if (telegramId === "7385640899") {

            const role =
                document.getElementById("role-tag");

            role.innerText = "المالك";

            role.style.background =
                "#ff3366";

        }


        /* ==============================
           VARIABLES
        ============================== */

        let tonBalance = 126.14;

        let isGameRunning = false;

        let hasBet = false;

        let currentMultiplier = 1.00;

        let loopInterval = null;

        let autoCashoutEnabled = false;

        let autoCashoutTarget = 1.50;


        /* ==============================
           PLAYERS
        ============================== */

        let livePlayers = [

            {
                name: "Sasha",
                bet: "0.10",
                color: "#e066ff",
                state: "active"
            },

            {
                name: "Spay",
                bet: "0.50",
                color: "#00ffcc",
                state: "active"
            }

        ];


        /* ==============================
           STARS
        ============================== */

        const bg =
            document.getElementById("space-bg");


        const colors = [
            "#fff",
            "#00ffcc",
            "#0066ff",
            "#ffaa00",
            "#ff3366"
        ];


        for (let i = 0; i < 35; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.background =
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ];

            star.style.animationDuration =
                (Math.random() * 1.5 + 0.8) + "s";

            bg.appendChild(star);

        }


        /* ==============================
           AUTO CASHOUT TOGGLE
        ============================== */

        function toggleAutoCashout() {

            autoCashoutEnabled =
                !autoCashoutEnabled;


            document.getElementById("auto-switch")
                .className =
                "switch-btn" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );


            document.getElementById("auto-control-box")
                .className =
                "auto-cashout-control-row" +
                (
                    autoCashoutEnabled
                        ? " active"
                        : ""
                );

        }


        /* ==============================
           AUTO CASHOUT VALUE
        ============================== */

        function adjustAutoVal(val) {

            if (!autoCashoutEnabled) {
                return;
            }


            autoCashoutTarget =
                parseFloat(
                    (
                        autoCashoutTarget + val
                    ).toFixed(2)
                );


            if (autoCashoutTarget < 1.10) {
                autoCashoutTarget = 1.10;
            }


            if (autoCashoutTarget > 1000.00) {
                autoCashoutTarget = 1000.00;
            }


            document.getElementById(
                "auto-cashout-val"
            ).innerText =
                autoCashoutTarget.toFixed(2) + "x";

        }


        /* ==============================
           PLAYERS UI
        ============================== */

        function updatePlayersUI() {

            const feed =
                document.getElementById(
                    "players-feed"
                );


            feed.innerHTML = "";


            livePlayers.forEach(p => {

                const card =
                    document.createElement("div");


                card.className =
                    `player-card ${p.state}`;


                const stateClass =
                    p.state === "active"
                        ? "active"
                        : (
                            p.state === "win"
                                ? "win"
                                : "lose"
                        );


                card.innerHTML = `

                    <div class="p-info">

                        <div
                            class="p-avatar"
                            style="background:${p.color}"
                        >
                            ${p.name.charAt(0)}
                        </div>

                        <div
                            style="
                                display:flex;
                                flex-direction:column;
                                align-items:flex-start;
                                gap:2px;
                            "
                        >

                            <span
                                style="
                                    font-weight:bold;
                                    font-size:13px;
                                "
                            >
                                ${p.name}
                            </span>

                            <span
                                style="
                                    font-size:11px;
                                    color:#8a92b2;
                                    direction:ltr;
                                "
                            >
                                💎 ${p.bet} ×1.00
                            </span>

                        </div>

                    </div>

                    <div
                        class="p-status-box ${stateClass}"
                    >
                        💎 ${p.bet}
                    </div>

                `;


                feed.appendChild(card);

            });

        }


        /* ==============================
           GLOBAL LOOP
        ============================== */

        function runGlobalLoop() {

            let count = 5;


            const wrapper =
                document.getElementById(
                    "countdown-wrapper"
                );


            const numText =
                document.getElementById(
                    "countdown-num"
                );


            const bar =
                document.getElementById(
                    "progress-bar"
                );


            const multText =
                document.getElementById(
                    "multiplier"
                );


            const btn =
                document.getElementById(
                    "action-btn"
                );


            isGameRunning = false;


            multText.style.display =
                "none";


            wrapper.style.display =
                "flex";


            livePlayers.forEach(p => {
                p.state = "active";
            });


            updatePlayersUI();


            if (!hasBet) {

                btn.disabled = false;

                btn.className =
                    "main-btn";

                btn.innerText =
                    "Place TON Bet 🚀";

            }


            bar.style.strokeDashoffset = 0;


            function timer() {

                if (count > 0) {

                    numText.innerText =
                        count;


                    const offset =
                        236 -
                        (
                            236 *
                            (
                                count / 5
                            )
                        );


                    bar.style.strokeDashoffset =
                        offset;


                    count--;


                    setTimeout(
                        timer,
                        1000
                    );

                } else {

                    wrapper.style.display =
                        "none";


                    multText.style.display =
                        "block";


                    startRocketFlight();

                }

            }


            timer();

        }


        /* ==============================
           ROCKET FLIGHT
        ============================== */

        function startRocketFlight() {

            isGameRunning = true;

            currentMultiplier = 1.00;


            const rCont =
                document.getElementById(
                    "rocket-container"
                );


            const rocket =
                document.getElementById(
                    "rocket"
                );


            const trail =
                document.getElementById(
                    "trail"
                );


            const multText =
                document.getElementById(
                    "multiplier"
                );


            const btn =
                document.getElementById(
                    "action-btn"
                );


            trail.style.opacity =
                "1";


            if (hasBet) {

                btn.innerText =
                    "Cash Out 💰";

                btn.className =
                    "main-btn cashout";

                btn.disabled =
                    false;

            } else {

                btn.disabled =
                    true;

                btn.innerText =
                    "Round in progress...";

            }


            /* نقطة الانفجار */

            let crashPoint =
                Math.min(
                    370.00,
                    (
                        Math.random() * 6 +
                        1.01
                    )
                );


            if (Math.random() < 0.05) {

                crashPoint =
                    Math.random() * 300 + 50;

            }


            clearInterval(loopInterval);


            loopInterval =
                setInterval(() => {

                    /* زيادة المضاعف */

                    currentMultiplier +=
                        currentMultiplier < 10
                            ? 0.03
                            : (
                                currentMultiplier < 100
                                    ? 0.5
                                    : 2.5
                            );


                    multText.innerText =
                        currentMultiplier.toFixed(2) +
                        "x";


                    /* حركة الصاروخ */

                    const xMove =
                        Math.min(
                            210,
                            (
                                currentMultiplier - 1
                            ) * 95
                        );


                    let yMove = 0;


                    if (currentMultiplier <= 1.30) {

                        yMove =
                            (
                                currentMultiplier - 1
                            ) * 20;

                    } else {

                        yMove =
                            6 +
                            (
                                currentMultiplier - 1.30
                            ) * 125;

                    }


                    const finalX =
                        Math.min(
                            195,
                            xMove
                        );


                    const finalY =
                        Math.min(
                            145,
                            yMove
                        );


                    rCont.style.setProperty(
                        "--rx",
                        `${finalX}px`
                    );


                    rCont.style.setProperty(
                        "--ry",
                        `-${finalY}px`
                    );


                    /* اللهب */

                    trail.style.height =
                        `${Math.min(
                            30,
                            (
                                currentMultiplier - 1
                            ) * 35
                        )}px`;


                    /* الجزيئات */

                    if (Math.random() < 0.4) {

                        const p =
                            document.createElement(
                                "div"
                            );


                        p.className =
                            "particle-glow";


                        p.style.left =
                            "20px";


                        p.style.top =
                            "40px";


                        rCont.appendChild(p);


                        setTimeout(() => {

                            p.remove();

                        }, 400);

                    }


                    /* اللاعبين */

                    livePlayers.forEach(p => {

                        if (
                            p.state === "active" &&
                            Math.random() < 0.02 &&
                            currentMultiplier > 1.20
                        ) {

                            p.state =
                                "win";

                            updatePlayersUI();

                        }

                    });


                    /* Auto Cashout */

                    if (
                        hasBet &&
                        autoCashoutEnabled &&
                        currentMultiplier >=
                            autoCashoutTarget
                    ) {

                        clearInterval(
                            loopInterval
                        );


                        triggerCashoutSuccess();

                        return;

                    }


                    /* الانفجار */

                    if (
                        currentMultiplier >=
                        crashPoint
                    ) {

                        clearInterval(
                            loopInterval
                        );


                        triggerRocketCrash();

                    }

                }, 65);

        }


        /* ==============================
           CRASH
        ============================== */

        function triggerRocketCrash() {

            isGameRunning = false;

            hasBet = false;


            document.getElementById(
                "trail"
            ).style.opacity = "0";


            document.getElementById(
                "rocket"
            ).innerText = "💥";


            const historyBar =
                document.getElementById(
                    "history-bar"
                );


            const badgeClass =
                currentMultiplier < 1.30
                    ? "red"
                    : "green";


            historyBar.innerHTML = `

                <div class="history-badge ${badgeClass}">
                    ${currentMultiplier.toFixed(2)}x
                </div>

            ` + historyBar.innerHTML;


            livePlayers.forEach(p => {

                if (p.state === "active") {
                    p.state = "lose";
                }

            });


            updatePlayersUI();


            setTimeout(() => {

                const rCont =
                    document.getElementById(
                        "rocket-container"
                    );


                document.getElementById(
                    "rocket"
                ).innerText = "🚀";


                rCont.style.transform =
                    "translate(0, 0) rotate(-15deg)";


                rCont.style.setProperty(
                    "--rx",
                    "0px"
                );


                rCont.style.setProperty(
                    "--ry",
                    "0px"
                );


                runGlobalLoop();

            }, 3500);

        }


        /* ==============================
           ACTION
        ============================== */

        function handleAction() {

            if (
                !isGameRunning &&
                !hasBet
            ) {

                const input =
                    document.getElementById(
                        "bet-input"
                    );


                const amt =
                    parseFloat(
                        input.value
                    );


                if (
                    !Number.isFinite(amt) ||
                    amt <= 0
                ) {

                    return;

                }


                if (amt > tonBalance) {

                    return;

                }


                hasBet = true;


                tonBalance -= amt;


                document.getElementById(
                    "ton-balance"
                ).innerText =
                    tonBalance.toFixed(2);


                document.getElementById(
                    "balance-label"
                ).innerText =
                    tonBalance.toFixed(2) +
                    " TON";


                document.getElementById(
                    "action-btn"
                ).innerText =
                    "Waiting for next round...";


                document.getElementById(
                    "action-btn"
                ).disabled = true;


                return;

            }


            if (
                isGameRunning &&
                hasBet
            ) {

                clearInterval(
                    loopInterval
                );


                triggerCashoutSuccess();

            }

        }


        /* ==============================
           CASH OUT
        ============================== */

        function triggerCashoutSuccess() {

            if (!hasBet) {
                return;
            }


            hasBet = false;


            const amt =
                parseFloat(
                    document.getElementById(
                        "bet-input"
                    ).value
                );


            const winAmt =
                amt *
                currentMultiplier;


            tonBalance +=
                winAmt;


            document.getElementById(
                "ton-balance"
            ).innerText =
                tonBalance.toFixed(2);


            document.getElementById(
                "balance-label"
            ).innerText =
                tonBalance.toFixed(2) +
                " TON";


            document.getElementById(
                "action-btn"
            ).innerText =
                "Cashed Out! 🎉";


            document.getElementById(
                "action-btn"
            ).disabled = true;


            /*
             * لا نستدعي triggerRocketCrash هنا
             * حتى لا يتحول السحب الناجح إلى انفجار.
             */

            isGameRunning = true;

            document.getElementById(
                "trail"
            ).style.opacity = "1";

        }


        /* ==============================
           START
        ============================== */

        updatePlayersUI();

        runGlobalLoop();

    </script>

</body>
</html>
