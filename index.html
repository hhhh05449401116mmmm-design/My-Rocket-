<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>🚀 Rocket Ice - Premium</title>
    <meta name="theme-color" content="#0a1628">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        /* (نفس الـ CSS السابق لكن مع تعديلات الـ Countdown و Multiplier) */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #0a0e1a; color: #fff; font-family: Arial, sans-serif; overflow-x: hidden; }
        
        .app { width: 100%; max-width: 520px; min-height: 100vh; margin: 0 auto; padding-bottom: 100px; position: relative; z-index: 2; }
        
        /* ... (باقي الـ CSS القديم كما هو بدون تغيير) ... */

        /* تعديل لعمل عداد دائري كبير */
        .countdown-container {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 160px;
            z-index: 6;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .countdown-container.show { opacity: 1; }
        .countdown-circle { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 8px solid rgba(79, 195, 247, 0.1); }
        .countdown-progress { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 8px solid transparent; border-top-color: #4de18a; border-right-color: #4de18a; transform: rotate(-45deg); transition: transform 0.5s linear; }
        .countdown-inner { position: relative; z-index: 2; text-align: center; }
        .countdown-num { font-size: 60px; font-weight: 900; color: #fff; line-height: 1; }
        .countdown-txt { font-size: 12px; color: #4fc3f7; font-weight: 700; margin-top: 4px; }
    </style>
</head>
<body>
    <!-- (باقي الـ HTML كما هو مع إضافة عنصر الـ Countdown فقط) -->
    <div class="app">
        <!-- ... -->
        <div id="rocket-game" class="rocket-game-container hidden">
            <!-- ... -->
            <section class="game-card">
                <div class="stars"></div>
                <!-- العداد الدائري -->
                <div id="countdown-container" class="countdown-container">
                    <div class="countdown-circle"></div>
                    <div id="countdown-progress" class="countdown-progress"></div>
                    <div class="countdown-inner">
                        <div id="countdown" class="countdown-num">5</div>
                        <div id="countdown-txt" class="countdown-txt">Seconds</div>
                    </div>
                </div>
                <div id="multiplier" class="multiplier waiting">1.00x</div>
                <!-- ... -->
            </section>
            <!-- ... -->
        </div>
    </div>

    <script>
        /* =========================================================
           1. BACKEND URL
        ========================================================= */
        const BACKEND_URL = "https://my-rocket-production.up.railway.app";

        /* =========================================================
           2. TELEGRAM INIT
        ========================================================= */
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }
        const telegramUser = tg?.initDataUnsafe?.user || {};
        const telegramId = String(telegramUser.id || "guest");
        const firstName = telegramUser.first_name || "اللاعب";
        const fullName = `${firstName} ${telegramUser.last_name || ""}`.trim();
        const userPhoto = telegramUser.photo_url || "";

        /* =========================================================
           3. GAME VARIABLES
        ========================================================= */
        let authToken = null;
        let hasBet = false;
        let playedThisRound = false;
        let isQueuedForNextRound = false;
        let tonBalance = 0;
        let userTurnover = 0;
        let currentBetId = null;
        let userGifts = [];

        /* =========================================================
           4. SMOOTH ANIMATION VARIABLES (الأهم هنا!)
        ========================================================= */
        let currentMultiplier = 1.00; // القيمة الحالية من السيرفر
        let displayMultiplier = 1.00; // القيمة المعروضة للاعب
        let gamePhase = "COUNTDOWN"; // COUNTDOWN, FLIGHT, CRASH
        let countdownSeconds = 5;
        let globalHistory = [];
        let livePlayers = [];

        // عداد الدائرة
        let countdownDuration = 5 * 1000;
        let countdownStartTime = 0;

        /* =========================================================
           5. AUTH
        ========================================================= */
        async function authenticateUser() {
            try {
                const initData = window.Telegram?.WebApp?.initData || '';
                const response = await fetch(`${BACKEND_URL}/api/auth`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await response.json();
                if (data.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    await fetchBalance();
                }
            } catch (error) { console.error('Auth error:', error); }
        }

        function getAuthHeaders() {
            const token = authToken || localStorage.getItem('authToken');
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        async function fetchBalance() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/balance`, { headers: getAuthHeaders() });
                const data = await response.json();
                if (data.ok) { tonBalance = data.balance; updateTonWalletUI(); }
            } catch (error) {}
        }

        /* =========================================================
           6. ANIMATION LOOP (يجعل الرقم يتحرك مثل عداد الثواني!)
        ========================================================= */
        function animateGameLoop() {
            if (gamePhase === "FLIGHT") {
                // إذا كان الرقم المعروض أقل من الرقم الحقيقي، قم بتقريبه تدريجياً وبشكل سلس
                if (displayMultiplier < currentMultiplier) {
                    // نضيف جزءاً من الفرق، فلا يقفز مباشرة بل يصعد بسلاسة
                    displayMultiplier += (currentMultiplier - displayMultiplier) * 0.08; 
                    
                    // لضمان أنه لا يتوقف حتى لو تأخر السيرفر، نضيف نسبة نمو طفيفة
                    displayMultiplier += 0.001;

                    const multEl = document.getElementById("multiplier");
                    if (multEl) multEl.textContent = displayMultiplier.toFixed(2) + "x";

                    // تحريك الصاروخ بسلاسة بناءً على الرقم المعروض
                    const progress = Math.min(Math.max((displayMultiplier - 1) / 8, 0), 1);
                    moveRocket(progress);
                }
            } else if (gamePhase === "COUNTDOWN") {
                // حساب وقت العداد
                const now = Date.now();
                const elapsed = now - countdownStartTime;
                if (elapsed < countdownDuration) {
                    const remainingSec = Math.ceil((countdownDuration - elapsed) / 1000);
                    document.getElementById("countdown").textContent = remainingSec;
                    
                    // تحديث الدائرة لتفرغ
                    const rotation = (elapsed / countdownDuration) * 360;
                    document.getElementById("countdown-progress").style.transform = `rotate(${rotation - 45}deg)`;
                } else {
                    gamePhase = "FLIGHT";
                    displayMultiplier = 1.00;
                    document.getElementById("countdown-container").classList.remove("show");
                    document.getElementById("multiplier").classList.add("flying");
                }
            }
            requestAnimationFrame(animateGameLoop);
        }

        function moveRocket(progress) {
            const rocket = document.getElementById("rocket");
            const flame = document.getElementById("flame");
            const trail = document.getElementById("rocket-trail");
            if(!rocket) return;
            
            rocket.style.left = `${15 + progress * 58}%`;
            rocket.style.bottom = `${74 + progress * 120}px`;
            rocket.style.transform = `rotate(${-12 - progress * 15}deg)`;

            if (flame) flame.style.display = "block";
            if (trail) trail.classList.add("active");
        }

        /* =========================================================
           7. SERVER POLLING (بديل الـ SSE للثبات!)
        ========================================================= */
        async function fetchGameState() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/game/state`, { headers: getAuthHeaders() });
                const data = await response.json();
                if (data.ok) {
                    const state = data.state;

                    // تحديث المضاعف الهدف
                    currentMultiplier = state.multiplier;

                    // إذا كانت الجولة "طيران"
                    if (state.phase === "FLIGHT") {
                        if (gamePhase !== "FLIGHT") {
                            displayMultiplier = 1.00; // ابدأ من 1.00
                            document.getElementById("countdown-container").classList.remove("show");
                            document.getElementById("multiplier").classList.remove("waiting");
                            document.getElementById("multiplier").classList.add("flying");
                        }
                        document.getElementById("multiplier").classList.remove("crashed");
                        document.getElementById("rocket").classList.remove("crashed");
                    }

                    // إذا كانت الجولة "عد تنازلي"
                    if (state.phase === "COUNTDOWN") {
                        if (gamePhase !== "COUNTDOWN") {
                            countdownStartTime = Date.now();
                            countdownDuration = state.seconds * 1000;
                            document.getElementById("countdown-container").classList.add("show");
                            document.getElementById("multiplier").classList.remove("flying");
                            document.getElementById("multiplier").classList.remove("crashed");
                        }
                        document.getElementById("countdown-txt").textContent = "Seconds";
                    }

                    // إذا انفجرت
                    if (state.phase === "CRASH") {
                        gamePhase = "CRASH";
                        document.getElementById("multiplier").classList.remove("flying");
                        document.getElementById("multiplier").classList.add("crashed");
                        document.getElementById("multiplier").textContent = currentMultiplier.toFixed(2) + "x";
                        
                        document.getElementById("rocket").classList.add("crashed");
                        document.getElementById("flame").style.display = "none";
                        document.getElementById("countdown-container").classList.remove("show");
                    }

                    gamePhase = state.phase;
                    globalHistory = state.history || [];
                    renderHistory();
                    updateMainBetButton();
                }
            } catch (error) {
                console.error('Game state error:', error);
            }
        }

        function connectToServer() {
            // إلغاء أي اتصال سابق
            if (window.gameInterval) clearInterval(window.gameInterval);

            // جلب الحالة أول مرة
            fetchGameState();
            
            // التحديث كل ثانية (السيرفر يرسل تحديثات جديدة كل ثانية)
            window.gameInterval = setInterval(fetchGameState, 1000);

            // بدء حركة الرسوم المتحركة (الأنيميشن)
            requestAnimationFrame(animateGameLoop);
        }

        /* =========================================================
           8. HISTORY
        ========================================================= */
        function renderHistory() {
            const container = document.getElementById("history");
            if (!container) return;
            container.innerHTML = "";
            globalHistory.slice(0, 10).forEach(function(value) {
                const item = document.createElement("div");
                const n = Number(value);
                let cls = "history-item";
                if (n < 1.3) cls += " red";
                else if (n < 2) cls += " green";
                else if (n < 5) cls += " blue";
                else if (n < 9) cls += " purple";
                else if (n < 25) cls += " gold";
                else cls += " fire";
                item.className = cls;
                item.textContent = n.toFixed(2) + "x";
                container.appendChild(item);
            });
        }

        /* =========================================================
           9. BET FUNCTIONS
        ========================================================= */
        function updateMainBetButton() {
            const button = document.getElementById("main-bet-button");
            if (!button) return;
            button.className = "place-bet-main";
            button.disabled = false;

            if (hasBet && gamePhase === "FLIGHT") {
                button.classList.add("cashout-main");
                button.textContent = "CASH OUT";
            } else if (hasBet) {
                button.classList.add("wait-main");
                button.textContent = "BET ACTIVE";
                button.disabled = true;
            } else if (isQueuedForNextRound) {
                button.classList.add("queued-main");
                button.textContent = "BET QUEUED";
                button.disabled = true;
            } else {
                button.textContent = "Place bet";
            }
        }

        async function handleBet(amount) {
            if (gamePhase !== "COUNTDOWN" || actionInProgress) return;
            actionInProgress = true;
            updateMainBetButton();
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/bet/ton`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ amount: amount })
                });
                const data = await response.json();
                if (data.ok) {
                    hasBet = true; playedThisRound = true; currentBetId = data.bet.betId;
                    closeModal('bet-modal');
                    updateMainBetButton();
                } else {
                    showToast(data.error || 'Bet Failed');
                }
            } catch (error) {}
            
            actionInProgress = false;
            updateMainBetButton();
        }

        async function handleCashout() {
            if (!hasBet || gamePhase !== "FLIGHT") return;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/cashout/ton`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ betId: currentBetId })
                });
                const data = await response.json();
                if (data.ok) {
                    hasBet = false; currentBetId = null;
                    showToast('💰 ' + data.payout.toFixed(2) + ' TON');
                    updateMainBetButton();
                    await fetchBalance();
                }
            } catch (error) {}
        }

        let actionInProgress = false;
        function handleMainBetButton() {
            if (hasBet && gamePhase === "FLIGHT") { handleCashout(); return; }
            if (gamePhase === "COUNTDOWN" && !hasBet) {
                openBetModal();
            }
        }

        /* =========================================================
           10. MODALS
        ========================================================= */
        function openBetModal() {
            const modal = document.getElementById("bet-modal");
            if (modal) modal.classList.add("show");
        }
        
        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove("show");
        }
        
        function handleModalBet() {
            const amount = Number(document.getElementById("modal-amount-input").value);
            if (!amount || amount > tonBalance) { showToast("المبلغ غير صالح"); return; }
            handleBet(amount);
        }

        /* =========================================================
           11. UI UPDATE
        ========================================================= */
        function updateTonWalletUI() {
            const box = document.getElementById("ton-wallet-box");
            if (box) box.innerHTML = `<span id="ton-balance">${Number(tonBalance).toFixed(2)}</span> TON`;
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2500);
        }

        /* =========================================================
           12. INIT
        ========================================================= */
        document.addEventListener("DOMContentLoaded", async function() {
            // إعداد الصورة والاسم
            const avatar = document.getElementById("user-avatar");
            if (userPhoto) avatar.src = userPhoto;
            else avatar.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="#182137"/><text x="50" y="58" text-anchor="middle" fill="#fff" font-size="42">${firstName.charAt(0)}</text></svg>`);
            document.getElementById("profile-name").textContent = fullName;

            await authenticateUser();

            document.getElementById("game-hub").classList.remove("hidden");
            connectToServer();
        });
    </script>
</body>
</html>
