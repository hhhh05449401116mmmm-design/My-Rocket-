<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Cash</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #0b0c11; color: #fff; margin: 0; padding: 12px; overflow: hidden; user-select: none; }
        #history-bar { display: flex; gap: 6px; padding: 5px 0; overflow-x: auto; }
        .h-item { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid #4e9f3d; color: #4e9f3d; }
        #container { position: relative; width: 100%; height: 35vh; background: #0e121a; border-radius: 20px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: 800; }
        #count-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; font-weight: 900; display: none; }
        #btn { background: #0066ff; color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 14px; cursor: pointer; width: 100%; margin: 10px 0; }
        #btn.betting { background: #e94560; }
        #p-list { display: flex; flex-direction: column; gap: 6px; max-height: 35vh; overflow-y: auto; }
        .p-row { display: flex; justify-content: space-between; background: #131722; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
        .p-blue { color: #0066ff; font-size: 11px; }
    </style>
</head>
<body>
    <div id="history-bar"></div>
    <div id="container">
        <div id="mult">1.00x</div>
        <div id="count-box">5</div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <button id="btn" onclick="handleAction()">Place bet</button>
    <div id="p-list"></div>

    <script>
        if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}
        const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
        const mult=document.getElementById('mult'), btn=document.getElementById('btn'), hBar=document.getElementById('history-bar'), pList=document.getElementById('p-list'), cBox=document.getElementById('count-box');
        canvas.width=canvas.parentElement.clientWidth; canvas.height=canvas.parentElement.clientHeight;
        
        let state='COUNTDOWN', value=1.00, crash=1.00, loop, path=[], rx=40, ry=canvas.height-40, timer=5, countAngle=0;
        let historyList=['1.01x', '1.13x', '1.91x', '1.43x', '13.8x'], stars=[];
        const players=[{n:'Sasha',b:0.10},{n:'Spay',b:0.50},{n:'يوسف',b:0.24},{n:'Bpex',b:0.10}];

        for(let i=0; i<25; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*1.5, sp:Math.random()*1});

        function updateUI(active, crashed) {
            hBar.innerHTML=''; historyList.slice(-6).reverse().forEach(v=>{ const d=document.createElement('div'); d.className='h-item'; d.innerText=v; hBar.appendChild(d); });
            pList.innerHTML=''; players.forEach(p=>{
                const r=document.createElement('div'); r.className='p-row';
                r.innerHTML=`<div><b>${p.n}</b><br><span class="p-blue">🔹 ${p.b} ×1.00</span></div><div><b>🔹 ${p.b}</b></div>`;
                pList.appendChild(r);
            });
        }

        function startCount() {
            state='COUNTDOWN'; timer=5; countAngle=0; cBox.style.display='block'; mult.style.display='none';
            btn.innerText='Place bet'; btn.className=''; cBox.innerText=timer;
            let inter=setInterval(()=>{
                timer--; cBox.innerText=timer;
                if(timer<=0){ clearInterval(inter); cBox.style.display='none'; mult.style.display='block'; state='FLYING'; value=1.00; path=[]; btn.innerText='Cash Out'; btn.className='betting'; crash=Math.random()*10+1.05; if(crash>150)crash=150; }
            }, 1000);
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff';
            stars.forEach(s=>{ ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill(); if(state==='FLYING'){s.x-=s.sp*2;s.y+=s.sp*2;}else{s.x-=s.sp*0.2;s.y+=s.sp*0.2;} if(s.x<0)s.x=canvas.width; if(s.y>canvas.height)s.y=0; });
            if(state==='COUNTDOWN'){ countAngle+=(Math.PI*2)/(5*60); ctx.beginPath(); ctx.arc(canvas.width/2,canvas.height/2,50,-Math.PI/2,(Math.PI*2-countAngle)-Math.PI/2,false); ctx.strokeStyle='#ff7a00'; ctx.lineWidth=4; ctx.stroke(); }
            if(path.length>1){ ctx.beginPath(); ctx.moveTo(path.x,path.y); for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y); ctx.strokeStyle='#0066ff'; ctx.lineWidth=3; ctx.stroke(); }
            if(state==='FLYING'){
                value+=0.003; mult.innerText=value.toFixed(2)+'x'; // عداد بطيء وسلس
                let p=(value-1)/5; if(p>0.8)p=0.8; rx=40+(canvas.width-80)*p; ry=(canvas.height-40)-(canvas.height-90)*Math.sin(p*Math.PI/2); path.push({x:rx,y:ry});
                ctx.save(); ctx.translate(rx,ry); ctx.rotate(-Math.PI/4); ctx.fillStyle='#f0f2f5'; ctx.beginPath(); ctx.moveTo(0,-15); ctx.lineTo(6,4); ctx.lineTo(-6,4); ctx.closePath(); ctx.fill(); ctx.restore();
                if(value>=crash) end(false);
            } else if(state==='CRASHED'){ ctx.font='35px Arial'; ctx.fillText('💥',rx,ry); }
            loop=requestAnimationFrame(draw);
        }

        function handleAction(){ if(state==='FLYING') end(true); else startCount(); }
        function end(w){
            cancelAnimationFrame(loop);
            if(w){ state='IDLE'; mult.innerText='🎉 '+value.toFixed(2)+'x'; historyList.push(value.toFixed(2)+'x'); setTimeout(startCount,2000); }
            else { state='CRASHED'; mult.innerText='💥 CRASH'; historyList.push(crash.toFixed(2)+'x'); setTimeout(startCount,2500); }
            updateUI(); loop=requestAnimationFrame(draw);
        }
        updateUI(); draw(); startCount();
    </script>
</body>
</html>
