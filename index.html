<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rocket Cash Hub Ultra</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07080c;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #111424;
            border-bottom: 1px solid #1f2544;
            align-items: center;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            order: 1;
            text-align: left;
        }

        .avatar-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #1f2544;
            background: linear-gradient(135deg, #0066ff, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: flex-end;
            order: 2;
        }

        .balance-box {
            background: #1a1f37;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            direction: ltr;
            border: 1px solid #ffffff05;
        }

        .balance-box.ton {
            color: #0088cc;
            border-color: #0088cc33;
        }

        .balance-box.gems {
            color: #00ffcc;
            border-color: #00ffcc33;
        }

        .admin-badge {
            background: #ff3366;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .game-container {
            padding: 20px;
            height: calc(100vh - 340px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, #11152b 0%, #07080c 70%);
        }

        .rocket-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.08s linear;
        }

        .rocket-zone {
            font-size: 85px;
            filter: drop-shadow(0 0 15px rgba(255,102,0,0.4));
            z-index: 2;
        }

        .jet-trail {
            width: 8px;
            height: 0px;
            background: linear-gradient(to bottom, #ffaa00, #ff3300, transparent);
            opacity: 0;
            transition: height 0.08s linear, opacity 0.1s;
            border-radius: 4px;
            box-shadow: 0 0 12px #ff5500;
            margin-top: -10px;
            z-index: 1;
        }

        .multiplier {
            font-size: 65px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            font-family: monospace;
        }

        .status-text {
            font-size: 16px;
            color: #8a92b2;
            height: 25px;
            font-weight: 500;
        }

        .countdown-text {
            font-size: 24px;
            color: #ffaa00;
            font-weight: bold;
            margin-top: 10px;
        }

        .controls {
            padding: 15px;
            background: #111424;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid #1f2544;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .selector-row {
            display: flex;
            gap: 10px;
            direction: rtl;
        }

        .selector-btn {
            flex: 1;
            background: #1a1f37;
            border: 1px solid #252c4e;
            color: #8a92b2;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .selector-btn.active.ton {
            background: #0088cc;
            color: #fff;
            border-color: #0088cc;
        }

        .selector-btn.active.gems {
            background: #00ffcc;
            color: #07080c;
            border-color: #00ffcc;
        }

        .auto-cashout-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b33;
            padding: 8px 12px;
            border-radius: 10px;
            direction: rtl;
            border: 1px solid #ffffff05;
        }

        .auto-input-zone {
            display: flex;
            align-items: center;
            gap: 5px;
            direction: ltr;
        }

        .auto-input {
            background: #0d101d;
            border: 1px solid #252c4e;
            color: #fff;
            width: 60px;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .toggle-btn {
            background: #3a3f58;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .toggle-btn.active {
            background: #26a17b;
        }

        .btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,102,255,0.3);
            transition: all 0.2s ease;
        }

        .btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0,255,204,0.3);
        }

        .btn:disabled {
            background: #3a3f58;
            color: #686d87;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="profile-zone">

            <div id="avatar-box" class="avatar-container">
                ⚙️
            </div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">

                <span id="username"
                      style="font-weight:bold; font-size:14px; color:#fff;">
                    جاري التحميل...
                </span>

                <span id="role-tag" class="player-badge">
                    لاعب
                </span>

            </div>

        </div>

        <div class="balances-wrapper">

            <div class="balance-box ton">
                <i class="fas fa-wallet"></i>
                <span id="ton-balance">100.00</span>
                TON
            </div>

            <div class="balance-box gems">
                <i class="fas fa-gem"></i>
                <span id="gems-balance">1000.00</span>
                💎
            </div>

        </div>

    </div>


    <div class="game-container">

        <div id="rocket-container" class="rocket-wrapper">

            <div id="rocket" class="rocket-zone">
                🚀
            </div>

            <div id="trail" class="jet-trail"></div>

        </div>

        <div id="multiplier" class="multiplier">
            1.00x
        </div>

        <div id="status" class="status-text">
            بانتظار بدء الجولة...
        </div>

        <div id="countdown" class="countdown-text"></div>

    </div>


    <div class="controls">

        <div class="selector-row">

            <button
                id="mode-ton"
                class="selector-btn active ton"
                onclick="switchMode('ton')">
                <i class="fas fa-wallet"></i>
                اللعب بالـ TON
            </button>

            <button
                id="mode-gems"
                class="selector-btn gems"
                onclick="switchMode('gems')">
                <i class="fas fa-gem"></i>
                اللعب بالهدايا 💎
            </button>

        </div>


        <div class="auto-cashout-row">

            <span style="font-size:13px;color:#8a92b2;font-weight:bold;">
                سحب تلقائي:
            </span>

            <div class="auto-input-zone">

                <button
                    id="auto-toggle"
                    class="toggle-btn"
                    onclick="toggleAutoCashout()">
                    مغلق
                </button>

                <input
                    id="auto-multiplier"
                    type="number"
                    class="auto-input"
                    value="2.00"
                    step="0.1"
                    min="1.1">

                <span style="font-size:12px;color:#8a92b2;">
                    x
                </span>

            </div>

        </div>


        <button
            id="action-btn"
            class="btn"
            onclick="handleAction()">
            BET
        </button>

    </div>


<script>

    const tg = window.Telegram?.WebApp || null;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    const telegramId = String(
        tg?.initDataUnsafe?.user?.id || "7385640899"
    );

    const firstName =
        tg?.initDataUnsafe?.user?.first_name || "المطور";

    const userPhoto =
        tg?.initDataUnsafe?.user?.photo_url;


    document.getElementById("username").innerText =
        firstName;


    const avatarBox =
        document.getElementById("avatar-box");


    if (userPhoto) {

        avatarBox.innerHTML =
            `<img src="${userPhoto}" alt="profile">`;

    } else {

        avatarBox.innerText =
            firstName.charAt(0).toUpperCase();
    }


    if (telegramId === "7385640899") {

        const role =
            document.getElementById("role-tag");

        role.innerText = "المالك";
        role.className = "admin-badge";
    }


    let tonBalance = 100.00;
    let gemsBalance = 1000.00;

    let currentMode = "ton";

    let isGameRunning = false;
    let hasBet = false;

    let currentMultiplier = 1.00;

    let loopInterval = null;

    let autoCashoutEnabled = false;


    function switchMode(mode) {

        if (isGameRunning || hasBet) {
            return;
        }

        currentMode = mode;

        document.getElementById("mode-ton").className =
            "selector-btn" +
            (mode === "ton" ? " active ton" : "");

        document.getElementById("mode-gems").className =
            "selector-btn" +
            (mode === "gems" ? " active gems" : "");
    }


    function toggleAutoCashout() {

        autoCashoutEnabled =
            !autoCashoutEnabled;

        const btn =
            document.getElementById("auto-toggle");

        btn.className =
            "toggle-btn" +
            (autoCashoutEnabled ? " active" : "");

        btn.innerText =
            autoCashoutEnabled
                ? "مفعّل"
                : "مغلق";
    }


    function runCountdown(seconds) {

        const countdownText =
            document.getElementById("countdown");

        const status =
            document.getElementById("status");

        const btn =
            document.getElementById("action-btn");


        if (seconds > 0) {

            status.innerText =
                "الجولة القادمة تبدأ خلال:";

            countdownText.innerText =
                seconds + " ثوانٍ";


            if (!hasBet) {

                btn.innerText = "BET";
                btn.className = "btn";
                btn.disabled = false;
            }


            setTimeout(
                () => runCountdown(seconds - 1),
                1000
            );

        } else {

            countdownText.innerText = "";

            startLiveGameLoop();
        }
    }


    function startLiveGameLoop() {

        isGameRunning = true;

        currentMultiplier = 1.00;


        const btn =
            document.getElementById("action-btn");

        const rocketCont =
            document.getElementById("rocket-container");

        const rocket =
            document.getElementById("rocket");

        const trail =
            document.getElementById("trail");

        const status =
            document.getElementById("status");

        const multText =
            document.getElementById("multiplier");


        rocket.innerText = "🚀";

        rocketCont.style.transform = "none";

        trail.style.opacity = "1";

        status.innerText =
            "الصاروخ يحلّق الآن في الفضاء الحين...";


        if (hasBet) {

            btn.innerText = "CASH OUT";

            btn.className = "btn cashout";

            btn.disabled = false;

        } else {

            btn.innerText =
                "جاري الطيران.. انتظر الجولة التالية";

            btn.className = "btn";

            btn.disabled = true;
        }


        clearInterval(loopInterval);


        loopInterval = setInterval(() => {

            currentMultiplier += 0.03;


            multText.innerText =
                currentMultiplier.toFixed(2) + "x";


            /* صعود ديناميكي للصاروخ */

            const yMove =
                (currentMultiplier - 1) * 45;

            const scaleMove =
                1 +
                (currentMultiplier - 1) * 0.025;


            rocketCont.style.transform =
                `translateY(-${yMove}px)
                 scale(${scaleMove})
                 rotate(-15deg)`;


            /* خط النار */

            trail.style.height =
                `${Math.min(
                    30,
                    (currentMultiplier - 1) * 20
                )}px`;


            /* السحب التلقائي */

            if (
                hasBet &&
                autoCashoutEnabled
            ) {

                const targetTarget =
                    parseFloat(
                        document.getElementById(
                            "auto-multiplier"
                        ).value
                    );


                if (
                    currentMultiplier >= targetTarget
                ) {

                    clearInterval(loopInterval);

                    cashOut();

                    return;
                }
            }


            /* الانفجار العشوائي */

            if (
                currentMultiplier > 1.12 &&
                Math.random() < 0.024
            ) {

                clearInterval(loopInterval);

                explodeRocket();
            }

        }, 80);
    }


    function explodeRocket() {

        isGameRunning = false;

        hasBet = false;


        document.getElementById(
            "trail"
        ).style.opacity = "0";


        document.getElementById(
            "rocket"
        ).innerText = "💥";


        document.getElementById(
            "rocket-container"
        ).style.transform = "scale(1.4)";


        document.getElementById(
            "status"
        ).innerText =
            "انفجر الصاروخ بربح ضائع!";


        const btn =
            document.getElementById("action-btn");


        btn.innerText = "BET";

        btn.className = "btn";

        btn.disabled = false;


        setTimeout(() => {

            document.getElementById(
                "rocket"
            ).innerText = "🚀";


            document.getElementById(
                "rocket-container"
            ).style.transform = "none";


            document.getElementById(
                "multiplier"
            ).innerText = "1.00x";


            runCountdown(5);

        }, 3000);
    }


    function handleAction() {

        const btn =
            document.getElementById("action-btn");


        if (!isGameRunning && !hasBet) {

            hasBet = true;


            if (currentMode === "ton") {

                tonBalance -= 0.1;


                document.getElementById(
                    "ton-balance"
                ).innerText =
                    tonBalance.toFixed(2);

            } else {

                gemsBalance -= 100;


                document.getElementById(
                    "gems-balance"
                ).innerText =
                    gemsBalance.toFixed(2);
            }


            btn.innerText =
                "تم قبول الرهان..";

            btn.disabled = true;


        } else if (
            isGameRunning &&
            hasBet
        ) {

            clearInterval(loopInterval);

            cashOut();
        }
    }


    function cashOut() {

        isGameRunning = false;

        hasBet = false;


        document.getElementById(
            "trail"
        ).style.opacity = "0";


        const finalMult =
            currentMultiplier;


        if (currentMode === "ton") {

            const winAmount =
                0.1 * finalMult;


            tonBalance += winAmount;


            document.getElementById(
                "ton-balance"
            ).innerText =
                tonBalance.toFixed(2);


            document.getElementById(
                "status"
            ).innerText =
                `كاش أوت آمن! فزت بـ +${winAmount.toFixed(3)} TON 💎`;


        } else {

            const winAmount =
                100 * finalMult;


            gemsBalance += winAmount;


            document.getElementById(
                "gems-balance"
            ).innerText =
                gemsBalance.toFixed(2);


            document.getElementById(
                "status"
            ).innerText =
                `فوز بالهدايا! كسبت +${winAmount.toFixed(0)} جوهرة 💎`;
        }


        const btn =
            document.getElementById("action-btn");


        btn.innerText = "BET";

        btn.className = "btn";

        btn.disabled = false;


        setTimeout(() => {

            document.getElementById(
                "multiplier"
            ).innerText = "1.00x";


            runCountdown(5);

        }, 3000);
    }


    runCountdown(5);

</script>

</body>
</html>
