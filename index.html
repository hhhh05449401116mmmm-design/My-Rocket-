<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Cash Hub</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #07080c; color: #fff; margin: 0; padding: 0; overflow: hidden; user-select: none; text-align: center; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: #111424; border-bottom: 1px solid #1f2544; direction: rtl; align-items: center; }
        .profile-zone { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #0066ff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; border: 2px solid #1f2544; }
        .balance-box { background: #1a1f37; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #00ffcc; display: flex; align-items: center; gap: 5px; direction: ltr; }
        .admin-badge { background: #ff3366; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .player-badge { background: #0066ff; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .game-container { padding: 20px; height: calc(100vh - 180px); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .rocket-zone { font-size: 80px; margin-bottom: 20px; transition: transform 0.05s linear; }
        .multiplier { font-size: 55px; font-weight: bold; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .status-text { font-size: 16px; color: #8a92b2; height: 25px; font-weight: 500; }
        .controls { padding: 20px; background: #111424; position: absolute; bottom: 0; left: 0; right: 0; }
        .btn { background: #0066ff; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,102,255,0.4); transition: all 0.2s; }
        .btn.cashout { background: #00ffcc; color: #07080c; box-shadow: 0 4px 15px rgba(0,255,204,0.4); }
        .btn:disabled { background: #3a3f58; color: #686d87; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-zone">
            <div id="user-avatar" class="avatar">⚙️</div>
            <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">
                <span id="username" style="font-weight:bold; font-size:14px;">جاري التحميل...</span>
                <span id="role-tag" class="player-badge">لاعب</span>
            </div>
        </div>
        <div class="balance-box">
            <i class="fas fa-gem"></i>
            <span id="balance">1000.00</span>
        </div>
    </div>

    <div class="game-container">
        <div id="rocket" class="rocket-zone">🚀</div>
        <div id="multiplier" class="multiplier">1.00x</div>
        <div id="status" class="status-text">بانتظار الجولة القادمة...</div>
    </div>

    <div class="controls">
        <button id="action-btn" class="btn" onclick="handleAction()">BET</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // جلب البيانات الحقيقية من حساب التيليجرام الفعلي بالـ SDK الرسمي
        const telegramId = String(tg.initDataUnsafe?.user?.id || "7385640899"); 
        const firstName = tg.initDataUnsafe?.user?.first_name || "المطور";
        
        document.getElementById('username').innerText = firstName;
        document.getElementById('user-avatar').innerText = firstName.charAt(0).toUpperCase();

        // شرط التحقق الحقيقي الصارم: المالك فقط من يظهر له شارة الأدمن
        if (telegramId === "7385640899") {
            const role = document.getElementById('role-tag');
            role.innerText = "المالك";
            role.className = "admin-badge";
        }

        let currentBalance = 1000.00;
        let isGameRunning = false;
        let hasBet = false;
        let currentMultiplier = 1.00;
        let loopInterval;

        function startLiveGameLoop() {
            if (isGameRunning) return;
            
            const btn = document.getElementById('action-btn');
            const rocket = document.getElementById('rocket');
            const status = document.getElementById('status');
            const multText = document.getElementById('multiplier');

            isGameRunning = true;
            currentMultiplier = 1.00;
            rocket.innerText = "🚀";
            rocket.style.transform = "none";
            status.innerText = "الصاروخ يحلّق الآن الحين...";
            
            if (hasBet) {
                btn.innerText = "CASH OUT";
                btn.className = "btn cashout";
                btn.disabled = false;
            } else {
                btn.innerText = "جاري الطيران أونلاين...";
                btn.disabled = true;
            }

            loopInterval = setInterval(() => {
                currentMultiplier += 0.03;
                multText.innerText = currentMultiplier.toFixed(2) + "x";
                // حركة حركية تفاعلية دقيقة للارتفاع
                rocket.style.transform = `translateY(-${(currentMultiplier-1)*35}px) scale(${1 + (currentMultiplier-1)*0.02})`;

                // نقطة انفجار ديناميكية عشوائية
                if (currentMultiplier > 1.15 && Math.random() < 0.025) {
                    clearInterval(loopInterval);
                    explodeRocket();
                }
            }, 80);
        }

        function explodeRocket() {
            isGameRunning = false;
            hasBet = false;
            document.getElementById('rocket').innerText = "💥";
            document.getElementById('rocket').style.transform = "scale(1.4)";
            document.getElementById('status').innerText = "انفجر الصاروخ! جولة جديدة ستبدأ...";
            
            const btn = document.getElementById('action-btn');
            btn.innerText = "BET";
            btn.className = "btn";
            btn.disabled = false;

            setTimeout(() => {
                document.getElementById('multiplier').innerText = "1.00x";
                document.getElementById('status').innerText = "بانتظار بدء الجولة تلقائياً...";
                startLiveGameLoop();
            }, 3500); 
        }

        function handleAction() {
            const btn = document.getElementById('action-btn');
            if (!isGameRunning && !hasBet) {
                hasBet = true;
                currentBalance -= 100;
                document.getElementById('balance').innerText = currentBalance.toFixed(2);
                btn.innerText = "تم قبول الرهان..";
                btn.disabled = true;
            } else if (isGameRunning && hasBet) {
                hasBet = false;
                const winAmount = 100 * currentMultiplier;
                currentBalance += winAmount;
                document.getElementById('balance').innerText = currentBalance.toFixed(2);
                document.getElementById('status').innerText = `فزت بـ +${winAmount.toFixed(1)} 💎`;
                btn.innerText = "انتظر الجولة القادمة";
                btn.className = "btn";
                btn.disabled = true;
            }
        }

        // إطلاق فوري للحركة التلقائية والدوران عند الدخول
        setTimeout(startLiveGameLoop, 1500);
    </script>
</body>
</html>
