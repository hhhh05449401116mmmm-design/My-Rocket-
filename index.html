<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Epic Gift Rocket Ultimate Pro v9</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0c0d14;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        button,
        input {
            font: inherit;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background: #151724;
            border-bottom: 1px solid #23273c;
            align-items: center;
            direction: ltr;
        }

        .profile-zone {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
            order: 1;
            direction: ltr;
        }

        .avatar-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #2d334d;
            background: linear-gradient(135deg, #a020f0, #00ffcc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .balances-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: flex-end;
            order: 2;
            direction: rtl;
        }

        .balance-box {
            background: #1e2238;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .balance-box.ton {
            color: #0088cc;
        }

        .admin-badge {
            background: #ff3366;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        .player-badge {
            background: #0066ff;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: bold;
            margin-top: 2px;
            display: inline-block;
            width: fit-content;
        }

        /* GAME */
        .game-container {
            padding: 10px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #07080f;
            overflow: hidden;
        }

        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: scrollStars linear infinite;
        }

        @keyframes scrollStars {
            0% {
                transform: translateY(-20px) translateX(20px);
                opacity: 1;
            }

            100% {
                transform: translateY(280px) translateX(-280px);
                opacity: 0;
            }
        }

        .svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .curve-line {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition:
                stroke-dasharray 0.06s linear,
                stroke 0.1s;
        }

        .rocket-container-wrapper {
            position: absolute;
            bottom: 52px;
            left: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transform: translate(0, 0);
            transition: transform 0.06s linear;
        }

        .rocket-zone {
            font-size: 52px;
            display: inline-block;
            position: relative;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.6));
        }

        .particle-glow {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--p-color, #ffaa00);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(0.5px);
            animation: emitParticle 0.3s linear infinite;
            pointer-events: none;
        }

        @keyframes emitParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }

            100% {
                transform: translate(-35px, 35px) scale(0.1);
                opacity: 0;
            }
        }

        .multiplier {
            font-size: 55px;
            font-weight: bold;
            color: #fff;
            z-index: 4;
            font-family: sans-serif;
            position: relative;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
            direction: ltr;
        }

        /* COUNTDOWN */
        .countdown-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .countdown-svg {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }

        .countdown-svg circle {
            fill: none;
            stroke-width: 5;
        }

        .countdown-svg .bg-circle {
            stroke: #1e2238;
        }

        .countdown-svg .bar-circle {
            stroke: #ffaa00;
            stroke-dasharray: 236;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .countdown-number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        /* HISTORY */
        .history-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #11131f;
            overflow-x: auto;
            direction: rtl;
            align-items: center;
            border-bottom: 1px solid #1f2235;
            scrollbar-width: none;
        }

        .history-row::-webkit-scrollbar {
            display: none;
        }

        .history-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
            direction: ltr;
            flex-shrink: 0;
        }

        .history-badge.red {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid #ff336644;
        }

        .history-badge.green {
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            border: 1px solid #00ffcc44;
        }

        .history-badge.blue {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
            border: 1px solid #0066ff44;
        }

        .history-badge.purple {
            background: rgba(160, 32, 240, 0.15);
            color: #a020f0;
            border: 1px solid #a020f044;
        }

        .history-badge.gold {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid #ffaa0044;
        }

        .history-badge.fire {
            background: rgba(255, 68, 0, 0.18);
            color: #ff4400;
            border: 1px solid #ff440055;
            font-weight: 800;
            box-shadow: 0 0 6px rgba(255, 68, 0, 0.2);
        }

        /* BET PANEL */
        .bet-panel {
            padding: 15px;
            background: #151724;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #1f2235;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8a92b2;
            padding: 2px 5px;
        }

        .input-box-wrapper {
            display: flex;
            background: #0c0d14;
            border: 1px solid #23273c;
            border-radius: 12px;
            padding: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .amount-input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 70%;
            text-align: left;
            outline: none;
            direction: ltr;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1f33;
            padding: 10px 14px;
            border-radius: 12px;
        }

        .switch-btn {
            width: 44px;
            height: 24px;
            background: #3a3f58;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .switch-btn.active {
            background: #26a17b;
        }

        .switch-circle {
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }

        .switch-btn.active .switch-circle {
            left: 23px;
        }

        .switch-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auto-cashout-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #11131f;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #23273c;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auto-cashout-control-row.active {
            opacity: 1;
        }

        .auto-cashout-control-row.locked {
            opacity: 0.3 !important;
            pointer-events: none;
            cursor: not-allowed;
        }

        .step-btn {
            background: #1e2238;
            border: 1px solid #2d334d;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auto-val-display {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            font-family: monospace;
            direction: ltr;
        }

        .main-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-btn.cashout {
            background: #00ffcc;
            color: #07080c;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        .main-btn.queued {
            background: #ffaa00;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
        }

        .main-btn:disabled {
            background: #2b3047;
            color: #5a607a;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* PLAYERS */
        .players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0c0d14;
        }

        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #151724;
            border: 1px solid #ffffff03;
            transition: all 0.1s ease;
            direction: ltr;
        }

        .player-card.active {
            border-color: rgba(0, 102, 255, 0.3);
            background: rgba(0, 102, 255, 0.04);
        }

        .player-card.win {
            border-color: rgba(0, 255, 204, 0.3);
            background: rgba(0, 255, 204, 0.08);
        }

        .player-card.lose {
            border-color: rgba(255, 51, 102, 0.2);
            background: rgba(255, 51, 102, 0.03);
        }

        .p-info {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            background: #2b3047;
            flex-shrink: 0;
        }

        .p-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-status-box {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
            direction: ltr;
        }

        .p-status-box.active {
            background: rgba(0, 102, 255, 0.15);
            color: #0066ff;
        }

        .p-status-box.win {
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
        }

        .p-status-box.lose {
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <div class="profile-zone">
            <div id="avatar-box" class="avatar-container">⚙️</div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <span id="username" style="font-weight:bold; font-size:13px;">
                    جاري التحميل...
                </span>

                <span id="role-tag" class="player-badge">
                    لاعب
                </span>
            </div>
        </div>

        <div class="balances-wrapper">

            <div class="balance-box ton">
                <span id="ton-balance">126.04</span>
                <span>TON</span>
            </div>

            <div style="font-size:11px; color:#8a92b2;">
                الرصيد المتاح
            </div>

        </div>
    </div>


    <!-- GAME AREA -->
    <div class="game-container">

        <div id="space-bg" class="space-bg"></div>

        <svg
            class="svg-canvas"
            viewBox="0 0 320 250"
            preserveAspectRatio="none"
            aria-hidden="true"
        >
            <path
                id="neon-curve"
                class="curve-line"
                d="M 55 220"
                stroke="#ff3366"
            ></path>
        </svg>

        <div id="rocket-container" class="rocket-container-wrapper">
            <div id="rocket" class="rocket-zone">🚀</div>
        </div>

        <div
            id="multiplier"
            class="multiplier"
            style="display:none;"
        >
            1.00x
        </div>

        <div id="countdown-wrapper" class="countdown-container">

            <svg
                class="countdown-svg"
                viewBox="0 0 80 80"
                aria-hidden="true"
            >
                <circle
                    class="bg-circle"
                    cx="40"
                    cy="40"
                    r="37.5"
                ></circle>

                <circle
                    id="progress-bar"
                    class="bar-circle"
                    cx="40"
                    cy="40"
                    r="37.5"
                ></circle>
            </svg>

            <div
                id="countdown-num"
                class="countdown-number"
            >
                5
            </div>

        </div>
    </div>


    <!-- HISTORY -->
    <div id="history-bar" class="history-row"></div>


    <!-- BET PANEL -->
    <div class="bet-panel">

        <div class="info-row">
            <span id="balance-label">126.04 TON</span>
            <span>Available Balance</span>
        </div>

        <div class="input-box-wrapper">

            <span style="font-size:13px; color:#8a92b2;">
                Bet Amount
            </span>

            <input
                id="bet-input"
                class="amount-input"
                type="number"
                min="0.10"
                max="126.04"
                step="0.05"
                value="0.10"
                inputmode="decimal"
            >

            <span style="font-weight:bold; color:#0088cc;">
                TON
            </span>

        </div>


        <!-- AUTO CASHOUT -->
        <div class="switch-row">

            <span style="font-size:13px; font-weight:bold;">
                Auto cashout
            </span>

            <div
                id="auto-switch"
                class="switch-btn"
                onclick="toggleAutoCashout()"
                role="button"
                aria-label="Auto cashout"
            >
                <div class="switch-circle"></div>
            </div>

        </div>


        <div
            id="auto-control-box"
            class="auto-cashout-control-row"
        >

            <button
                class="step-btn"
                type="button"
                onclick="adjustAutoVal(-0.10)"
            >
                −
            </button>

            <div class="auto-val-display">
                <span id="auto-cashout-val">1.50</span>
                x
            </div>

            <button
                class="step-btn"
                type="button"
                onclick="adjustAutoVal(0.10)"
            >
                +
            </button>

        </div>


        <button
            id="action-btn"
            class="main-btn"
            type="button"
            onclick="handleAction()"
        >
            Place TON Bet 🚀
        </button>

    </div>


    <!-- PLAYERS -->
    <div class="players-list">
        <div id="players-feed"></div>
    </div>


<script>
    /* =========================================
       TELEGRAM WEB APP
    ========================================= */

    const tg = window.Telegram?.WebApp || null;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    const telegramId = String(
        tg?.initDataUnsafe?.user?.id || "7385640899"
    );

    const firstName =
        tg?.initDataUnsafe?.user?.first_name || "اللاعب";

    const userPhoto =
        tg?.initDataUnsafe?.user?.photo_url || "";


    /* =========================================
       PROFILE
    ========================================= */

    document.getElementById("username").innerText = firstName;

    const avatarBox = document.getElementById("avatar-box");

    if (userPhoto) {
        avatarBox.innerHTML =
            `<img src="${escapeHtml(userPhoto)}" alt="profile">`;
    } else {
        avatarBox.innerText =
            firstName.charAt(0).toUpperCase();
    }


    if (telegramId === "7385640899") {

        const role = document.getElementById("role-tag");

        role.innerText = "المالك";
        role.className = "admin-badge";
    }


    /* =========================================
       GAME VARIABLES
    ========================================= */

    let tonBalance = 126.04;

    let isGameRunning = false;

    let hasBet = false;

    let isQueuedForNextRound = false;

    let currentMultiplier = 1.00;

    let loopInterval = null;

    let autoCashoutEnabled = false;

    let autoCashoutTarget = 1.50;

    let playerBetAmount = 0;


    /* =========================================
       PLAYERS
    ========================================= */

    const basePlayers = [

        {
            name: "LA",
            bet: 1.00,
            color: "#e066ff",
            avatar: "",
            state: "active",
            finalMult: 1.00
        },

        {
            name: "755",
            bet: 0.10,
            color: "#ffaa00",
            avatar: "",
            state: "active",
            finalMult: 1.00
        },

        {
            name: "مكسم",
            bet: 0.10,
            color: "#00ffcc",
            avatar: "",
            state: "active",
            finalMult: 1.00
        }

    ];

    let livePlayers = [];


    /* =========================================
       HISTORY
    ========================================= */

    let globalHistory = [
        1.24,
        2.15,
        6.40,
        11.86,
        27.50
    ];


    /* =========================================
       HELPERS
    ========================================= */

    function escapeHtml(value) {

        return String(value).replace(
            /[&<>"']/g,
            function (char) {

                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return map[char];
            }
        );
    }


    function updateBalanceUI() {

        document.getElementById("ton-balance").innerText =
            tonBalance.toFixed(2);

        document.getElementById("balance-label").innerText =
            tonBalance.toFixed(2) + " TON";

        document.getElementById("bet-input").max =
            tonBalance.toFixed(2);
    }


    /* =========================================
       STARS
    ========================================= */

    const bg = document.getElementById("space-bg");

    const colors = [
        "#fff",
        "#00ffcc",
        "#0066ff",
        "#ffaa00",
        "#ff3366"
    ];

    for (let i = 0; i < 35; i++) {

        const star = document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 100 + "%";

        star.style.background =
            colors[
                Math.floor(Math.random() * colors.length)
            ];

        star.style.animationDuration =
            (Math.random() * 1.5 + 0.8) + "s";

        star.style.animationDelay =
            (Math.random() * 1.5) + "s";

        bg.appendChild(star);
    }


    /* =========================================
       AUTO CASHOUT
    ========================================= */

    function toggleAutoCashout() {

        if (isGameRunning) {
            return;
        }

        autoCashoutEnabled =
            !autoCashoutEnabled;

        document.getElementById(
            "auto-switch"
        ).className =
            "switch-btn" +
            (autoCashoutEnabled ? " active" : "");

        document.getElementById(
            "auto-control-box"
        ).className =
            "auto-cashout-control-row" +
            (autoCashoutEnabled ? " active" : "");
    }


    function adjustAutoVal(val) {

        if (
            !autoCashoutEnabled ||
            isGameRunning
        ) {
            return;
        }

        autoCashoutTarget =
            parseFloat(
                (
                    autoCashoutTarget + val
                ).toFixed(2)
            );

        if (autoCashoutTarget < 1.10) {
            autoCashoutTarget = 1.10;
        }

        if (autoCashoutTarget > 1000.00) {
            autoCashoutTarget = 1000.00;
        }

        document.getElementById(
            "auto-cashout-val"
        ).innerText =
            autoCashoutTarget.toFixed(2);
    }


    /* =========================================
       HISTORY UI
    ========================================= */

    function renderHistoryUI() {

        const bar =
            document.getElementById("history-bar");

        bar.innerHTML = "";

        globalHistory.forEach(function (val) {

            const badgeColors =
                getColorByMultiplier(val);

            const badge =
                document.createElement("div");

            badge.className =
                `history-badge ${badgeColors.name}`;

            badge.innerText =
                val.toFixed(2) + "x";

            bar.appendChild(badge);
        });
    }


    /* =========================================
       PLAYERS UI
    ========================================= */

    function updatePlayersUI() {

        const feed =
            document.getElementById("players-feed");

        feed.innerHTML = "";

        livePlayers.forEach(function (p) {

            const card =
                document.createElement("div");

            card.className =
                `player-card ${p.state}`;

            const stateClass =
                p.state === "active"
                    ? "active"
                    : p.state === "win"
                        ? "win"
                        : "lose";

            const runningMult =
                p.state === "active"
                    ? currentMultiplier
                    : p.finalMult;

            const currentLiveWin =
                (
                    p.bet * runningMult
                ).toFixed(2);

            const safeName =
                escapeHtml(p.name);

            const safeAvatar =
                escapeHtml(p.avatar || "");

            const safeColor =
                escapeHtml(p.color || "#2b3047");

            const imgTag =
                p.avatar
                    ? `<img src="${safeAvatar}" alt="">`
                    : `
                        <div style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:${safeColor};
                        ">
                            ${escapeHtml(
                                String(p.name).charAt(0)
                            )}
                        </div>
                    `;

            card.innerHTML = `
                <div class="p-info">

                    <div class="p-avatar">
                        ${imgTag}
                    </div>

                    <div style="
                        display:flex;
                        flex-direction:column;
                        align-items:flex-start;
                        gap:2px;
                    ">

                        <span style="
                            font-weight:bold;
                            font-size:13px;
                        ">
                            ${safeName}
                        </span>

                        <span style="
                            font-size:11px;
                            color:#8a92b2;
                            direction:ltr;
                        ">
                            💎 ${p.bet.toFixed(2)}
                            ×${runningMult.toFixed(2)}
                        </span>

                    </div>

                </div>

                <div class="p-status-box ${stateClass}">
                    💎 ${currentLiveWin}
                </div>
            `;

            feed.appendChild(card);
        });
    }


    /* =========================================
       START NEW ROUND
    ========================================= */

    function runGlobalLoop() {

        let count = 5;

        const wrapper =
            document.getElementById(
                "countdown-wrapper"
            );

        const numText =
            document.getElementById(
                "countdown-num"
            );

        const bar =
            document.getElementById(
                "progress-bar"
            );

        const multText =
            document.getElementById(
                "multiplier"
            );

        const btn =
            document.getElementById(
                "action-btn"
            );

        const path =
            document.getElementById(
                "neon-curve"
            );

        const rCont =
            document.getElementById(
                "rocket-container"
            );

        const rocket =
            document.getElementById(
                "rocket"
            );


        /* RESET */

        isGameRunning = false;

        currentMultiplier = 1.00;

        multText.style.display = "none";

        wrapper.style.display = "flex";

        path.setAttribute(
            "d",
            "M 55 220"
        );

        path.setAttribute(
            "stroke",
            "#ff3366"
        );

        path.style.filter = "none";

        rCont.style.transform =
            "translate(0, 0)";

        rocket.innerText = "🚀";

        rocket.style.transform =
            "none";


        /* UNLOCK AUTO CASHOUT */

        document.getElementById(
            "auto-switch"
        ).classList.remove("disabled");

        document.getElementById(
            "auto-control-box"
        ).classList.remove("locked");


        /* BASE PLAYERS */

        livePlayers =
            JSON.parse(
                JSON.stringify(basePlayers)
            );

        livePlayers.forEach(function (p) {

            p.state = "active";

            p.finalMult = 1.00;
        });


        /* QUEUED BET */

        if (isQueuedForNextRound) {

            hasBet = true;

            isQueuedForNextRound = false;
        }


        /* CURRENT PLAYER */

        if (hasBet) {

            livePlayers.unshift({

                name: firstName,

                bet: playerBetAmount,

                color: "#ff3366",

                avatar: userPhoto,

                state: "active",

                finalMult: 1.00
            });
        }


        updatePlayersUI();

        renderHistoryUI();


        /* BUTTON */

        if (!hasBet) {

            btn.disabled = false;

            btn.className =
                "main-btn";

            btn.innerText =
                "Place TON Bet 🚀";

        } else {

            btn.disabled = false;

            btn.className =
                "main-btn cashout";

            btn.innerText =
                "Cash Out 💰";
        }


        /* COUNTDOWN */

        function timer() {

            if (count > 0) {

                numText.innerText =
                    count;

                const offset =
                    236 -
                    (
                        236 *
                        (count / 5)
                    );

                bar.style.strokeDashoffset =
                    offset;

                count--;

                setTimeout(
                    timer,
                    1000
                );

            } else {

                wrapper.style.display =
                    "none";

                multText.style.display =
                    "block";

                startRocketFlight();
            }
        }


        bar.style.strokeDashoffset =
            0;

        timer();
    }


    /* =========================================
       MULTIPLIER COLORS
    ========================================= */

    function getColorByMultiplier(val) {

        if (val < 1.30) {

            return {
                name: "red",
                hex: "#ff3366"
            };
        }

        if (val < 2.00) {

            return {
                name: "green",
                hex: "#00ffcc"
            };
        }

        if (val < 5.00) {

            return {
                name: "blue",
                hex: "#0066ff"
            };
        }

        if (val < 9.00) {

            return {
                name: "purple",
                hex: "#a020f0"
            };
        }

        if (val < 25.00) {

            return {
                name: "gold",
                hex: "#ffaa00"
            };
        }

        return {
            name: "fire",
            hex: "#ff4400"
        };
    }


    /* =========================================
       ROCKET FLIGHT
    ========================================= */

    function startRocketFlight() {

        isGameRunning = true;

        currentMultiplier = 1.00;

        const rCont =
            document.getElementById(
                "rocket-container"
            );

        const path =
            document.getElementById(
                "neon-curve"
            );

        const multText =
            document.getElementById(
                "multiplier"
            );

        const btn =
            document.getElementById(
                "action-btn"
            );


        /* LOCK AUTO CASHOUT */

        document.getElementById(
            "auto-switch"
        ).classList.add(
            "disabled"
        );

        document.getElementById(
            "auto-control-box"
        ).classList.add(
            "locked"
        );


        /* BUTTON */

        if (hasBet) {

            btn.innerText =
                "Cash Out 💰";

            btn.className =
                "main-btn cashout";

            btn.disabled = false;

        } else {

            btn.disabled = false;

            btn.className =
                "main-btn";

            btn.innerText =
                "Bet for Next Round ⏳";
        }


        /* CRASH POINT */

        let crashPoint = 1.01;

        const diceRoll =
            Math.random();

        if (diceRoll < 0.70) {

            crashPoint =
                1.01 +
                (
                    Math.random() *
                    0.78
                );

        } else if (diceRoll < 0.99) {

            crashPoint =
                1.80 +
                (
                    Math.random() *
                    8.20
                );

        } else {

            crashPoint =
                10.00 +
                (
                    Math.random() *
                    25.00
                );
        }


        /* GAME LOOP */

        loopInterval =
            setInterval(function () {

                currentMultiplier +=
                    0.01111;

                multText.innerText =
                    currentMultiplier.toFixed(2) +
                    "x";


                const currentColors =
                    getColorByMultiplier(
                        currentMultiplier
                    );


                path.setAttribute(
                    "stroke",
                    currentColors.hex
                );

                path.style.filter =
                    `drop-shadow(
                        0 0 6px
                        ${currentColors.hex}
                    )`;


                /* ROCKET POSITION */

                let xMove = 0;

                let yMove = 0;

                if (
                    currentMultiplier <= 1.30
                ) {

                    xMove =
                        (
                            currentMultiplier - 1
                        ) * 230;

                    yMove = 0;

                } else {

                    xMove =
                        69 +
                        (
                            currentMultiplier - 1.30
                        ) * 45;

                    yMove =
                        (
                            currentMultiplier - 1.30
                        ) * 65;
                }


                const finalX =
                    Math.min(
                        210,
                        xMove
                    );

                const finalY =
                    Math.min(
                        150,
                        yMove
                    );


                rCont.style.transform =
                    `translate(
                        ${finalX}px,
                        -${finalY}px
                    ) rotate(-15deg)`;


                /* PATH */

                const startX = 55;

                const startY = 220;

                const currentX =
                    startX + finalX;

                const currentY =
                    startY - finalY;


                if (
                    currentMultiplier <= 1.30
                ) {

                    path.setAttribute(
                        "d",
                        `M ${startX} ${startY}
                         L ${currentX} ${currentY}`
                    );

                } else {

                    const controlX =
                        startX + 69;

                    const controlY =
                        startY;

                    path.setAttribute(
                        "d",
                        `M ${startX} ${startY}
                         Q ${controlX} ${controlY}
                         ${currentX} ${currentY}`
                    );
                }


                /* PARTICLES */

                if (Math.random() < 0.4) {

                    const p =
                        document.createElement(
                            "div"
                        );

                    p.className =
                        "particle-glow";

                    p.style.setProperty(
                        "--p-color",
                        currentColors.hex
                    );

                    p.style.left =
                        "22px";

                    p.style.top =
                        "22px";

                    rCont.appendChild(p);

                    setTimeout(
                        function () {
                            p.remove();
                        },
                        400
                    );
                }


                /* BOT PLAYERS */

                livePlayers.forEach(
                    function (p) {

                        if (
                            p.name !== firstName &&
                            p.state === "active"
                        ) {

                            if (
                                Math.random() < 0.015 &&
                                currentMultiplier > 1.15
                            ) {

                                p.state =
                                    "win";

                                p.finalMult =
                                    currentMultiplier;
                            }
                        }
                    }
                );


                updatePlayersUI();


                /* AUTO CASHOUT */

                if (
                    hasBet &&
                    autoCashoutEnabled &&
                    currentMultiplier >=
                        autoCashoutTarget
                ) {

                    clearInterval(
                        loopInterval
                    );

                    loopInterval = null;

                    triggerCashoutSuccess();

                    return;
                }


                /* CRASH */

                if (
                    currentMultiplier >=
                    crashPoint
                ) {

                    clearInterval(
                        loopInterval
                    );

                    loopInterval = null;

                    triggerRocketCrash();
                }

            }, 30);
    }


    /* =========================================
       CRASH
    ========================================= */

    function triggerRocketCrash() {

        isGameRunning = false;


        if (loopInterval) {

            clearInterval(
                loopInterval
            );

            loopInterval = null;
        }


        globalHistory.unshift(
            currentMultiplier
        );

        if (globalHistory.length > 5) {

            globalHistory.pop();
        }


        const rocket =
            document.getElementById(
                "rocket"
            );


        rocket.innerText =
            "💥";

        rocket.style.transform =
            "scale(1.4)";


        livePlayers.forEach(
            function (p) {

                if (p.state === "active") {

                    p.state = "lose";

                    p.finalMult =
                        currentMultiplier;
                }
            }
        );


        updatePlayersUI();


        /*
            لا نحذف playerBetAmount هنا،
            لأن الرهان المؤجل للجولة القادمة
            يحتاج نفس القيمة.
        */

        hasBet = false;


        const btn =
            document.getElementById(
                "action-btn"
            );

        btn.disabled = true;


        setTimeout(
            function () {

                rocket.innerText =
                    "🚀";

                rocket.style.transform =
                    "none";

                document.getElementById(
                    "rocket-container"
                ).style.transform =
                    "none";

                runGlobalLoop();

            },
            3500
        );
    }


    /* =========================================
       ACTION BUTTON
    ========================================= */

    function handleAction() {

        const btn =
            document.getElementById(
                "action-btn"
            );

        const input =
            document.getElementById(
                "bet-input"
            );

        const amt =
            parseFloat(input.value);


        /* VALIDATE AMOUNT */

        if (
            !Number.isFinite(amt) ||
            amt < 0.10 ||
            amt > tonBalance
        ) {

            return;
        }


        /* =====================================
           DURING FLIGHT
        ===================================== */

        if (isGameRunning) {


            /* CASH OUT */

            if (hasBet) {

                if (loopInterval) {

                    clearInterval(
                        loopInterval
                    );

                    loopInterval = null;
                }

                triggerCashoutSuccess();

                return;
            }


            /* QUEUE BET */

            if (!isQueuedForNextRound) {

                isQueuedForNextRound =
                    true;

                playerBetAmount =
                    amt;

                tonBalance -= amt;

                updateBalanceUI();


                btn.className =
                    "main-btn queued";

                btn.innerText =
                    "Queued for Next Round ⏳";

                btn.disabled = true;
            }

            return;
        }


        /* =====================================
           COUNTDOWN / WAITING
        ===================================== */

        if (!hasBet) {

            hasBet = true;

            playerBetAmount =
                amt;

            tonBalance -= amt;

            updateBalanceUI();


            livePlayers.unshift({

                name: firstName,

                bet: amt,

                color: "#ff3366",

                avatar: userPhoto,

                state: "active",

                finalMult: 1.00
            });


            updatePlayersUI();


            btn.innerText =
                "Waiting for Takeoff...";

            btn.disabled = true;
        }
    }


    /* =========================================
       CASHOUT SUCCESS
    ========================================= */

    function triggerCashoutSuccess() {

        const amt =
            playerBetAmount;


        if (
            !Number.isFinite(amt) ||
            amt <= 0
        ) {

            return;
        }


        const winAmt =
            amt *
            currentMultiplier;


        tonBalance +=
            winAmt;

        updateBalanceUI();


        livePlayers.forEach(
            function (p) {

                if (
                    p.name === firstName &&
                    p.state === "active"
                ) {

                    p.state =
                        "win";

                    p.finalMult =
                        currentMultiplier;
                }
            }
        );


        updatePlayersUI();


        const btn =
            document.getElementById(
                "action-btn"
            );


        btn.innerText =
            "Cashed Out! 🎉";

        btn.disabled =
            true;


        /*
            تنتهي الجولة بعد Cash Out
            كما كان مقصودًا في التصميم.
        */

        triggerRocketCrash();
    }


    /* =========================================
       INITIALIZE
    ========================================= */

    updateBalanceUI();

    renderHistoryUI();

    runGlobalLoop();

</script>
