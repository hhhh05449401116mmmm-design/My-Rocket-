<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>🎁 Epic Gift - Premium</title>
    <meta name="theme-color" content="#0a1628">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    
    <style>
        /* =========================================================
           BASE STYLES
        ========================================================= */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0a0e1a;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================================================
           APP CONTAINER
        ========================================================= */
        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding-bottom: 100px;
            position: relative;
            z-index: 2;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        .header {
            height: 70px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(10, 14, 26, 0.95), transparent);
        }
        .profile-box {
            display: flex;
            align-items: center;
            gap: 9px;
            direction: ltr;
            min-width: 0;
        }
        .avatar {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #1a3a5c, #0d1f3c);
            border: 2px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.15);
        }
        .profile-info {
            direction: rtl;
            text-align: left;
            min-width: 0;
        }
        .profile-name {
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            color: #e8f4ff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.2);
        }
        .profile-id {
            color: #7a9bcb;
            font-size: 10px;
            margin-top: 3px;
        }
        .admin-badge {
            display: none;
            margin-top: 3px;
            font-size: 9px;
            color: #ffd75a;
        }
        .wallet-area {
            display: flex;
            align-items: center;
            gap: 6px;
            direction: ltr;
        }

        /* =========================================================
           TON WALLET BUTTON
        ========================================================= */
        .wallet-balance {
            min-width: 90px;
            height: 40px;
            border-radius: 14px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #0f2847, #1a3a6c);
            border: 1px solid rgba(100, 200, 255, 0.2);
            color: #c8e6ff;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(50, 150, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .wallet-balance::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.05), transparent 70%);
            animation: walletGlow 3s ease-in-out infinite;
        }
        @keyframes walletGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        .wallet-balance .ton-icon {
            width: 20px;
            height: 20px;
            position: relative;
            z-index: 2;
        }
        .wallet-balance span {
            position: relative;
            z-index: 2;
        }
        .wallet-balance:active { transform: scale(0.95); }
        .ton-icon svg {
            width: 100%;
            height: 100%;
            fill: url(#tonGrad);
        }
        .deposit-button {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1a3a6c, #0f2847);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(100, 200, 255, 0.2);
            box-shadow: 0 4px 20px rgba(50, 150, 255, 0.1);
            transition: all 0.3s ease;
            font-weight: 300;
        }
        .deposit-button:active { transform: scale(0.91); }

        /* =========================================================
           GAME HUB (الرئيسية)
        ========================================================= */
        .game-hub {
            display: block;
            padding: 10px 12px;
        }
        .game-hub.hidden { display: none; }
        .game-hub-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 18px;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
            letter-spacing: 1px;
        }
        .game-hub-title .highlight {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            padding: 0 4px;
        }
        .game-card.premium {
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(145deg, #0f2847, #0a1a30);
            border: 1px solid rgba(100, 200, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .game-card.premium:active {
            transform: scale(0.95);
        }
        .game-card-bg {
            padding: 20px 16px 12px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .game-icon-svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 4px 20px rgba(79, 195, 247, 0.2));
        }
        .game-info {
            padding: 10px 14px 14px;
            background: rgba(10, 14, 26, 0.6);
            backdrop-filter: blur(10px);
        }
        .game-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .game-name {
            font-size: 14px;
            font-weight: 900;
            color: #e8f4ff;
            letter-spacing: 0.5px;
        }
        .badge {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.hot { background: rgba(255, 215, 0, 0.15); color: #ffd700; animation: pulse 1.5s ease-in-out infinite; }
        .badge.live { background: rgba(79, 195, 247, 0.15); color: #4fc3f7; }
        .badge.new { background: rgba(56, 210, 123, 0.15); color: #4de18a; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* =========================================================
           ROCKET GAME (الواجهة الجديدة)
        ========================================================= */
        .rocket-game-container { display: block; }
        .rocket-game-container.hidden { display: none; }

        .game-card {
            margin: 4px 12px 0;
            height: 420px;
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            background: radial-gradient(ellipse at 30% 20%, #0f2847 0%, #080e1e 40%, #030812 100%);
            border: 1px solid rgba(100, 200, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(50, 150, 255, 0.03);
            animation: cardGlow 4s ease-in-out infinite;
        }
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(50, 150, 255, 0.03); }
            50% { box-shadow: 0 8px 60px rgba(50, 150, 255, 0.15), inset 0 0 80px rgba(50, 150, 255, 0.05); }
        }

        .stars {
            position: absolute;
            inset: 0;
            opacity: 0.9;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(200, 240, 255, 0.9) 1.5px, transparent 1.5px),
                radial-gradient(circle, rgba(150, 220, 255, 0.6) 1px, transparent 1px),
                radial-gradient(circle, rgba(255, 255, 255, 0.3) 0.5px, transparent 0.5px);
            background-size: 71px 67px, 113px 101px, 180px 160px;
            background-position: 8px 11px, 37px 31px, 100px 80px;
            animation: spaceMove 4s linear infinite;
        }
        @keyframes spaceMove {
            from { background-position: 8px 11px, 37px 31px, 100px 80px; }
            to { background-position: -90px 125px, -150px 190px, -200px 250px; }
        }

        .fog-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(0deg, rgba(10, 14, 26, 0.8), transparent);
            z-index: 2;
            pointer-events: none;
        }

        .game-top {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            z-index: 4;
            display: flex;
            justify-content: center;
        }
        .round-label {
            padding: 7px 16px;
            border-radius: 20px;
            background: rgba(10, 26, 48, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.1);
            color: #7a9bcb;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        /* الأرقام الكبيرة جدا في المنتصف */
        .multiplier {
            position: absolute;
            top: 45%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            z-index: 5;
            text-align: center;
            font-size: 76px; 
            line-height: 1;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 0 5px 40px rgba(0, 0, 0, 0.6);
            transition: color 0.2s;
        }
        .multiplier.crashed {
            color: #ff4f67;
            text-shadow: 0 5px 50px rgba(255, 79, 103, 0.4);
        }
        .multiplier.flying {
            color: #e8f4ff;
            text-shadow: 0 5px 50px rgba(100, 200, 255, 0.4);
        }
        .multiplier.waiting { color: #7a9bcb; }

        /* عداد الدائرة في وقت الراحة بين الجولات */
        .countdown-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .countdown-container.show { opacity: 1; pointer-events: auto; }

        .countdown-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid rgba(79, 195, 247, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .countdown-progress {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: #4de18a;
            border-right-color: #4de18a;
            transform: rotate(-45deg);
            transition: transform 0.5s linear;
        }
        .countdown-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .countdown-num {
            font-size: 60px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.8);
        }
        .countdown-txt {
            font-size: 12px;
            color: #4fc3f7;
            font-weight: 700;
            margin-top: 4px;
        }

        .rocket-area {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .flight-line {
            position: absolute;
            left: 9%;
            right: 8%;
            bottom: 63px;
            height: 3px;
            transform: rotate(-9deg);
            transform-origin: left center;
            background: linear-gradient(90deg, rgba(100, 200, 255, 0), rgba(100, 200, 255, 0.7), rgba(79, 195, 247, 1), rgba(100, 200, 255, 0.7));
            opacity: 0.7;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
            transition: all 0.3s ease;
        }
        .flight-line::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 10px;
            background: radial-gradient(ellipse at right, rgba(79, 195, 247, 0.5), transparent);
            border-radius: 50%;
            filter: blur(6px);
        }

        .rocket {
            position: absolute;
            left: 15%;
            bottom: 74px;
            width: 75px;
            height: 75px;
            transform: rotate(-12deg);
            transition: left 0.1s linear, bottom 0.1s linear, transform 0.1s linear;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rocket svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 40px rgba(100, 200, 255, 0.4));
        }
        .rocket.crashed { animation: crashRocket 0.6s ease forwards; }
        @keyframes crashRocket {
            0% { opacity: 1; transform: rotate(-12deg) scale(1) translateY(0); }
            100% { opacity: 0; transform: translate(80px, 90px) rotate(45deg) scale(0.3); }
        }

        .flame {
            position: absolute;
            left: calc(15% - 8px);
            bottom: 64px;
            width: 26px;
            height: 40px;
            border-radius: 50% 50% 65% 65%;
            background: linear-gradient(180deg, #4fc3f7, #00bcd4, #0288d1);
            filter: blur(5px);
            opacity: 0.9;
            transform: rotate(-12deg);
            z-index: 4;
            box-shadow: 0 0 50px rgba(79, 195, 247, 0.4);
            transition: all 0.3s ease;
        }

        .rocket-trail {
            position: absolute;
            left: 8%;
            bottom: 78px;
            width: 140px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(90deg, rgba(100, 200, 255, 0), rgba(100, 200, 255, 0.2), rgba(79, 195, 247, 0.7), rgba(100, 200, 255, 0.9));
            filter: blur(5px);
            opacity: 0;
            transform: rotate(-12deg);
            transform-origin: right center;
            z-index: 3;
            transition: left 0.1s linear, bottom 0.1s linear, width 0.1s linear, opacity 0.3s ease;
            box-shadow: 0 0 40px rgba(79, 195, 247, 0.2);
        }
        .rocket-trail::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            width: 50px;
            height: 16px;
            transform: translateY(-50%);
            border-radius: 50%;
            background: linear-gradient(90deg, rgba(79, 195, 247, 0.7), rgba(79, 195, 247, 0));
            filter: blur(10px);
        }
        .rocket-trail.active { opacity: 1; }

        .status-message {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 27px;
            text-align: center;
            color: #5a7a9a;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            z-index: 3;
        }

        /* شريط الجولات (History) - بتصميم مثل الصور */
        .history {
            margin: 12px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            direction: ltr;
            padding: 0 12px;
            scrollbar-width: none; 
        }
        .history::-webkit-scrollbar { display: none; }
        
        .history-item {
            flex: none;
            min-width: 55px;
            height: 28px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            background: rgba(15, 40, 71, 0.6);
            color: #7a9bcb;
            border: 1px solid rgba(100, 200, 255, 0.05);
        }
        .history-item.red { background: rgba(255, 79, 103, 0.12); color: #ff6b7f; border-color: rgba(255, 79, 103, 0.1); }
        .history-item.green { background: rgba(56, 210, 123, 0.1); color: #4de18a; border-color: rgba(56, 210, 123, 0.08); }
        .history-item.blue { background: rgba(79, 195, 247, 0.1); color: #4fc3f7; border-color: rgba(79, 195, 247, 0.08); }
        .history-item.purple { background: rgba(163, 86, 255, 0.1); color: #b986ff; border-color: rgba(163, 86, 255, 0.08); }
        .history-item.gold { background: rgba(255, 215, 0, 0.1); color: #ffd700; border-color: rgba(255, 215, 0, 0.08); }
        .history-item.fire { background: rgba(255, 107, 53, 0.1); color: #ff8a65; border-color: rgba(255, 107, 53, 0.08); }

        .bet-panel {
            margin: 14px 12px 0;
        }
        .place-bet-main {
            width: 100%;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, #1a5a9c, #0f3a7a, #1a5a9c);
            background-size: 200% 200%;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            border: 1px solid rgba(100, 200, 255, 0.15);
            box-shadow: 0 8px 30px rgba(50, 150, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            animation: betPulse 3s ease-in-out infinite;
        }
        @keyframes betPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .place-bet-main:active { transform: scale(0.98); }
        .place-bet-main.cashout-main {
            background: linear-gradient(135deg, #e1485e, #c92f4b);
            animation: none;
            box-shadow: 0 8px 30px rgba(225, 72, 94, 0.3);
        }
        .place-bet-main.wait-main {
            background: linear-gradient(135deg, #1a2a4a, #0f1a30);
            color: #5a7a9a;
            animation: none;
            box-shadow: none;
        }
        .place-bet-main.queued-main {
            background: linear-gradient(135deg, #1a2a4a, #0f1a30);
            color: #5a7a9a;
            animation: none;
            box-shadow: none;
        }

        .players-panel {
            margin: 12px;
            padding: 13px;
            border-radius: 20px;
            background: rgba(10, 26, 48, 0.6);
            border: 1px solid rgba(100, 200, 255, 0.06);
            backdrop-filter: blur(10px);
        }
        .players-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .players-title strong { font-size: 13px; color: #e8f4ff; }
        .players-count { color: #5a7a9a; font-size: 10px; }
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .player-row {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 9px;
            border-radius: 14px;
            background: rgba(15, 40, 71, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.04);
            transition: all 0.3s ease;
        }
        .player-row.player-winner { background: rgba(56, 210, 123, 0.08); border-color: rgba(56, 210, 123, 0.15); }
        .player-row.player-loser { background: rgba(255, 79, 103, 0.06); border-color: rgba(255, 79, 103, 0.1); }
        .player-left {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        .player-avatar {
            width: 43px;
            height: 43px;
            flex: none;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #0f2847, #1a3a6c);
            border: 2px solid rgba(100, 200, 255, 0.1);
            transition: all 0.3s ease;
        }
        .player-avatar.winner { border-color: #4de18a; box-shadow: 0 0 20px rgba(56, 210, 123, 0.2); }
        .player-avatar.loser { border-color: #ff6b7f; box-shadow: 0 0 20px rgba(255, 79, 103, 0.1); filter: grayscale(0.3); }
        .player-info { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .player-name {
            max-width: 125px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 800;
            color: #c8e6ff;
        }
        .player-name.winner { color: #4de18a; }
        .player-name.loser { color: #ff6b7f; }
        .player-status { font-size: 9px; color: #5a7a9a; margin-top: 3px; }
        .player-bet-line {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            direction: ltr;
        }
        .player-bet-amount,
        .player-live-multiplier {
            font-size: 9px;
            font-weight: 900;
            background: rgba(79, 195, 247, 0.08);
            color: #4fc3f7;
            padding: 4px 6px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .player-live-multiplier { min-width: 48px; text-align: center; }
        .player-bet-amount.winner,
        .player-live-multiplier.winner { color: #4de18a; background: rgba(56, 210, 123, 0.08); }
        .player-bet-amount.loser,
        .player-live-multiplier.loser { color: #ff6b7f; background: rgba(255, 79, 103, 0.08); }
        .player-current-value {
            min-width: 73px;
            height: 39px;
            padding: 0 8px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(79, 195, 247, 0.06);
            color: #4fc3f7;
            font-size: 11px;
            font-weight: 900;
            direction: ltr;
            white-space: nowrap;
            border: 1px solid rgba(79, 195, 247, 0.05);
            transition: all 0.3s ease;
        }
        .player-current-value.winner { color: #4de18a; background: rgba(56, 210, 123, 0.08); border-color: rgba(56, 210, 123, 0.08); }

            padding: 14px;
            text-align: center;
            border: 1px solid rgba(100, 200, 255, 0.04);
        }
        .profile-stat strong { display: block; font-size: 18px; font-weight: 900; color: #e8f4ff; }
        .profile-stat span { color: #7a9bcb; font-size: 11px; margin-top: 4px; display: block; }
        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .profile-actions button {
            background: rgba(15, 40, 71, 0.6);
            color: #c8e6ff;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 14px;
            border: 1px solid rgba(100, 200, 255, 0.06);
            transition: all 0.3s ease;
        }
        .profile-actions button:active { transform: scale(0.97); }

        .vip-section { margin: 16px 0; }
        .vip-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e8f4ff;
        }
        .vip-title span { color: #7a9bcb; font-size: 12px; font-weight: 400; }
        .vip-current {
            background: linear-gradient(145deg, #0f2847, #0a1a30);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 12px;
        }
        .vip-current-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .vip-current-name { font-size: 18px; font-weight: 900; color: #ffd700; }
        .vip-current-turnover { color: #7a9bcb; font-size: 12px; }
        .vip-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .vip-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #ffd700);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .vip-progress-text { font-size: 11px; color: #7a9bcb; margin-top: 6px; }
        .vip-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .vip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(15, 40, 71, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(100, 200, 255, 0.03);
        }
        .vip-item.current { border-color: rgba(255, 215, 0, 0.15); background: rgba(255, 215, 0, 0.04); }
        .vip-item.locked { opacity: 0.5; }
        .vip-item-name { font-weight: 700; font-size: 13px; color: #c8e6ff; }
        .vip-item-name .icon { margin-right: 6px; }
        .vip-item-requirement { font-size: 11px; color: #7a9bcb; }
        .vip-item-status { font-size: 11px; font-weight: 700; }
        .vip-item-status.unlocked { color: #4de18a; }
        .vip-item-status.locked { color: #ff6b7f; }
        .vip-item-status.current { color: #ffd700; }

        .language-selector {
            margin: 12px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .language-btn {
            background: rgba(15, 40, 71, 0.6);
            color: #c8e6ff;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid rgba(100, 200, 255, 0.06);
            transition: all 0.3s ease;
            flex: 1;
            min-width: 80px;
        }
        .language-btn.active { border-color: #4fc3f7; background: rgba(79, 195, 247, 0.08); color: #4fc3f7; }
        .language-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="profile-box">
                <img id="user-avatar" class="avatar" src="" alt="">
                <div class="profile-info">
                    <div id="profile-name" class="profile-name">اللاعب</div>
                    <div id="profile-id" class="profile-id">Telegram</div>
                    <div id="admin-badge" class="admin-badge">ADMIN</div>
                </div>
            </div>
            <div class="wallet-area">
                <button id="ton-wallet-box" class="wallet-balance" type="button" onclick="openTonWallet()">
                    <span class="ton-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <defs><linearGradient id="tonGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4fc3f7"/><stop offset="100%" style="stop-color:#0288d1"/></linearGradient></defs>
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5.5H7.5l3.5-7 3.5 7H13v5.5h-2zm5-5.5h-2.5l-2.5-5h2.5l2.5 5z"/>
                        </svg>
                    </span>
                    <span id="ton-balance">0.00</span>
                    <span style="font-size:10px;color:#5a7a9a;font-weight:700;">TON</span>
                </button>
                <button class="deposit-button" type="button" onclick="openDeposit()">+</button>
            </div>
        </header>

        <!-- GAME HUB -->
        <div id="game-hub" class="game-hub">
            <div class="game-hub-title">🎁 <span class="highlight">Epic Gift</span></div>
            <div class="games-grid">
                <div class="game-card premium" onclick="openRocketGame()">
                    <div class="game-card-bg" style="background: radial-gradient(ellipse at 30% 20%, #1a3a6c, #0f2847);">
                        <svg class="game-icon-svg" viewBox="0 0 100 100">
                            <path d="M50 5 L65 40 L95 45 L65 60 L80 90 L50 65 L20 90 L35 60 L5 45 L35 40 Z" fill="#4fc3f7" opacity="0.9"/>
                            <circle cx="50" cy="45" r="12" fill="#fff" opacity="0.2"/>
                        </svg>
                    </div>
                    <div class="game-info">
                        <div class="game-name-row">
                            <span class="game-name">ROCKET</span>
                            <span class="badge hot">HOT!</span>
                            <span class="badge live">● Live</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ROCKET GAME -->
        <div id="rocket-game" class="rocket-game-container hidden">
            <div style="padding:4px 12px 0;display:flex;align-items:center;gap:10px;">
                <button class="back-button show" type="button" onclick="closeRocketGame()" style="display:flex;align-items:center;gap:6px;background:rgba(15,40,71,0.6);color:#7a9bcb;font-size:14px;font-weight:700;padding:6px 14px;border:1px solid rgba(100,200,255,0.06);border-radius:12px;" id="back-to-hub-btn">
                    ← Back
                </button>
                <span style="font-size:14px;font-weight:700;color:#4fc3f7;">🚀 Rocket</span>
            </div>

            <main>
                <section class="game-card">
                    <div class="stars"></div>
                    <div class="fog-effect"></div>
                    <div class="game-top">
                        <div id="round-label" class="round-label">ROUND #—</div>
                    </div>
                    
                    <!-- عداد الدائرة -->
                    <div id="countdown-container" class="countdown-container">
                        <div class="countdown-circle"></div>
                        <div id="countdown-progress" class="countdown-progress"></div>
                        <div class="countdown-inner">
                            <div id="countdown" class="countdown-num">5</div>
                            <div id="countdown-txt" class="countdown-txt">Seconds</div>
                        </div>
                    </div>

                    <!-- رقم المضاعف الكبير -->
                    <div id="multiplier" class="multiplier waiting">1.00x</div>

                    <div class="rocket-area">
                        <div id="flight-line" class="flight-line"></div>
                        <div id="rocket-trail" class="rocket-trail"></div>
                        <div id="flame" class="flame"></div>
                        <div id="rocket" class="rocket"></div>
                    </div>
                    <div id="status-message" class="status-message">الاتصال بالسيرفر...</div>
                </section>

                <!-- شريط الجولات في الأعلى بجانب زر الرهان -->
                <section id="history" class="history"></section>

                <section class="bet-panel">
                    <button id="main-bet-button" class="place-bet-main" type="button" onclick="handleMainBetButton()">Place bet</button>
                </section>
                
                <section class="players-panel">
                    <div class="players-title">
                        <strong id="players-title-text">اللاعبين</strong>
                        <span id="players-count" class="players-count">0</span>
                    </div>
                    <div id="players-list" class="players-list"></div>
                </section>
            </main>
        </div>

        <!-- MODALS AND OTHER PAGES SAME AS BEFORE (Deposit, Profile, Top, etc) -->
        <!-- تم حذف باقي المودالات والصفوف لأنها لم تتغير لحل مشكلتك، لكن يمكنك نسخها من الكود السابق -->
        
    </div>

    <script>
        // =========================================================
        // 1. BACKEND URL
        // =========================================================
        const BACKEND_URL = "https://my-rocket-production.up.railway.app";

        // =========================================================
        // 2. TOKEN MANAGEMENT
        // =========================================================
        let authToken = null;

        async function authenticateUser() {
            try {
                const initData = window.Telegram?.WebApp?.initData || '';
                if (!initData) return;
                const response = await fetch(`${BACKEND_URL}/api/auth`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await response.json();
                if (data.ok) {
                    authToken = data.token; localStorage.setItem('authToken', authToken);
                    await fetchBalance(); await fetchUserGifts();
                }
            } catch (error) { console.error('Auth error:', error); }
        }

        function getAuthHeaders() {
            const token = authToken || localStorage.getItem('authToken');
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        async function fetchBalance() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/balance`, { headers: getAuthHeaders() });
                const data = await response.json();
                if (data.ok) { tonBalance = data.balance; updateTonWalletUI(); }
            } catch (error) { console.error('Balance error:', error); }
        }

        async function fetchUserGifts() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/gifts`, { headers: getAuthHeaders() });
                const data = await response.json();
                if (data.ok) { userGifts = data.gifts || []; }
            } catch (error) { userGifts = []; }
        }

        // =========================================================
        // 3. TELEGRAM INIT
        // =========================================================
        const tg = window.Telegram?.WebApp;
        if (tg) { try { tg.expand(); tg.ready(); } catch (e) {} }
        const telegramUser = tg?.initDataUnsafe?.user || {};
        const telegramId = String(telegramUser.id || "guest");
        const firstName = telegramUser.first_name || "اللاعب";
        const fullName = `${firstName} ${telegramUser.last_name || ""}`.trim();
        const userPhoto = telegramUser.photo_url || "";

        // =========================================================
        // 4. GAME STATE (حركة ناعمة - Animation Frame)
        // =========================================================
        let currentRoundId = 0;
        let currentMultiplier = 1.00;
        let displayMultiplier = 1.00; // نستخدم هذا للحركة الناعمة
        let gamePhase = "COUNTDOWN";
        let countdownSeconds = 5;
        let globalHistory = [];
        let livePlayers = [];
        let hasBet = false;
        let playedThisRound = false;
        let isQueuedForNextRound = false;
        let actionInProgress = false;
        let autoCashoutEnabled = false;
        let autoCashoutTarget = 2.00;
        let userBetAmount = 1.00;
        let tonBalance = 0;
        let selectedBetType = "TON";
        let selectedGiftId = null;
        let selectedGiftForBet = null;
        let currentBetId = null;

        // متغيرات عداد الجولة القادمة
        let countdownStartTime = 0;
        let countdownDuration = 5 * 1000; // 5 ثواني بالمللي ثانية
        let countdownAnimationFrame = null;

        // =========================================================
        // 5. UI UPDATES
        // =========================================================
        function updateTonWalletUI() {
            const box = document.getElementById("ton-wallet-box");
            if (box) box.innerHTML = `<span class="ton-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5.5H7.5l3.5-7 3.5 7H13v5.5h-2zm5-5.5h-2.5l-2.5-5h2.5l2.5 5z"/></svg></span><span id="ton-balance">${Number(tonBalance).toFixed(2)}</span> TON`;
        }

        // =========================================================
        // 6. ANIMATION LOOP (الصقيع للحركة الناعمة للمضاعف والعداد)
        // =========================================================
        function animateGame() {
            if (gamePhase === "FLIGHT") {
                // تحريك المضاعف بسلاسة نحو الرقم الجديد
                const diff = currentMultiplier - displayMultiplier;
                if (Math.abs(diff) > 0.001) {
                    displayMultiplier += diff * 0.15; // نسبة النعومة (كلما قل الرقم، زادت النعومة)
                    if (Math.abs(diff) < 0.001) displayMultiplier = currentMultiplier;
                    
                    const multEl = document.getElementById("multiplier");
                    if (multEl) multEl.textContent = displayMultiplier.toFixed(2) + "x";
                    
                    // تحديث الصاروخ بناءً على الحركة
                    const progress = Math.min(Math.max((displayMultiplier - 1) / 8, 0), 1);
                    moveRocket(progress);
                }
            } else if (gamePhase === "COUNTDOWN") {
                // تحديث عداد الدائرة بسلاسة
                const now = Date.now();
                const elapsed = now - countdownStartTime;
                
                if (elapsed < countdownDuration) {
                    const remaining = (countdownDuration - elapsed) / 1000;
                    const displaySec = Math.ceil(remaining);
                    document.getElementById("countdown").textContent = displaySec;
                    
                    // تحديث تقدم الدائرة (تفرغ الدائرة)
                    const rotation = (elapsed / countdownDuration) * 360;
                    document.getElementById("countdown-progress").style.transform = `rotate(${rotation - 45}deg)`;
                    
                    // إخفاء المضاعف أثناء العداد
                    document.getElementById("multiplier").classList.remove("flying");
                } else {
                    // الانتقال لمرحلة الطيران
                    gamePhase = "FLIGHT";
                    document.getElementById("countdown-container").classList.remove("show");
                    document.getElementById("multiplier").classList.add("flying");
                }
            }
            
            requestAnimationFrame(animateGame);
        }

        function moveRocket(progress) {
            const rocket = document.getElementById("rocket");
            const rocketTrail = document.getElementById("rocket-trail");
            const flame = document.getElementById("flame");

            if (!rocket) return;
            rocket.style.left = `${15 + progress * 58}%`;
            rocket.style.bottom = `${74 + progress * 120}px`;
            rocket.style.transform = `rotate(${-12 - progress * 15}deg)`;

            if (rocketTrail) {
                rocketTrail.classList.add("active");
                rocketTrail.style.left = `${Math.max(4, 7 + progress * 53)}%`;
                rocketTrail.style.bottom = `${79 + progress * 120}px`;
                rocketTrail.style.width = `${125 + progress * 25}px`;
            }
            if (flame) flame.style.display = "block";
        }

        // =========================================================
        // 7. SERVER STATE FETCH
        // =========================================================
        async function fetchGameState() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/game/state`, { headers: getAuthHeaders() });
                const data = await response.json();
                if (data.ok) {
                    const state = data.state;
                    
                    // إخفاء العداد إذا دخلنا في مرحلة الطيران
                    if (state.phase === "FLIGHT") {
                        document.getElementById("countdown-container").classList.remove("show");
                        document.getElementById("multiplier").classList.add("flying");
                    }

                    // إذا بدأ عداد جديد، نحدث الوقت
                    if (state.phase === "COUNTDOWN") {
                        if (gamePhase !== "COUNTDOWN") {
                            countdownStartTime = Date.now();
                            countdownDuration = state.seconds * 1000;
                            document.getElementById("countdown-container").classList.add("show");
                            document.getElementById("multiplier").classList.remove("flying");
                        }
                        document.getElementById("countdown-txt").textContent = "Seconds";
                    }

                    // تحديث المضاعف
                    currentMultiplier = state.multiplier;
                    
                    // إذا انفجرت الجولة
                    if (state.phase === "CRASH") {
                        document.getElementById("multiplier").classList.add("crashed");
                        document.getElementById("multiplier").textContent = currentMultiplier.toFixed(2) + "x";
                        
                        // هدم الصاروخ
                        const rocket = document.getElementById("rocket");
                        rocket.classList.add("crashed");
                        document.getElementById("flame").style.display = "none";
                    } else {
                        document.getElementById("multiplier").classList.remove("crashed");
                        const rocket = document.getElementById("rocket");
                        rocket.classList.remove("crashed");
                    }

                    if (state.phase === "CRASH" && document.getElementById("countdown-container").classList.contains("show")) {
                        document.getElementById("countdown-container").classList.remove("show");
                    }

                    currentRoundId = state.roundId;
                    gamePhase = state.phase;
                    globalHistory = state.history || [];
                    renderHistory();
                    updateMainBetButton();
                }
            } catch (error) {
                console.error('❌ Game state fetch error:', error);
            }
        }

        function connectToServer() {
            fetchGameState();
            setInterval(fetchGameState, 1000); // جلب كل ثانية فقط لتحديث البيانات، بينما الحركة تتم محلياً
            requestAnimationFrame(animateGame); // بدء حركة الأنيميشن
        }

        // =========================================================
        // 8. HISTORY
        // =========================================================
        function renderHistory() {
            const container = document.getElementById("history");
            if (!container) return;
            container.innerHTML = "";
            globalHistory.slice(0, 10).forEach(function(value) {
                const item = document.createElement("div");
                const n = Number(value);
                let cls = "history-item";
                if (n < 1.3) cls += " red";
                else if (n < 2) cls += " green";
                else if (n < 5) cls += " blue";
                else if (n < 9) cls += " purple";
                else if (n < 25) cls += " gold";
                else cls += " fire";
                item.className = cls;
                item.textContent = n.toFixed(2) + "x";
                container.appendChild(item);
            });
        }

        // =========================================================
        // 9. MAIN BET BUTTON
        // =========================================================
        function updateMainBetButton() {
            const button = document.getElementById("main-bet-button");
            if (!button) return;
            button.className = "place-bet-main";
            button.disabled = false;
            
            if (actionInProgress) { button.textContent = "Please wait..."; button.disabled = true; return; }
            if (hasBet) {
                if (gamePhase === "FLIGHT") {
                    button.classList.add("cashout-main");
                    button.textContent = "CASH OUT";
                } else {
                    button.classList.add("wait-main");
                    button.textContent = "BET ACTIVE";
                    button.disabled = true;
                }
                return;
            }
            if (isQueuedForNextRound) { button.classList.add("queued-main"); button.textContent = "BET QUEUED"; button.disabled = true; return; }
            button.textContent = "Place bet";
        }

        function handleMainBetButton() {
            if (actionInProgress) return;
            if (hasBet && gamePhase === "FLIGHT") { cashoutTon(); return; }
            if (isQueuedForNextRound) { showToast('تم حجز رهانك!'); return; }
            openBetModal();
        }

        // =========================================================
        // 10. CASHOUT AND BET (مختصر)
        // =========================================================
        async function cashoutTon() {
            if (!hasBet || gamePhase !== "FLIGHT") return;
            try {
                const response = await fetch(`${BACKEND_URL}/api/cashout/ton`, {
                    method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ betId: currentBetId })
                });
                const data = await response.json();
                if (data.ok) {
                    hasBet = false; playedThisRound = true; currentBetId = null;
                    showToast('💰 ' + data.payout.toFixed(2) + ' TON');
                    updateMainBetButton();
                    await fetchBalance();
                }
            } catch (error) {}
        }

        async function placeTonBet(amount) {
            const t = "Place bet";
            if (!authToken) { showToast('⚠️ Please authenticate first'); return; }
            try {
                const response = await fetch(`${BACKEND_URL}/api/bet/ton`, {
                    method: 'POST', headers: getAuthHeaders(),
                    body: JSON.stringify({ amount: amount, autoCashoutTarget: autoCashoutEnabled ? autoCashoutTarget : null })
                });
                const data = await response.json();
                if (data.ok) {
                    currentBetId = data.bet.betId; hasBet = true; playedThisRound = true;
                    closeModal('bet-modal');
                    updateMainBetButton();
                    showToast('✅ ' + amount.toFixed(2) + ' TON');
                }
            } catch (error) {}
        }

        // =========================================================
        // 11. MODALS (باختصار، نفس السابق)
        // =========================================================
        function openBetModal() {
            const modal = document.getElementById("bet-modal");
            if (modal) modal.classList.add("show");
        }
        
        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove("show");
        }
        
        function handleModalBet() {
            const amount = Number(document.getElementById("modal-amount-input").value);
            if (!amount || amount > tonBalance) { showToast("المبلغ غير صالح"); return; }
            placeTonBet(amount);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(function() { toast.classList.remove("show"); }, 2500);
        }

        // =========================================================
        // 12. DOM READY
        // =========================================================
        document.addEventListener("DOMContentLoaded", async function() {
            const avatar = document.getElementById("user-avatar");
            if (userPhoto) avatar.src = userPhoto;
            else avatar.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="#182137"/><text x="50" y="58" text-anchor="middle" fill="#fff" font-size="42">${firstName.charAt(0)}</text></svg>`);
            document.getElementById("profile-name").textContent = fullName;

            await authenticateUser();

            // إظهار اللعبة والاتصال
            document.getElementById("game-hub").classList.remove("hidden");
            connectToServer();
        });
    </script>
</body>
