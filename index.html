<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rocket Cash</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #07080c;
            color: #fff;
            margin: 0;
            padding: 12px;
            overflow: hidden;
            user-select: none;
        }

        #wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            box-sizing: border-box;
        }

        #container {
            position: relative;
            width: 100%;
            height: 32vh;
            background: radial-gradient(#151c24, #07080c);
            border-radius: 24px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #mult {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            font-weight: 900;
            color: #66fcf1;
            font-family: monospace;
            z-index: 10;
        }

        #count-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: 900;
            display: none;
            z-index: 15;
            animation: zPop 0.4s ease-out infinite alternate;
        }

        @keyframes zPop {
            0% {
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

        #history-bar {
            display: flex;
            gap: 6px;
            padding: 6px 0;
            overflow-x: auto;
            min-height: 35px;
            align-items: center;
        }

        .h-item {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #4e9f3d;
        }

        .c-red {
            border-color: #e94560;
            color: #e94560;
            background: rgba(233, 69, 96, 0.15);
        }

        .c-blue {
            border-color: #0066ff;
            color: #0066ff;
            background: rgba(0, 102, 255, 0.15);
        }

        .c-green {
            border-color: #4e9f3d;
            color: #4e9f3d;
            background: rgba(78, 159, 61, 0.15);
        }

        .c-orange {
            border-color: #ffa500;
            color: #ffa500;
            background: rgba(255, 165, 0, 0.15);
        }

        .c-yellow {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }

        #main-action-btn {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        #main-action-btn.betting {
            background: #e94560;
        }

        #bet-panel {
            background: #181c26;
            border-radius: 24px 24px 0 0;
            padding: 16px;
            box-sizing: border-box;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: none;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-bar {
            display: flex;
            background: #0f121a;
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8a9fc4;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #b05cff;
            color: #fff;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 14px;
            color: #8a9fc4;
        }

        .row-val {
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-box {
            background: #0f121a;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .input-label {
            font-size: 12px;
            color: #516381;
            margin-bottom: 6px;
        }

        .input-field {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .currency-tag {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #0066ff;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2c354a;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #0066ff;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        #submit-bet-btn {
            background: linear-gradient(135deg, #3b4252 0%, #2e3440 100%);
            color: #8a9fc4;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
        }

        #submit-bet-btn.active {
            background: #0066ff;
            color: #fff;
        }

        #p-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 25vh;
            overflow-y: auto;
            flex-grow: 1;
        }

        .p-row {
            display: flex;
            justify-content: space-between;
            background: #131722;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .p-blue {
            color: #8a9fc4;
            font-size: 11px;
            font-weight: bold;
        }

        .row-win-low {
            background: rgba(78, 159, 61, 0.08) !important;
            border: 1px solid rgba(78, 159, 61, 0.4) !important;
        }

        .row-win-low b {
            color: #4e9f3d !important;
        }

        .row-win-high {
            background: rgba(255, 215, 0, 0.08) !important;
            border: 1px solid rgba(255, 215, 0, 0.4) !important;
        }

        .row-win-high b {
            color: #ffd700 !important;
        }

        .row-lose {
            background: rgba(233, 69, 96, 0.06) !important;
            border: 1px solid rgba(233, 69, 96, 0.3) !important;
        }

        .row-lose b {
            color: #e94560 !important;
        }
    </style>
</head>

<body>

<div id="wrapper">

    <div id="container">
        <div id="mult">1.00x</div>
        <div id="count-box">5</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="control-panel">
        <div id="history-bar"></div>

        <button id="main-action-btn" onclick="openBetPanel()">
            Place bet
        </button>
    </div>

    <div id="p-list"></div>

    <div id="bet-panel">

        <div class="panel-header">
            <div class="panel-title">Place bet</div>

            <button class="close-btn" onclick="closeBetPanel()">
                ✕
            </button>
        </div>

        <div class="tab-bar">
            <button id="tab-gifts" class="tab-btn" onclick="switchTab('gifts')">
                Gifts
            </button>

            <button id="tab-ton" class="tab-btn active" onclick="switchTab('ton')">
                TON
            </button>
        </div>

        <div class="panel-row">
            <div>Available Balance</div>

            <div class="row-val">
                <span id="balance-display">10.00</span>
                <span id="currency-unit">💎</span>
            </div>
        </div>

        <div class="input-box">
            <div class="input-label">Bet Amount</div>

            <input
                type="number"
                id="bet-input"
                class="input-field"
                placeholder="TON amount"
                step="0.1"
                min="0.1"
                oninput="validateBetInput()"
            >

            <div id="input-tag" class="currency-tag">
                💎
            </div>
        </div>

        <div class="panel-row">
            <div>Auto cashout</div>

            <label class="switch">
                <input
                    type="checkbox"
                    id="auto-cash-toggle"
                    onchange="toggleAutoCashFields()"
                >
                <span class="slider"></span>
            </label>
        </div>

        <div class="input-box" id="auto-cash-box" style="display:none;">

            <div class="input-label">
                Cashout Multiplier
            </div>

            <input
                type="number"
                id="auto-cash-input"
                class="input-field"
                placeholder="e.g. 5.00"
                step="0.1"
                min="1.1"
            >

            <div class="currency-tag">
                X
            </div>
        </div>

        <button id="submit-bet-btn" onclick="submitBet()">
            Place TON Bet 🚀
        </button>

    </div>
</div>

<script>

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const mult = document.getElementById('mult');
    const mainBtn = document.getElementById('main-action-btn');
    const hBar = document.getElementById('history-bar');
    const pList = document.getElementById('p-list');
    const cBox = document.getElementById('count-box');

    const betPanel = document.getElementById('bet-panel');
    const betInput = document.getElementById('bet-input');
    const submitBetBtn = document.getElementById('submit-bet-btn');

    const balanceDisplay = document.getElementById('balance-display');
    const currencyUnit = document.getElementById('currency-unit');
    const inputTag = document.getElementById('input-tag');

    const autoToggle = document.getElementById('auto-cash-toggle');
    const autoCashBox = document.getElementById('auto-cash-box');
    const autoCashInput = document.getElementById('auto-cash-input');

    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    let state = 'COUNTDOWN';
    let value = 1.00;
    let crash = 1.00;
    let loop;

    let path = [];
    let rx = 40;
    let ry = canvas.height - 40;

    let timer = 5;
    let countAngle = 0;
    let listPlayers = [];
    let lastTickTime = Date.now();

    let hasBet = false;
    let hasCashedOut = false;

    let currentTab = 'ton';
    let userBalance = 10.00;
    let userBetAmount = 0;

    let historyList = [
        '3.70x',
        '3.07x',
        '11.26x',
        '5.64x',
        '1.00x'
    ];

    let stars = [];
    let particles = [];

    const pool = [
        {
            n: 'BOB',
            b: 0.10,
            cashOutPoint: 3.36,
            status: 'active'
        },
        {
            n: 'honey',
            b: 0.10,
            cashOutPoint: 2.27,
            status: 'active'
        },
        {
            n: 'Aho',
            b: 0.15,
            cashOutPoint: 2.23,
            status: 'active'
        },
        {
            n: 'kee',
            b: 0.25,
            cashOutPoint: 2.20,
            status: 'active'
        }
    ];

    for (let i = 0; i < 30; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            s: Math.random() * 1.5,
            sp: Math.random() * 1.2 + 0.6
        });
    }

    function getHColor(val) {
        if (val <= 1.30) return '#e94560';
        if (val <= 2.00) return '#0066ff';
        if (val <= 5.00) return '#4e9f3d';
        if (val <= 10.00) return '#ffa500';
        return '#ffd700';
    }

    function getHClass(val) {
        if (val <= 1.30) return 'c-red';
        if (val <= 2.00) return 'c-blue';
        if (val <= 5.00) return 'c-green';
        if (val <= 10.00) return 'c-orange';
        return 'c-yellow';
    }

    function updateHistoryUI() {
        hBar.innerHTML = '';

        historyList
            .slice(-6)
            .reverse()
            .forEach(v => {
                const d = document.createElement('div');

                d.className =
                    'h-item ' +
                    getHClass(parseFloat(v));

                d.innerText = v;

                hBar.appendChild(d);
            });
    }

    function openBetPanel() {

        if (state === 'COUNTDOWN' && !hasBet) {
            betPanel.style.display = 'block';

        } else if (
            state === 'FLYING' &&
            hasBet &&
            !hasCashedOut
        ) {
            cashOutUser();
        }
    }

    function closeBetPanel() {
        betPanel.style.display = 'none';
    }

    function switchTab(tab) {

        currentTab = tab;

        document
            .getElementById('tab-gifts')
            .classList.toggle('active', tab === 'gifts');

        document
            .getElementById('tab-ton')
            .classList.toggle('active', tab === 'ton');

        currencyUnit.innerText =
            tab === 'ton' ? '💎' : '🎁';

        inputTag.innerText =
            tab === 'ton' ? '💎' : '🎁';

        betInput.placeholder =
            tab === 'ton'
                ? 'TON amount'
                : 'NFT Gift ID';

        submitBetBtn.innerText =
            tab === 'ton'
                ? 'Place TON Bet 🚀'
                : 'Place Gift Bet 🎁';

        validateBetInput();
    }

    function toggleAutoCashFields() {
        autoCashBox.style.display =
            autoToggle.checked ? 'block' : 'none';
    }

    function validateBetInput() {

        let val = parseFloat(betInput.value);

        if (
            currentTab === 'ton' &&
            val >= 0.1 &&
            val <= userBalance
        ) {

            submitBetBtn.className = 'active';
            submitBetBtn.disabled = false;

        } else if (
            currentTab === 'gifts' &&
            betInput.value.length > 0
        ) {

            submitBetBtn.className = 'active';
            submitBetBtn.disabled = false;

        } else {

            submitBetBtn.className = '';
            submitBetBtn.disabled = true;
        }
    }

    function submitBet() {

        hasBet = true;

        userBetAmount =
            currentTab === 'ton'
                ? parseFloat(betInput.value)
                : 0.1;

        if (currentTab === 'ton') {

            userBalance -= userBetAmount;

            balanceDisplay.innerText =
                userBalance.toFixed(2);
        }

        mainBtn.innerText = 'Bet Placed';
        mainBtn.className = 'betting';

        closeBetPanel();
    }

    function triggerLiveBets() {

        let delay = 0;

        const shuffled =
            [...pool].sort(() => 0.5 - Math.random());

        shuffled.forEach(p => {

            p.status = 'active';
            p.winMult = 1.00;

            delay +=
                Math.random() * 400 + 100;

            setTimeout(() => {

                if (state === 'COUNTDOWN') {

                    listPlayers.unshift(p);

                    renderPlayers();
                }

            }, delay);
        });
    }

    function renderPlayers() {

        pList.innerHTML = '';

        listPlayers.forEach(p => {

            let rowClass = 'p-row';
            let rightVal = `🔹 ${p.b.toFixed(2)}`;

            if (p.status === 'win-low') {

                rowClass += ' row-win-low';

                rightVal =
                    `🔹 ${(p.b * p.winMult).toFixed(2)}`;

            } else if (p.status === 'win-high') {

                rowClass += ' row-win-high';

                rightVal =
                    `🔹 ${(p.b * p.winMult).toFixed(2)}`;

            } else if (p.status === 'lose') {

                rowClass += ' row-lose';

                rightVal = '💥 0.00';
            }

            let statText;

            if (p.status.startsWith('win')) {

                statText =
                    `🔹 ${p.b} ×${p.winMult.toFixed(2)}`;

            } else {

                statText =
                    `🔹 ${p.b} ×1.00`;
            }

            const r =
                document.createElement('div');

            r.className = rowClass;

            r.innerHTML = `
                <div>
                    <b>${p.n}</b><br>
                    <span class="p-blue">${statText}</span>
                </div>

                <div>
                    <b>${rightVal}</b>
                </div>
            `;

            pList.appendChild(r);
        });
    }

    function startCount() {

        state = 'COUNTDOWN';

        timer = 5;
        countAngle = 0;

        cBox.style.display = 'block';
        mult.style.display = 'none';

        hasBet = false;
        hasCashedOut = false;

        mainBtn.innerText = 'Place bet';
        mainBtn.className = '';

        cBox.innerText = timer;
        cBox.style.color = '#4e9f3d';

        mult.style.color = '#66fcf1';

        listPlayers = [];

        renderPlayers();

        triggerLiveBets();

        lastTickTime = Date.now();
    }

    function cashOutUser() {

        hasCashedOut = true;

        mainBtn.innerText = 'Place bet';
        mainBtn.className = '';

        if (currentTab === 'ton') {

            userBalance +=
                userBetAmount * value;

            balanceDisplay.innerText =
                userBalance.toFixed(2);
        }

        let userP = {
            n: 'You',
            b: userBetAmount,
            winMult: value,
            status:
                value >= 10.00
                    ? 'win-high'
                    : 'win-low'
        };

        listPlayers.unshift(userP);

        renderPlayers();
    }

    function syncLogic() {

        let now = Date.now();

        let delta =
            (now - lastTickTime) / 1000;

        lastTickTime = now;

        if (state === 'COUNTDOWN') {

            timer -= delta;

            cBox.innerText =
                Math.ceil(timer);

            if (timer <= 0) {

                cBox.style.display = 'none';
                mult.style.display = 'block';

                state = 'FLYING';

                value = 1.00;

                path = [];
                particles = [];

                if (hasBet) {

                    mainBtn.innerText = 'Cash Out';
                    mainBtn.className = 'betting';

                } else {

                    mainBtn.innerText = 'Place bet';
                    mainBtn.className = '';
                }

                let r = Math.random();

                if (r < 0.1) {

                    crash = 1.00;

                } else if (r < 0.65) {

                    crash =
                        Math.random() * 3 + 1.01;

                } else if (r < 0.9) {

                    crash =
                        Math.random() * 15 + 3;

                } else {

                    crash =
                        Math.random() * 132 + 18;
                }

                if (crash > 150) {
                    crash = 150;
                }
            }

        } else if (state === 'FLYING') {

            value += delta * 0.45;

            mult.innerText =
                value.toFixed(2) + 'x';

            if (
                hasBet &&
                !hasCashedOut &&
                autoToggle.checked &&
                value >= parseFloat(autoCashInput.value)
            ) {
                cashOutUser();
            }

            listPlayers.forEach(p => {

                if (
                    p.status === 'active' &&
                    value >= p.cashOutPoint &&
                    p.cashOutPoint < crash
                ) {

                    p.winMult =
                        p.cashOutPoint;

                    p.status =
                        p.cashOutPoint >= 10.00
                            ? 'win-high'
                            : 'win-low';

                    renderPlayers();
                }
            });

            if (value >= crash) {

                state = 'CRASHED';

                mult.innerText = '💥 FLEW AWAY';
                mult.style.color = '#e94560';

                historyList.push(
                    value.toFixed(2) + 'x'
                );

                listPlayers.forEach(p => {

                    if (p.status === 'active') {
                        p.status = 'lose';
                    }
                });

                if (
                    hasBet &&
                    !hasCashedOut
                ) {
                    mainBtn.innerText = 'Place bet';
                    mainBtn.className = '';
                }

                renderPlayers();

                if (navigator.vibrate) {
                    navigator.vibrate(300);
                }

                updateHistoryUI();

                setTimeout(startCount, 2500);
            }
        }
    }

    function draw() {

        syncLogic();

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = '#fff';

        stars.forEach(s => {

            ctx.beginPath();

            ctx.arc(
                s.x,
                s.y,
                s.s,
                0,
                Math.PI * 2
            );

            ctx.fill();

            if (state === 'FLYING') {

                s.x -= s.sp * 3.5;
                s.y += s.sp * 3.5;

            } else {

                s.x -= s.sp * 0.2;
                s.y += s.sp * 0.2;
            }

            if (s.x < 0) {
                s.x = canvas.width;
            }

            if (s.y > canvas.height) {
                s.y = 0;
            }
        });

        if (state === 'COUNTDOWN') {

            countAngle +=
                (Math.PI * 2) / 560;

            ctx.beginPath();

            ctx.arc(
                canvas.width / 2,
                canvas.height / 2,
                55,
                -Math.PI / 2,
                (Math.PI * 2 - countAngle) -
                    Math.PI / 2,
                false
            );

            ctx.strokeStyle = '#ff7a00';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        let currentColor =
            getHColor(value);

        if (path.length > 1) {

            ctx.save();

            ctx.beginPath();

            ctx.moveTo(
                path[0].x,
                path[0].y
            );

            for (
                let i = 1;
                i < path.length;
                i++
            ) {
                ctx.lineTo(
                    path[i].x,
                    path[i].y
                );
            }

            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = currentColor;

            ctx.stroke();

            ctx.restore();
        }

        if (state === 'FLYING') {

            if (Math.random() < 0.7) {

                particles.push({
                    x: rx,
                    y: ry,
                    vx: (Math.random() - 0.7) * 2,
                    vy: (Math.random() + 0.3) * 2.5,
                    size: Math.random() * 1.8 + 0.5,
                    alpha: 1
                });
            }
        }

        particles.forEach((p, index) => {

            ctx.save();

            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = currentColor;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;

            if (p.alpha <= 0) {
                particles.splice(index, 1);
            }
        });

        if (state === 'FLYING') {

            mult.style.color =
                currentColor;

            let p =
                value <= 10.00
                    ? (
                        ((value - 1.00) / 9.00) *
                        0.45
                    )
                    : (
                        0.45 +
                        (
                            (value - 10.00) /
                            (crash > 10
                                ? crash - 10
                                : 1)
                        ) *
                        0.37
                    );

            if (p > 0.82) {
                p = 0.82;
            }

            if (value <= 2.00) {

                rx =
                    40 +
                    (canvas.width - 80) *
                    p *
                    1.5;

                ry =
                    canvas.height - 40;

            } else {

                rx =
                    40 +
                    (canvas.width - 80) *
                    p;

                let cProg =
                    (value - 2.00) /
                    (crash > 2
                        ? crash - 2
                        : 1);

                ry =
                    (canvas.height - 40) -
                    Math.min(
                        canvas.height - 90,
                        (rx - 40) *
                        Math.sqrt(3) *
                        cProg *
                        0.7
                    );
            }

            if (p >= 0.82) {

                rx +=
                    (Math.random() - 0.5) * 3;

                ry +=
                    (Math.random() - 0.5) * 3;
            }

            path.push({
                x: rx,
                y: ry
            });

            ctx.save();

            ctx.translate(rx, ry);

            ctx.rotate(-Math.PI / 3);

            ctx.fillStyle = '#f0f2f5';

            ctx.beginPath();

            ctx.moveTo(0, -16);
            ctx.lineTo(7, 4);
            ctx.lineTo(-7, 4);

            ctx.closePath();

            ctx.fill();

            ctx.restore();

        } else if (state === 'CRASHED') {

            ctx.font = '40px Arial';

            ctx.fillText(
                '💥',
                rx,
                ry
            );
        }

        loop = requestAnimationFrame(draw);
    }

    updateHistoryUI();
    draw();
    startCount();

</script>

</body>
</html>
